# Configuração do SonarCloud (qualidade do código). A esteira usa este arquivo em sonarcloud.yml.
# Organização e projeto: os nomes que o SonarCloud criou ao importar o repositório do GitHub.
sonar.organization=daniloortega
sonar.projectKey=DaniloOrtega_arquiteto-de-bolso
sonar.projectName=Arquiteto de Bolso

# Código do site (o JavaScript mora dentro do index.html) e código dos testes, separados.
sonar.sources=index.html,sw.js
sonar.tests=tests,playwright.config.js
sonar.sourceEncoding=UTF-8

# Cobertura: ainda não medimos quanto do código os testes executam (o E2E roda num navegador
# de verdade). Sem isso, o portão de qualidade reprovaria todo PR por "0% de cobertura".
# Quando a gente medir a cobertura, esta linha sai.
sonar.coverage.exclusions=**/*

# Faz o job esperar a nota do SonarCloud e falhar se o portão de qualidade reprovar.
sonar.qualitygate.wait=true
