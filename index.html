["ops",4,"Uma empresa quer estimar a capacidade necessária para o próximo ano e evitar tanto a falta quanto o excesso. Qual abordagem é mais adequada?",

["fin",1,"O que é FinOps?",

["fin",1,"Para que serve um orçamento (budget) com alerta?",

["fin",1,"O que é rightsizing?",

["fin",1,"Em geral, como funciona a cobrança do tráfego de dados na nuvem?",

["fin",1,"A fatura dobrou e ninguém sabe o motivo. Qual é o primeiro passo?",
 ["Analisar o relatório de custos por serviço e etiqueta", "Cancelar a conta de nuvem até entender o que houve", "Reduzir todas as VMs sem analisar o uso real de cada uma delas", "Ignorar o aumento até o fim do ano fiscal"],
 "Ferramentas como AWS Cost Explorer, Azure Cost Management e o Cost Analysis da OCI mostram onde o gasto cresceu. O diagnóstico vem antes de qualquer corte.","vis"],
["fin",2,"Uma carga roda 24 horas por dia, há mais de um ano, com uso estável. Qual modalidade de compra tende a ser mais econômica?",
 ["Compromisso de uso (instância reservada ou savings plan)", "Sob demanda, pagando por hora de uso, sem nenhum compromisso de prazo ou de gasto mínimo", "Instâncias spot, com possibilidade de interrupção a qualquer momento e desconto sobre o preço padrão", "Uma instância maior, para ter folga de capacidade e evitar que a carga estável sofra picos"],

["fin",2,"Uma estratégia de etiquetas (tags) de custo precisa ser útil para dividir a fatura. Qual conjunto de etiquetas é o mais prático?",
 ["Equipe, projeto, ambiente e centro de custo, com nomes e valores padronizados em toda a empresa", "Um nome livre escolhido por cada pessoa, sem padrão, conforme o que for mais fácil de lembrar", "Apenas o nome do servidor e o nome do sistema operacional instalado em cada um deles", "Somente a data de criação do recurso e o usuário que o criou no console da nuvem"],

["fin",2,"Uma VM usa em média 8% de CPU e 15% de memória ao longo de 30 dias. Qual ação de FinOps é a mais indicada?",

["fin",2,"Os custos de transferência de dados subiram porque uma aplicação envia grandes arquivos para usuários na internet. Qual medida costuma reduzir a conta?",

 "Muitas CDNs têm preços de saída menores que os da origem e guardam o conteúdo em cache, reduzindo as saídas da origem. Também melhoram a latência para o usuário.","otm"],
["fin",2,"Qual a diferença entre um orçamento (budget) e uma previsão (forecast) de custos?",
 ["O orçamento é o limite planejado; a previsão é a estimativa do que será gasto, com base no uso real", "O orçamento é o gasto já realizado no mês; a previsão é o limite que foi planejado no início do ano", "São o mesmo documento, com nomes diferentes, e ambos são revisados uma vez por ano", "A previsão só vale para o ano anterior, e o orçamento só vale para o próximo ano fiscal"],

["fin",2,"Dados de log com mais de 90 dias raramente são lidos, mas precisam ser guardados por 5 anos. Qual prática reduz o custo?",

["fin",2,"Qual métrica relaciona o custo da nuvem ao valor entregue ao negócio?",

["fin",2,"Qual a diferença principal entre uma instância reservada padrão e um savings plan?",

["fin",3,"Uma empresa compra compromisso para 100% do uso atual de computação, e depois migra parte para contêineres e serverless. Qual o risco?",

["fin",3,"Uma equipe usa instâncias spot para um sistema de processamento em lote. Qual prática reduz o impacto de interrupções?",

["fin",3,"Um alerta de anomalia de custo dispara: o gasto dobrou em 2 dias. Qual a primeira ação adequada?",

["fin",3,"Uma empresa quer que cada área veja e seja responsável pelo próprio gasto de nuvem, sem cobrança interna formal. Qual modelo é esse?",

["fin",3,"Duas arquiteturas atendem o mesmo requisito: A custa R$ 10 mil por mês e entrega 99,9%; B custa R$ 18 mil e entrega 99,99%. Como a decisão deve ser tomada?",

["fin",3,"Uma empresa usa um banco de dados de produção em instância grande, mas a utilização média de CPU é de 8% há três meses. Qual é a ação de FinOps mais adequada?",

["fin",4,"Qual a ordem das fases do ciclo do FinOps Framework?",

["fin",4,"A previsão de gastos erra em 30% todo mês. Qual melhoria costuma ser a mais eficaz?",

["fin",4,"Uma empresa quer desligar ambientes de desenvolvimento fora do horário comercial, mas as equipes se preocupam com perda de dados. Qual abordagem é segura?",

["fin",4,"O custo de armazenamento cresce 15% ao mês, e ninguém sabe quais dados ainda são necessários. Qual conjunto de ações é o mais adequado?",

["sw",2,"Qual a diferença entre comunicação síncrona e assíncrona entre serviços?",

["sw",2,"O que diferencia uma entidade de um objeto de valor em DDD?",

["sw",2,"Qual a vantagem de uma API REST ser stateless (sem estado de sessão no servidor)?",
 ["Cada requisição traz o necessário para ser atendida, o que facilita escalar e balancear a carga", "O servidor nunca precisa de um banco de dados, pois guarda todo o estado da sessão do usuário em memória", "Os clientes não precisam se autenticar, pois o servidor reconhece cada um pela conexão", "As requisições se tornam sempre mais rápidas, pois o servidor guarda o contexto de cada uma"],
 "Sem estado de sessão no servidor, qualquer instância pode atender qualquer requisição, e a escala horizontal fica simples. A autenticação e o contexto vêm em cada requisição (por exemplo, em tokens).","int"],
["sw",2,"Uma API recebe a mesma requisição de pagamento duas vezes por falha de rede do cliente. Qual mecanismo evita cobrar duas vezes?",
 ["Chave de idempotência enviada pelo cliente e verificada pelo servidor antes de processar o pagamento", "Aumentar o tempo limite das requisições de pagamento, para que o cliente espere mais antes de reenviar", "Cobrar apenas quando o cliente reenviar a requisição, tratando o primeiro envio como uma tentativa", "Remover a validação dos dados do pagamento, para que a segunda requisição seja ignorada"],
 "Com uma chave de idempotência única por operação, o servidor reconhece a repetição e devolve o resultado anterior em vez de processar de novo. É essencial em operações financeiras.","int"],
["sw",2,"Qual a principal desvantagem de um monólito grande com muitos times mexendo no mesmo código?",
 ["Mudanças em partes diferentes se afetam, aumentando conflitos e o risco de cada publicação", "O monólito não pode usar banco de dados relacional, pois todos os módulos o compartilham", "O monólito só funciona em um único servidor físico, e não pode ser executado em nuvem", "O monólito sempre custa mais caro que microsserviços, qualquer que seja o tamanho da equipe"],
 "Com muitos times no mesmo código e na mesma publicação, cresce a coordenação e o impacto de cada mudança. Uma modularização interna ou a divisão em serviços pode reduzir isso, mas tem seu próprio custo.","est"],
["sw",2,"Qual o objetivo de versionar uma API pública (por exemplo, /v1 e /v2)?",
 ["Permitir mudanças incompatíveis sem quebrar clientes que usam a versão antiga", "Aumentar a velocidade das respostas, ao separar o tráfego das versões novas e antigas", "Reduzir o tamanho das mensagens trocadas, removendo campos que os clientes já não usam", "Evitar a autenticação nas versões antigas da API, que passam a ser abertas para qualquer cliente existente"],
 "Quando a API muda de forma incompatível, uma nova versão convive com a antiga e dá tempo aos clientes de migrar. Sem versionamento, qualquer mudança arrisca quebrar integrações.","int"],
["sw",2,"Qual requisito não funcional está mais diretamente ligado à capacidade de modificar o sistema com facilidade?",
 ["Manutenibilidade", "Disponibilidade", "Latência de resposta medida no percentil 99, em milissegundos por requisição", "Escalabilidade"],
 "Manutenibilidade descreve quão fácil é entender, alterar e testar o sistema. Disponibilidade, latência e escalabilidade tratam de operação, tempo de resposta e capacidade de crescimento.","dec"],
["sw",3,"Em DDD, qual a função de um agregado (aggregate) e de sua raiz?",
 ["Definir uma fronteira de consistência, em que todas as alterações passam pela raiz", "Armazenar todos os dados do sistema em uma única tabela, acessada por qualquer módulo", "Substituir o uso de APIs entre serviços por chamadas diretas ao banco de dados do outro", "Distribuir as requisições entre bancos de dados, conforme a região de cada usuário"],
 "O agregado agrupa entidades e valores que devem ser consistentes juntos. A raiz é o único ponto de acesso, e as regras do negócio (invariantes) são verificadas a cada alteração.","ddd"],
["sw",3,"O que é o padrão CQRS (separação de responsabilidade entre comandos e consultas)?",
 ["Modelos separados para alterar dados e para consultá-los, que podem ter bancos distintos", "Um único modelo para escrever e ler os dados, mais simples de manter e sem nenhuma separação de bancos", "Uma técnica de compressão de dados usada para reduzir o tamanho das mensagens em filas", "Um protocolo de autenticação entre serviços, que separa as credenciais de leitura e escrita"],
 "No CQRS, o lado de comandos trata das regras e da escrita, e o lado de consultas é otimizado para leitura (por exemplo, visões desnormalizadas). Traz flexibilidade, mas também complexidade e consistência eventual.","res"],
["sw",3,"Um serviço A chama B, que chama C, e C fica lento. Em pouco tempo, A e B também travam. O que reduz esse risco?",
 ["Tempos limite curtos, circuit breaker e isolamento de recursos (bulkhead) entre as chamadas dos serviços", "Aumentar o tempo limite de todas as chamadas, para que o serviço lento tenha mais tempo", "Remover as tentativas de repetição, sem outros ajustes, e manter o tempo limite longo em todas as chamadas", "Colocar os três serviços no mesmo processo, sem nenhuma chamada de rede entre eles"],
 "Chamadas lentas ocupam threads e conexões de quem chama, propagando a falha. Limites de tempo, disjuntores e compartimentos (bulkheads) contêm o problema e mantêm o restante do sistema operando.","res"],
["sw",3,"Para integrar um sistema novo a um legado cujo modelo é confuso, qual padrão protege o domínio novo?",
 ["Camada anticorrupção, que traduz entre o modelo legado e o novo", "Cópia direta do modelo legado para o novo sistema, preservando os nomes e as regras antigas", "Compartilhar o banco de dados entre os dois sistemas", "Reescrever o legado por completo antes de qualquer integração com o sistema novo"],
 "A camada anticorrupção isola o novo domínio das estranhezas do legado, convertendo conceitos e dados nas fronteiras. Compartilhar o banco ou copiar o modelo espalha o acoplamento.","ddd"],
["sw",3,"Qual o objetivo do event sourcing?",
 ["Guardar os eventos que mudaram o estado, permitindo reconstruí-lo e auditar o histórico", "Guardar somente o estado atual de cada registro, para economizar espaço e simplificar as consultas feitas", "Enviar e-mails a cada alteração do sistema, para que os responsáveis fiquem sabendo de tudo o que acontece", "Evitar o uso de banco de dados, guardando as informações somente em arquivos de texto e em memória"],
 "No event sourcing a fonte da verdade é a sequência de eventos. É possível reconstruir o estado em qualquer momento e gerar novas visões. Exige cuidado com evolução dos eventos e consultas.","res"],
["sw",3,"Duas equipes discordam sobre o significado de cliente: para vendas é quem comprou, e para suporte é quem tem contrato ativo. Qual conceito de DDD ajuda?",
 ["Contextos delimitados (bounded contexts), em que cada contexto tem seu modelo e linguagem", "Um único modelo de cliente, definido pela diretoria e imposto a todas as áreas da empresa", "Um banco de dados central com uma tabela chamada cliente, usada por vendas, suporte e financeiro juntos", "Um glossário em que a palavra cliente é proibida, e cada equipe usa um termo próprio"],
 "Um mesmo termo pode ter significados diferentes conforme o contexto. Delimitar contextos permite modelos próprios e traduções entre eles, em vez de forçar um modelo universal que não serve bem a ninguém.","ddd"],
["sw",3,"Um time quer dividir um monólito em microsserviços e propõe cortar por camadas técnicas (um serviço de interface, um de regras e um de dados). Qual a crítica mais pertinente?",
 ["Cada mudança de negócio atravessaria todos os serviços; é melhor dividir por capacidades do negócio", "Camadas técnicas são sempre a melhor divisão possível, pois cada equipe cuida de uma tecnologia", "Microsserviços não podem ter bancos de dados próprios, e por isso precisam de camadas", "A divisão por camadas reduz a latência das chamadas, pois aproxima cada serviço do banco"],
 "Cortar por camada técnica gera alto acoplamento: uma funcionalidade nova mexe em todos os serviços. Serviços alinhados a capacidades do negócio (e a contextos do domínio) mudam de forma mais independente.","est"],
["sw",3,"Um sistema legado tem lógica em procedimentos de banco de dados e telas muito acopladas. O negócio exige novas funcionalidades em semanas, mas sem reescrever tudo. Qual abordagem é a mais prudente?",
 ["Padrão strangler: criar funcionalidades novas ao redor e substituir partes do legado aos poucos", "Reescrever o sistema inteiro do zero antes de lançar qualquer funcionalidade nova ao negócio e aos usuários", "Parar as entregas por um ano inteiro para reestruturar o código e só então voltar a lançar", "Copiar o legado para um segundo sistema idêntico e fazer as novas funcionalidades nele"],
 "O strangler fig substitui o legado por partes, redirecionando funcionalidades gradualmente. Entrega valor ao longo do caminho e limita o risco, ao contrário de reescritas que adiam todo o retorno.","est"],
["sw",4,"Uma operação distribuída entre serviços de pedido, pagamento e estoque precisa manter a consistência sem transação distribuída. Qual padrão é o mais usado?",
 ["Saga, com passos locais e ações de compensação em caso de falha", "Transação distribuída em duas fases entre todos os serviços, mantendo bloqueios até que todos confirmem", "Um banco único compartilhado por todos, com bloqueios longos", "Ignorar falhas parciais e corrigir manualmente depois"],
 "Na saga cada serviço executa sua transação local e publica eventos. Se um passo falha, ações de compensação desfazem os anteriores (como estornar o pagamento). Evita bloqueios longos entre serviços.","res"],
["sw",4,"A equipe percebe que, mesmo com microsserviços, todos precisam ser publicados juntos a cada mudança. Qual o diagnóstico mais provável?",
 ["Acoplamento excessivo entre serviços, o que forma um monólito distribuído e exige publicações conjuntas", "Falta de servidores suficientes em produção para publicar cada serviço de forma independente", "Uso excessivo de filas de mensagens, que obriga a publicação conjunta dos serviços", "Poucos testes de desempenho, que impedem a publicação isolada de cada serviço"],
 "Se serviços só funcionam publicados juntos, há dependências fortes de contratos, dados ou fluxos. Revisar fronteiras, contratos compatíveis e comunicação assíncrona ajuda a recuperar a independência.","est"],
["sw",4,"Um serviço consome eventos publicados por outro, e a equipe produtora quer mudar o formato dos eventos. Qual prática evita quebrar os consumidores?",
 ["Evolução compatível do contrato, com versionamento, registro de esquemas e testes de contrato", "Mudar o formato sem avisar, pois os consumidores sempre conseguem se adaptar rapidamente à mudança nova", "Congelar o formato para sempre, sem nenhuma alteração, mesmo que o negócio precise de novos campos", "Enviar o novo formato em outra fila, sem documentação, para que os consumidores descubram a mudança"],
 "Contratos de eventos devem evoluir de forma compatível (por exemplo, adicionando campos opcionais), com versões e testes entre produtor e consumidor. Mudanças silenciosas causam falhas difíceis de rastrear.","int"],
["sw",4,"Qual critério é mais útil para decidir se um novo serviço deve ser separado em um microsserviço?",
 ["Necessidade de escala, ciclo de mudança ou propriedade por uma equipe distintos do restante", "O desejo da equipe de usar uma linguagem de programação diferente, por preferência, no novo componente", "O fato de a funcionalidade ser pequena e ter poucas linhas de código no repositório atual", "A existência de uma tabela própria no banco, mesmo sem equipe ou ritmo de mudança distintos"],
 "Separar faz sentido quando há benefício claro: escala diferente, ritmo de mudança independente ou dono distinto. Linguagem e tamanho isolados raramente justificam o custo operacional de mais um serviço.","est"],
["sw",4,"Em uma revisão de arquitetura, aparece um requisito de latência de 100 ms no percentil 99 e o desenho atual usa cinco chamadas síncronas em série. Qual a ação mais adequada?",
 ["Medir o tempo de cada chamada e reduzir ou paralelizar as dependências críticas, usando cache onde fizer sentido", "Aumentar o tempo limite de cada chamada, para que o percentil 99 também seja atendido", "Adicionar mais três chamadas, para validar os dados, e aceitar uma latência de 300 ms", "Ignorar o percentil 99 e olhar apenas a média, que já está dentro do limite de 100 ms"],
 "Em chamadas em série, as latências se somam, e a cauda (p99) é dominada pelo pior serviço. Medir, paralelizar e cachear reduz o tempo total. Médias escondem os casos lentos.","dec"],
["sw",4,"Uma empresa registra decisões de arquitetura apenas em conversas de chat, e novos integrantes não entendem por que certas escolhas foram feitas. Qual prática resolve?",
 ["Registros de decisão de arquitetura (ADR) curtos, versionados junto ao código e revisados nas mudanças", "Reuniões semanais sem registro, em que a equipe repassa as decisões oralmente aos novos", "Documentos longos escritos uma única vez por ano, arquivados em uma pasta compartilhada da empresa", "Pedir que todos os integrantes memorizem as decisões e as expliquem aos recém-chegados"],
 "Os ADRs registram contexto, decisão, alternativas e consequências, de forma curta e próxima ao código. Mostram o porquê das escolhas e facilitam a revisão quando as condições mudam.","dec"],
["sw",4,"A empresa quer atender usuários em diferentes países com regras locais de preço e impostos, mudando com frequência. Qual direção de desenho é a mais adequada?",
 ["Isolar as regras variáveis em um contexto próprio e configurável, com contratos estáveis", "Duplicar o sistema inteiro para cada país, com uma equipe, um código e uma operação independentes por país", "Espalhar condicionais por país em todo o código, ajustando cada trecho quando uma regra mudar", "Resolver cada caso com planilhas manuais, mantidas pela área financeira e atualizadas a cada mudança de regra"],
 "Regras que mudam muito devem ficar concentradas e configuráveis, atrás de uma interface estável. Duplicar o sistema ou espalhar condicionais multiplica o esforço e os defeitos a cada novo país.","ddd"],
["sw",4,"Um projeto precisa decidir entre um monólito modular e microsserviços. A equipe tem 8 pessoas, o produto é novo, e os limites do domínio ainda não estão claros. Qual escolha é mais coerente?",
 ["Monólito modular, com fronteiras internas claras, dividindo depois em serviços se a necessidade surgir", "Microsserviços desde o início, um por funcionalidade, com um banco de dados para cada um", "Um serviço para cada tabela do banco, com chamadas diretas entre todos os serviços", "Reescrever tudo em outra linguagem antes de começar, para facilitar a divisão futura"],
 "Com equipe pequena e domínio incerto, o monólito modular dá agilidade e mantém a opção de extrair serviços quando as fronteiras estiverem claras. Microsserviços cedo trazem custos de rede, operação e coordenação.","est"],
["ing",1,"O que significa outage em um relatório de TI?",
 ["Queda ou indisponibilidade de um serviço", "Um tipo de atualização de software aplicada nos servidores de produção", "Uma cópia de segurança dos dados, guardada em outro local por precaução", "Uma reunião da equipe de suporte"],
 "Aparece em frases como there was a major outage yesterday (houve uma grande queda ontem). Também se usa downtime para o tempo fora do ar.","ope"],
["ing",1,"O que significa storage?",
 ["Armazenamento", "Segurança", "Rede", "Processamento"],
 "Storage é o espaço onde os dados ficam guardados. Aparece em nomes como Object Storage, Block Storage e Cloud Storage.","arq"],
["ing",1,"O que significa network?",
 ["Rede", "Servidor", "Nuvem", "Senha"],
 "Network pode ser a rede em si ou o conjunto de equipamentos. Networking é a área que cuida dela.","arq"],
["ing",1,"O que significa troubleshooting?",
 ["Diagnosticar e resolver problemas", "Planejar os custos do projeto", "Comprar equipamentos para o datacenter", "Escrever a documentação do sistema"],
 "Um troubleshooting guide é um guia para resolver problemas. O verbo é to troubleshoot.","ope"],
["ing",1,"O que significa to deploy?",
 ["Publicar ou implantar uma aplicação", "Apagar um servidor que não é usado", "Fazer o backup completo do ambiente", "Criar um novo usuário no sistema"],
 "O substantivo é deployment (a implantação). Em frases: we will deploy the new version tonight.","ope"],
["ing",1,"O que significa pricing em uma proposta?",
 ["Preços ou modelo de cobrança", "Desempenho", "Segurança", "Prazo de entrega combinado com o cliente no contrato do projeto"],
 "O pricing model descreve como se cobra: por hora, por usuário, por GB. Em propostas, aparece também a palavra quote (cotação).","prj"],
["ing",1,"O que significa support ticket?",
 ["Chamado de suporte", "Ingresso para evento", "Ticket de estacionamento", "Relatório de custo"],
 "Abrir um ticket é registrar um chamado. Em prioridades, aparecem termos como high priority (alta prioridade).","ope"],
["ing",1,"The service is down since 9 a.m. O que isso quer dizer?",
 ["O serviço está fora do ar desde as 9h", "O serviço foi reduzido às 9h", "O serviço será desligado às 9h", "O serviço está mais barato desde as 9h"],
 "Down quer dizer fora do ar, e up quer dizer funcionando. Em the service is up and running, o serviço está no ar.","ope"],
["ing",2,"O que significa o termo \"failover\" em um documento de arquitetura?",
 ["A troca automática para um componente ou ambiente reserva quando o principal falha", "A falha definitiva de um servidor, sem possibilidade de recuperação, que obriga a trocar o equipamento", "A transferência de dados de um provedor para outro, após a rescisão", "Um relatório detalhado das falhas, enviado ao cliente depois da resolução do incidente"],
 "Failover é a transição para um sistema de reserva (secondary) quando o primário fica indisponível. O retorno ao ambiente original, depois, é chamado de failback.","arq"],
["ing",2,"Em \"We need a rollback plan before the release\", o que a equipe está pedindo?",
 ["Um plano para voltar à versão anterior se a publicação der errado", "Um plano para publicar a versão mais rápido, pulando as etapas de teste que atrasam a entrega ao cliente", "Um relatório sobre os usuários que ainda usam a versão antiga do sistema em produção", "Um calendário de treinamentos para a equipe aprender a usar a versão nova do sistema"],
 "Rollback significa reverter uma mudança ao estado anterior. Release é a publicação da versão. Ter um plano de rollback antes de publicar é uma prática padrão de gestão de mudanças.","ope"],
["ing",2,"Um cliente diz: \"Our on-premises servers are reaching end of life.\" O que ele quis dizer?",
 ["Os servidores no datacenter próprio estão chegando ao fim da vida útil e do suporte do fabricante", "Os servidores na nuvem estão sendo desligados pelo provedor, que encerrou o contrato", "Os servidores estão sempre ligados, sem interrupção, e atingiram o fim do prazo de garantia", "Os servidores da empresa foram vendidos e agora pertencem a um provedor de nuvem"],
 "On-premises (ou on-prem) é o ambiente instalado na própria empresa. End of life (EOL) indica que o fabricante deixa de dar suporte ou atualizações, o que costuma motivar uma migração.","arq"],
["ing",2,"O que é um \"workaround\"?",
 ["Uma solução provisória para contornar um problema, enquanto a correção definitiva não chega", "Um tipo de contrato de trabalho remoto, em que a pessoa atua a partir de casa", "A correção definitiva e permanente de um defeito, aplicada na versão seguinte do sistema, depois de testada", "Um relatório de custo de um projeto, preparado ao final de cada fase de entrega"],
 "Workaround é um contorno temporário: resolve ou atenua o efeito sem tratar a causa. Em incidentes, costuma-se aplicar um workaround e depois uma correção definitiva (fix).","ope"],
["ing",2,"Na frase \"The deployment is blocked by a missing approval\", o que está acontecendo?",
 ["A publicação não pode seguir porque falta uma aprovação", "A publicação terminou com sucesso e foi aprovada, e a equipe agora aguarda apenas o relatório final", "A aprovação foi dada, mas a publicação foi cancelada", "O sistema foi bloqueado por um problema de segurança"],
 "To be blocked by something significa estar impedido de avançar por algo. É um termo comum em reuniões de acompanhamento, junto com blocker (o impedimento).","prj"],
["ing",2,"Qual é o significado de \"lead time\" em gestão de projetos e entregas?",
 ["O tempo decorrido entre o pedido ou a ideia e a entrega concluída", "O tempo que o líder da equipe leva para responder e-mails", "O tempo de duração de uma reunião de acompanhamento entre cliente e fornecedor do projeto", "O prazo de garantia do produto entregue, contado a partir da data do aceite do cliente"],
 "Lead time mede quanto tempo passa desde o início do pedido até a entrega. Na entrega de software, é uma das métricas DORA, junto com a frequência de implantação.","prj"],
["ing",2,"O que quer dizer \"scope creep\"?",
 ["O crescimento descontrolado do escopo do projeto, sem ajuste de prazo ou de custo", "A redução planejada do escopo do projeto para entregar antes, combinada com o cliente desde o início", "Uma ferramenta de monitoramento que mede a evolução do escopo e avisa sobre cada alteração", "O encerramento formal de um projeto, com a assinatura do termo de aceite do cliente"],
 "Scope creep ocorre quando pedidos extras vão sendo acrescentados sem controle de mudanças. Em pré-vendas é importante delimitar o escopo na proposta para evitar esse efeito.","prj"],
["ing",2,"O que significa a frase \"We are hitting rate limits\"?",
 ["O sistema está atingindo o limite de requisições permitido por um serviço em cada intervalo de tempo", "O custo mensal do projeto está subindo além do orçamento aprovado, por causa do aumento do consumo de nuvem", "A taxa de câmbio está limitando as compras de serviços de nuvem em dólar da empresa", "A velocidade da rede está acima do esperado e o provedor limita a banda contratada"],
 "Rate limit é o número máximo de requisições que uma API aceita em um intervalo. Ao atingi-lo, o serviço rejeita ou atrasa chamadas, geralmente com o erro HTTP 429.","arq"],
["ing",3,"Em uma reunião, o cliente diz: \"Can you walk me through the architecture?\" O que ele está pedindo?",
 ["Que você explique a arquitetura passo a passo", "Que você o acompanhe a pé até a sala de servidores", "Que você envie o contrato por e-mail", "Que você marque outra reunião para o mês seguinte"],
 "To walk someone through é guiar a pessoa por uma explicação ou procedimento, em ordem. É uma expressão frequente em apresentações técnicas e em pré-vendas.","com"],
["ing",3,"Qual a melhor tradução de \"ballpark estimate\"?",
 ["Estimativa aproximada, sem grande precisão", "Estimativa exata, aprovada em contrato", "Orçamento fechado, com multa em caso de atraso", "Previsão de público para um evento"],
 "Ballpark figure é um número aproximado, dado para dar uma ordem de grandeza. Em propostas, convém deixar claro que se trata de uma estimativa preliminar sujeita à análise detalhada.","prj"],
["ing",3,"Um cliente escreve: \"We plan to sunset the legacy platform by Q4.\" O que isso significa?",
 ["Eles planejam desativar a plataforma antiga até o quarto trimestre", "Eles planejam renovar a plataforma antiga no quarto trimestre, mantendo o contrato com o mesmo fornecedor", "Eles planejam comprar a plataforma antiga de um fornecedor", "Eles planejam documentar a plataforma antiga até o fim do ano"],
 "To sunset something é descontinuar gradualmente um produto ou sistema. Q4 é o quarto trimestre (outubro a dezembro). A frase indica um prazo de aposentadoria do legado.","com"],
["ing",3,"Qual das opções é a melhor resposta profissional a: \"Is this solution compliant with our security policy?\" quando você ainda não sabe?",
 ["\"I'll check with our security team and get back to you by Friday.\"", "\"Yes, of course. It is compliant, and we have never had problems with it before.\"", "\"I don't know, and it is not my job to answer security questions from customers.\"", "\"Please ask someone else on our team, because I have no information about security.\""],
 "Em pré-vendas, nunca se afirma conformidade sem verificar. A resposta honesta, com prazo e responsável pela checagem, preserva a credibilidade e mantém o processo andando.","com"],
["ing",3,"O que quer dizer a expressão \"to align on the next steps\"?",
 ["Chegar a um acordo sobre os próximos passos e os responsáveis", "Colocar os próximos passos em ordem alfabética", "Cancelar os próximos passos até uma nova decisão", "Dividir os próximos passos entre equipes sem discussão"],
 "To align on significa alcançar um entendimento comum. Em e-mails, \"Let's align on the next steps\" propõe fechar quem faz o quê e quando depois de uma reunião.","com"],
["ing",3,"Qual o sentido de \"proof of concept\" (PoC) em um projeto de tecnologia?",
 ["Um teste de pequena escala que valida se uma ideia ou solução é viável", "A versão final e completa do produto, entregue ao cliente depois de todos os testes e da homologação", "O contrato assinado entre as partes, com o escopo, o prazo e as condições de pagamento", "A documentação de uso entregue aos usuários, com as instruções de cada funcionalidade"],
 "Uma PoC verifica a viabilidade técnica de forma rápida e limitada. Um bom PoC tem critérios de sucesso definidos antes do início, para evitar discussões sobre o resultado.","prj"],
["ing",3,"Em \"The root cause was a misconfigured firewall rule\", qual foi a causa do problema?",
 ["Uma regra de firewall configurada incorretamente", "Um firewall comprado com defeito de fábrica", "Um usuário que esqueceu a senha e bloqueou o acesso à rede do escritório", "Um servidor sem energia elétrica, por falha do fornecimento no datacenter"],
 "Root cause é a causa raiz de um incidente, em oposição aos sintomas. Misconfigured é configurado de forma errada. A frase aparece em postmortems e relatórios de incidentes.","ope"],
["ing",3,"Em um e-mail, o cliente escreve: \"Could you share the high-level design by EOD?\" O que ele pede?",
 ["Que você envie o desenho de alto nível até o fim do dia", "Que você apresente o desenho detalhado na semana seguinte", "Que você revise o desenho de alto nível com a equipe dele", "Que você elimine o desenho de alto nível do projeto"],
 "High-level design é a visão geral da arquitetura, sem detalhes de implementação. EOD significa end of day, o fim do expediente. É comum em e-mails com prazo curto.","com"],
["ing",4,"Leia: \"We need a solution that scales horizontally, has no single point of failure and meets a 99.95% uptime SLA.\" Qual requisito NÃO está incluído?",
 ["Criptografia dos dados em repouso", "Escalabilidade horizontal, adicionando novas máquinas conforme a demanda aumentar", "Ausência de ponto único de falha", "Disponibilidade de 99,95% por contrato"],
 "O texto pede escalar horizontalmente (scales horizontally), ausência de single point of failure e SLA de 99,95% de uptime. Criptografia não foi mencionada. Ler com atenção o que foi e o que não foi pedido evita erros na proposta.","arq"],
["ing",4,"Qual é a melhor forma de dizer, em inglês profissional, que o prazo é inviável com o escopo atual?",
 ["\"With the current scope, this timeline is not realistic. We can either reduce the scope or extend the deadline.\"", "\"This is impossible. We will not do it, and we cannot discuss any other option.\"", "\"No problem, we will do everything on time, even if we have to increase the scope.\"", "\"The deadline is your problem, not ours, so please review the requirements first.\""],
 "A resposta apresenta o problema com objetividade e oferece alternativas (reduzir o escopo ou estender o prazo). Mantém o tom colaborativo, em vez de apenas recusar ou prometer o impossível.","com"],
["ing",4,"No e-mail de um fornecedor: \"Please note that this feature is currently in preview and not covered by the SLA.\" O que isso significa para o seu projeto?",
 ["O recurso está em pré-lançamento (preview) e não tem garantia de disponibilidade contratual (SLA)", "O recurso está em desuso e será removido em breve, por isso o fornecedor recomenda migrar para outro agora", "O recurso é gratuito e ilimitado, e por isso o fornecedor não oferece nenhuma garantia contratual", "O recurso já está certificado para uso crítico, e a garantia de disponibilidade vale para todos"],
 "Preview indica uma fase anterior à disponibilidade geral (GA). Recursos nessa fase podem mudar e normalmente não têm SLA, o que é um risco ao usá-los em produção.","arq"],
["ing",4,"Qual frase comunica corretamente um risco ao cliente?",
 ["\"There is a risk that the migration may exceed the window. To mitigate it, we propose a rollback plan.\"", "\"The migration will definitely go wrong, so we recommend that you cancel the project now.\"", "\"Everything is under control, there are no risks, and we will not need any contingency plan at all.\"", "\"We hope nothing breaks, but we have not planned for what happens if it does.\""],
 "A boa comunicação nomeia o risco, indica o impacto possível e propõe mitigação (mitigate it). Isso demonstra domínio do assunto e dá confiança ao cliente, sem alarmismo nem otimismo infundado.","com"],
["ing",4,"O que significa \"out of scope\" em uma proposta?",
 ["Fora do escopo contratado, ou seja, não incluído no que foi acordado", "Fora do prazo combinado, mas ainda incluído no valor e no escopo da proposta", "Um item que o cliente já recebeu em uma entrega anterior e por isso não será cobrado", "Um item de custo muito alto, que precisa de uma aprovação especial da diretoria"],
 "Out of scope são itens que a proposta não cobre. Deixá-los explícitos (por exemplo, \"data migration is out of scope\") evita expectativas diferentes entre as partes e disputas posteriores.","prj"],
["ing",4,"Um colega escreve: \"Let's take this offline.\" O que ele propõe?",
 ["Discutir o assunto fora da reunião atual, entre os envolvidos, para não ocupar todos os participantes", "Desligar os computadores durante a reunião, para que todos prestem atenção ao assunto principal da pauta", "Cancelar o assunto definitivamente, retirando o item da pauta para os próximos encontros", "Enviar um relatório por correio para todos os participantes depois da reunião"],
 "Take it offline significa tratar um tema à parte, sem ocupar todos os participantes da reunião. É comum quando surge um detalhe técnico que só interessa a poucas pessoas.","com"],
["ing",4,"Em uma proposta de arquitetura, qual frase descreve melhor um trade-off?",
 ["\"Multi-region improves resilience but increases cost and operational complexity.\"", "\"Multi-region is always the best choice, because it improves resilience at no extra cost.\"", "\"Cost is irrelevant to resilience, so we can ignore the budget in this design.\"", "\"We chose multi-region because it is trendy, and every competitor already uses it in production.\""],
 "Trade-off é o equilíbrio entre ganhos e perdas de uma escolha. A frase correta nomeia o benefício (resiliência) e os custos associados. Em arquitetura, quase toda decisão envolve trade-offs.","arq"],
["ing",4,"O cliente diz: \"Our main pain point is the lack of visibility into costs across teams.\" Qual solução responde diretamente a isso?",
 ["Etiquetas de custo, painéis por equipe e alertas de orçamento", "Mais servidores no datacenter, para ampliar a capacidade de processamento de cada equipe", "Uma segunda linha de internet, para ter redundância entre o escritório e o provedor", "Um novo firewall de perímetro, para filtrar o tráfego entre as equipes e a internet"],
 "Pain point é o problema que dói ao cliente: aqui, a falta de visibilidade dos custos (lack of visibility into costs). A resposta deve atacar isso com tags, relatórios por equipe e alertas, conectando a solução à dor mencionada.","com"],
["disc",1,"O que é a fase de discovery em um projeto de arquitetura?",
 ["Levantar as necessidades, o ambiente atual e as restrições do cliente antes de propor uma solução", "Escolher o provedor de nuvem antes de conversar com o cliente, para ganhar tempo na proposta e evitar discussões sobre alternativas", "Executar o teste de carga final no ambiente de produção do cliente", "Assinar o contrato e definir o cronograma de pagamentos do projeto"],
 "Discovery é a etapa de entender o problema, o contexto e as restrições. Uma proposta feita sem discovery costuma errar escopo, preço e dimensionamento.","req"],
["disc",1,"O que é sizing?",
 ["Estimar os recursos necessários (CPU, memória, disco e rede) para a carga real do cliente", "Escolher o tamanho do logotipo e das imagens usados na apresentação comercial, para que a proposta fique visualmente consistente", "Reduzir o número de usuários do cliente até que a solução caiba no orçamento", "Definir quantas pessoas da equipe comercial vão acompanhar o projeto do cliente e qual será a divisão das comissões"],
 "Sizing é o dimensionamento: traduzir o uso (usuários, transações, dados) em capacidade de infraestrutura, com margem para picos e crescimento.","siz"],
["disc",1,"O que significa TCO?",
 ["Custo total de propriedade: tudo o que custa ter e operar a solução ao longo do tempo", "Total de chamados de suporte abertos pelo cliente durante o primeiro ano", "Taxa de conversão de propostas em contratos assinados pelo time comercial", "Tempo de configuração de uma solução antes de entrar em produção"],
 "TCO (total cost of ownership) soma compra ou assinatura, operação, licenças, suporte, energia e pessoal. Comparar só o preço de compra distorce a decisão.","tco"],
["disc",1,"Qual destes é um requisito não funcional?",
 ["Disponibilidade de 99,9% ao mês", "Cadastrar um cliente novo no sistema", "Emitir um relatório de vendas por período", "Enviar um e-mail de confirmação depois da compra"],
 "Requisitos não funcionais descrevem qualidades do sistema (disponibilidade, desempenho, segurança). Os funcionais descrevem o que o sistema faz.","req"],
["disc",1,"Para que serve a lista de premissas em uma proposta?",
 ["Registrar o que foi assumido como verdadeiro para o preço e o escopo, para renegociar se mudar", "Listar os concorrentes que o cliente também consultou durante a avaliação e os preços que cada um apresentou à área de compras", "Informar as certificações pessoais da equipe que vai executar o projeto e o tempo de experiência de cada integrante", "Mostrar o desconto máximo que o comercial pode conceder ao cliente"],
 "Premissas são suposições (por exemplo, \"o cliente fornece acesso à VPN em 5 dias\"). Se uma premissa falha, preço e prazo podem ser revistos.","prop"],
["disc",1,"O que é uma RFP?",
 ["Uma solicitação formal de proposta, enviada pelo cliente a vários fornecedores", "Um relatório financeiro preparado pelo fornecedor ao fim de cada projeto, com o resultado do exercício", "Um certificado de segurança emitido por uma auditoria independente", "Uma ferramenta de monitoramento usada para acompanhar custos da nuvem e emitir alertas de orçamento"],
 "RFP (request for proposal) traz requisitos e critérios de avaliação. Quem responde precisa seguir o formato e destacar suas premissas.","prop"],
["disc",1,"Por que perguntar ao cliente sobre o crescimento esperado nos próximos anos?",
 ["Para dimensionar com margem e evitar uma solução que fique pequena logo após a entrada em produção", "Para cobrar mais caro do cliente, já que um negócio que cresce aceita preços maiores", "Para saber se o cliente pretende trocar de fornecedor no ano seguinte", "Para decidir qual será a cor e o tema da interface do sistema novo"],
 "Crescimento de usuários, dados e transações muda a capacidade e o custo. Ignorá-lo leva a sub ou superdimensionar.","siz"],
["disc",1,"O cliente diz: \"Preciso de um servidor mais rápido.\" Qual é a melhor primeira atitude?",
 ["Perguntar qual problema ele enfrenta e como mede o desempenho hoje", "Propor a maior instância disponível, para garantir que o problema acabe", "Enviar a proposta com o menor preço, para ganhar a concorrência", "Explicar que velocidade depende só do fornecedor e não do dimensionamento"],
 "\"Mais rápido\" pode significar CPU, disco, rede ou consulta mal escrita. Só entendendo o sintoma e a métrica se evita vender capacidade que não resolve.","req"],
["disc",2,"Qual conjunto de perguntas de discovery é o mais útil para definir disponibilidade?",
 ["Quanto tempo o sistema pode ficar parado, quanto dado pode perder e quanto custa cada hora de parada", "Quantas telas o sistema tem e qual a cor predominante da marca do cliente", "Qual foi o fornecedor anterior e há quantos anos o contrato foi encerrado", "Quantos usuários cadastrados existem e quantos acessam apenas aos domingos"],
 "As respostas viram RTO, RPO e o custo da indisponibilidade, base para escolher entre uma zona, várias zonas ou várias regiões.","req"],
["disc",2,"Um servidor tem média de 20% de CPU, mas chega a 85% no fechamento do mês. Qual deve ser a base do dimensionamento?",
 ["O pico, com margem de crescimento, e não apenas a média de uso", "A média de 20%, pois o pico acontece em poucos dias do mês", "O valor mínimo registrado, que mostra o que o sistema realmente exige", "A média do último dia, que representa o comportamento mais recente"],
 "Dimensionar pela média faz o sistema falhar no pico. É preciso conhecer o pico, a duração e o crescimento, e decidir se a elasticidade cobre o resto.","siz"],
["disc",2,"Além das instâncias, quais custos compõem o TCO de uma migração para a nuvem?",
 ["Transferência de dados, armazenamento, licenças, suporte, operação e o próprio custo de migrar", "Apenas as licenças dos sistemas operacionais e de banco, pois as instâncias são cobradas por hora de uso", "Somente a fatura mensal do provedor, que já inclui todos os demais itens", "O custo de compra dos servidores antigos, que será totalmente recuperado já no primeiro mês após a migração"],
 "Um TCO realista inclui tudo o que muda: dados em trânsito, backup, rede, suporte, pessoal e a migração em si, além do custo evitado no datacenter.","tco"],
["disc",2,"O cliente tem orçamento fixo, mas o escopo ainda está aberto. Qual é o principal risco?",
 ["O escopo crescer além do orçamento, por isso é preciso definir entregáveis e controle de mudanças", "O orçamento ser gasto cedo demais, por isso convém dividi-lo igualmente entre as fases", "O fornecedor ficar sem trabalho no fim do projeto e pedir um novo contrato", "A equipe entregar antes do prazo e ficar sem atividades até o encerramento"],
 "Escopo aberto com preço fechado gera disputas (scope creep). Entregáveis claros, premissas e um processo de mudanças protegem as duas partes.","prop"],
["disc",2,"O que é um baseline de desempenho e por que coletá-lo antes de dimensionar?",
 ["É a medição do uso atual (CPU, memória, IOPS e rede) em um período representativo, usada como base", "É o valor máximo que o provedor garante em contrato, usado para calcular a multa", "É a estimativa de crescimento da empresa, fornecida pela diretoria comercial", "É o relatório de custos do ano anterior, que serve de teto para a nova proposta"],
 "Sem baseline, o dimensionamento vira palpite. A coleta deve cobrir picos como fechamento mensal e campanhas.","siz"],
["disc",2,"O cliente afirma: \"Os dados só podem ficar no Brasil.\" Como classificar isso no levantamento?",
 ["Como restrição, pois limita as opções de solução, regiões e serviços possíveis", "Como premissa, já que pode ser alterada no meio do projeto sem causar impacto em custo ou prazo", "Como entregável, pois será produzido pelo fornecedor ao final do projeto e entregue ao cliente", "Como risco, pois é uma ameaça que ainda pode ou não acontecer"],
 "Restrição é um limite imposto (lei, orçamento, prazo, residência de dados). Premissa é algo assumido como verdadeiro e que precisa ser validado.","req"],
["disc",2,"Por que apresentar mais de uma opção na proposta, como básica, recomendada e completa?",
 ["Permite ao cliente comparar custo e benefício e decidir com clareza o que priorizar", "Garante que o cliente sempre escolha a opção mais cara, pois ela vem destacada no documento de proposta", "Evita que o cliente precise conversar com a equipe técnica depois da entrega da proposta comercial", "Reduz o trabalho de escrita, porque as três opções repetem o mesmo texto"],
 "Opções deixam os trade-offs visíveis e colocam o cliente na decisão, o que reduz renegociações e aumenta a confiança na recomendação.","prop"],
["disc",2,"O cliente quer migrar 60 VMs, mas o levantamento mostra que 15 usam menos de 5% de CPU e memória. Qual é a melhor abordagem?",
 ["Revisar o dimensionamento (rightsizing) e candidatas a desligamento antes de migrar, e propor ondas", "Migrar as 60 VMs exatamente como estão, para não alterar a aplicação", "Desligar as 15 VMs de baixo uso imediatamente, sem consultar os donos, para reduzir o custo logo na primeira fatura", "Dobrar o tamanho das 45 restantes, para compensar as 15 ociosas"],
 "Migrar sem revisar leva o desperdício para a nuvem, onde ele é cobrado por hora. Validar com os responsáveis e agrupar em ondas reduz risco e custo.","siz"],
["disc",3,"Um banco de dados tem pico de 8.000 IOPS, e o volume previsto entrega 3.000 IOPS. O que fazer?",
 ["Escolher volumes com IOPS provisionados maiores (ou mais discos), validando também a latência", "Aumentar apenas a CPU e a memória da instância, que resolvem qualquer lentidão de disco em bancos de dados", "Manter o volume e aceitar a lentidão, pois o pico dura poucos minutos por dia", "Trocar o banco por arquivos de texto, que dispensam a análise de IOPS"],
 "IOPS e latência são limites do armazenamento. CPU e memória ajudam pouco quando o gargalo é disco, e o sizing deve cobrir o pico de I/O.","siz"],
["disc",3,"Hoje há 10 TB de dados, com crescimento de 30% ao ano. Qual capacidade aproximada será necessária em 3 anos?",
 ["Cerca de 22 TB, pois o crescimento é composto (10 × 1,3 × 1,3 × 1,3)", "Cerca de 19 TB, somando 30% do valor inicial (3 TB) a cada um dos três anos", "Cerca de 13 TB, aplicando 30% uma única vez sobre o valor atual", "Cerca de 30 TB, triplicando o valor atual como margem de segurança para o período"],
 "Crescimento anual é composto: 10 × 1,3³ ≈ 22 TB. Somar 30% do valor inicial a cada ano (19 TB) é um erro comum e subdimensiona.","siz"],
["disc",3,"Qual erro mais distorce uma comparação de TCO entre datacenter próprio e nuvem?",
 ["Comparar só o preço do servidor com o da instância, esquecendo energia, espaço, pessoal e renovação", "Incluir os custos de suporte e de licenças nos dois cenários da comparação, usando as mesmas premissas de preço", "Projetar o crescimento de dados por mais de um ano em ambos os cenários", "Usar a mesma moeda e o mesmo período de análise para as duas alternativas"],
 "O datacenter próprio tem custos escondidos: energia, refrigeração, espaço, equipe e troca de hardware. Ignorá-los favorece indevidamente o on-premises.","tco"],
["disc",3,"O cliente diz: \"O sistema não pode parar nunca.\" Como tratar o pedido?",
 ["Traduzir em RTO e RPO, mostrar o custo de cada nível de disponibilidade e validar com o negócio", "Prometer 100% de disponibilidade em contrato, para fechar o negócio mais rápido e afastar a objeção do cliente", "Ignorar o comentário, pois todo cliente diz isso e ninguém espera cumprir", "Responder que isso é impossível e encerrar a conversa sobre disponibilidade, sem discutir alternativas de custo"],
 "\"Nunca\" não é um requisito mensurável. Números de RTO e RPO, com preço de cada nível, permitem uma decisão informada e um SLA que se pode cumprir.","risk"],
["disc",3,"Por que listar itens fora do escopo em uma proposta?",
 ["Para evitar que cada parte entenda o contrato de um jeito e surjam disputas sobre o que estava incluído", "Para reduzir o tamanho do documento e deixar a proposta com menos páginas", "Para dar ao cliente uma lista de tarefas que ele deve cobrar do concorrente", "Para substituir a necessidade de listar o que está incluído na entrega"],
 "\"Fora do escopo\" explicita limites (por exemplo, migração de dados ou treinamento). Expectativas diferentes são uma das maiores causas de conflito em projetos.","prop"],
["disc",3,"Como comunicar uma estimativa de custo ainda incerta ao cliente?",
 ["Em faixa (de X a Y), com as premissas e o nível de confiança, refinando depois de um PoC", "Com um valor exato, para transmitir segurança e evitar perguntas sobre a incerteza da estimativa", "Sem número nenhum, pois qualquer valor pode ser cobrado depois pelo cliente", "Com o menor valor possível, para ganhar a concorrência e ajustar o preço depois do contrato assinado"],
 "Estimar é lidar com incerteza. Uma faixa com premissas é honesta e protege o relacionamento; um valor falsamente exato costuma virar problema depois.","prop"],
["disc",3,"Qual é a prática mais importante antes de iniciar um PoC?",
 ["Definir critérios de sucesso mensuráveis e o que acontece depois, aprovado ou não", "Escolher a ferramenta mais moderna disponível para impressionar o cliente", "Começar já com todos os dados reais de produção, sem plano de limpeza nem acesso controlado", "Garantir que o PoC use todos os módulos do produto, mesmo os que o cliente não pediu"],
 "Sem critérios claros, o PoC vira discussão subjetiva. Metas como \"latência abaixo de 200 ms\" ou \"carga de 500 usuários\" permitem uma decisão objetiva.","risk"],
["disc",3,"O cliente quer alta disponibilidade, o menor custo possível e entrega em 30 dias. Qual é a melhor conduta?",
 ["Mostrar o trade-off entre os três, priorizar com o cliente e propor uma entrega em fases", "Aceitar os três requisitos e ajustar o preço depois, quando o prazo estiver curto", "Escolher sozinho o requisito mais barato e entregar sem avisar sobre os demais", "Recusar o projeto, pois os três requisitos nunca podem ser atendidos juntos"],
 "Custo, prazo e disponibilidade competem entre si. Priorizar com o cliente e entregar por fases é a forma realista de não prometer o que não se sustenta.","risk"],
["disc",4,"4.000 usuários simultâneos geram 10 requisições por minuto cada, e cada requisição usa 50 ms de CPU. Com utilização-alvo de 60%, quantos núcleos são necessários?",
 ["Cerca de 56 núcleos (≈ 667 req/s × 0,05 s ≈ 33 núcleos, divididos por 0,6)", "Cerca de 33 núcleos, que cobrem a carga calculada sem considerar a margem alvo", "Cerca de 2.000 núcleos, o que ocorre ao esquecer de converter minutos em segundos", "Cerca de 20 núcleos, pois 50 ms por requisição é um tempo pequeno de CPU"],
 "4.000 × 10 / 60 ≈ 667 req/s; × 0,05 s ≈ 33 núcleos a 100%. Com alvo de 60% de uso, 33 / 0,6 ≈ 56. Esquecer a margem ou a conversão distorce o resultado.","siz"],
["disc",4,"Uma aplicação envia 20 TB por mês para a internet, e o provedor cobra US$ 0,09 por GB de saída. Qual é o custo mensal aproximado?",
 ["Cerca de US$ 1.800 (20.000 GB × 0,09)", "Cerca de US$ 180, tratando 20 TB como 2.000 GB por engano", "Cerca de US$ 18.000, multiplicando por 0,9 em vez de 0,09", "Cerca de US$ 90, calculando como se fosse 1 TB de saída"],
 "20 TB ≈ 20.000 GB; × US$ 0,09 ≈ US$ 1.800. Custos de saída (egress) costumam surpreender, e uma CDN ou a mudança de arquitetura pode reduzi-los.","tco"],
["disc",4,"Uma instância custa US$ 0,10/h sob demanda e US$ 0,06/h reservada (paga durante as 730 h do mês). Ela será usada só 50% do tempo. Qual é a opção mais barata?",
 ["Sob demanda: ≈ US$ 36,5 por mês, contra ≈ US$ 43,8 da reservada", "Reservada: ≈ US$ 43,8 por mês, contra ≈ US$ 73 da sob demanda", "As duas custam o mesmo, pois a reservada compensa o menor uso", "Reservada, pois o valor por hora menor sempre vence em qualquer padrão de uso"],
 "Sob demanda: 0,10 × 365 h ≈ 36,5. Reservada: 0,06 × 730 h ≈ 43,8. O desconto só compensa quando o uso passa de cerca de 60% do tempo.","tco"],
["disc",4,"Dois componentes em série têm SLA de 99,9% e 99,95%. Qual é a disponibilidade composta aproximada?",
 ["Cerca de 99,85% (0,999 × 0,9995)", "Cerca de 99,95%, que é o valor do componente mais confiável", "Cerca de 99,90%, que é o valor do componente menos confiável", "Cerca de 99,93%, que é a média aritmética dos dois valores"],
 "Em série, as probabilidades se multiplicam: 0,999 × 0,9995 ≈ 0,9985. A disponibilidade composta é sempre menor que a do pior componente.","risk"],
["disc",4,"Um projeto exige investimento de R$ 600 mil e gera economia de R$ 25 mil por mês. Qual é o payback simples?",
 ["24 meses (600 ÷ 25)", "15 meses, calculando com a metade do investimento", "30 meses, somando seis meses de implantação sem economia", "48 meses, dividindo a economia pelo investimento ao contrário"],
 "Payback simples é investimento ÷ economia mensal = 24 meses. Em um business case, vale considerar também risco, prazo de implantação e desconto do dinheiro no tempo.","tco"],
["disc",4,"O cliente pede 99,99% de disponibilidade, mas o orçamento cobre apenas uma zona. Qual é a melhor resposta?",
 ["Mostrar que a meta exige redundância entre zonas ou regiões e o custo disso, e alinhar meta ou orçamento", "Aceitar a meta e prometer 99,99% em contrato, mesmo com uma única zona", "Reduzir o SLA no contrato sem avisar o cliente, para que o preço caiba no orçamento e a proposta seja aprovada", "Propor duas zonas sem custo adicional, assumindo que o provedor absorve a diferença"],
 "Uma zona não sustenta 99,99%. A resposta honesta mostra o que a meta exige e deixa o cliente escolher entre pagar mais ou aceitar um SLA menor.","risk"],
["disc",4,"Um cliente com picos sazonais (Black Friday) quer reduzir custo, mas teme lentidão. Qual desenho de dimensionamento é mais coerente?",
 ["Base estável coberta por compromisso, pico coberto por elasticidade, com teste de carga antes da data", "Dimensionar o ano inteiro para o pico da Black Friday, com todos os recursos ligados durante os doze meses", "Dimensionar para a média anual, deixando o sistema lento durante a campanha", "Desligar a aplicação nos meses de baixo uso e religá-la manualmente em novembro, antes da campanha começar"],
 "Separar a carga base (compromisso ou reserva) da carga variável (auto scaling) equilibra custo e desempenho. O teste de carga valida que a elasticidade responde a tempo.","siz"],
["disc",4,"Qual combinação define melhor o sucesso de uma entrega de arquitetura para o cliente?",
 ["Requisitos atendidos, métricas acordadas, risco tratado e uma operação que a equipe do cliente consegue sustentar", "Número de páginas do documento de arquitetura e quantidade de diagramas entregues", "Uso do maior número possível de serviços do provedor, para demonstrar profundidade técnica e justificar o preço da proposta ao cliente", "Entrega no prazo, mesmo que a solução ainda não atenda aos requisitos combinados"],
 "Boa arquitetura é a que atende ao negócio, é mensurável e é operável. Documentos e serviços em quantidade não substituem requisitos atendidos e uma operação viável.","prop"],
["idd",1,"Em integração de sistemas, o que é uma API?",
 ["Uma interface que permite a um sistema pedir dados ou ações a outro de forma padronizada", "Um tipo de banco de dados usado só para relatórios", "Um equipamento de rede que liga dois datacenters", "Uma linguagem de programação usada para criar telas"],
 "API (application programming interface) define como sistemas conversam: quais pedidos aceita e quais respostas devolve, sem expor o funcionamento interno.","api"],
["idd",1,"Em uma API REST, qual método HTTP costuma ser usado para consultar um dado sem alterá-lo?",
 ["GET", "POST", "DELETE", "PUT"],
 "GET lê um recurso. POST cria, PUT substitui, PATCH altera em parte e DELETE remove. Essa convenção torna as APIs REST previsíveis.","api"],
["idd",1,"O que é mensageria?",
 ["Troca de mensagens entre sistemas por meio de uma fila ou tópico, sem que um espere o outro", "Envio de e-mails e SMS para os clientes de uma empresa, com confirmação de leitura e controle de campanhas", "Um sistema de chat para a equipe de suporte", "Uma cópia do banco de dados feita todas as noites"],
 "Com mensageria, quem envia deposita a mensagem e segue o trabalho; quem recebe a consome depois. Isso desacopla os sistemas e absorve picos.","msg"],
["idd",1,"O que significa ETL?",
 ["Extrair os dados da origem, transformá-los e carregá-los no destino", "Estimar o tempo e o custo de um projeto de dados", "Executar testes de carga em um banco de dados", "Exportar tabelas para uma planilha, uma vez por mês"],
 "ETL (extract, transform, load) é a rotina clássica para levar dados de sistemas operacionais a um repositório analítico, já tratados.","etl"],
["idd",1,"Qual é a diferença básica entre um banco transacional (OLTP) e um data warehouse?",
 ["O transacional atende às operações do dia a dia; o data warehouse reúne dados históricos para análise", "O transacional guarda só imagens; o data warehouse guarda só textos", "O transacional é sempre gratuito; o data warehouse é sempre pago", "Não há diferença, pois ambos têm a mesma finalidade e o mesmo desenho"],
 "OLTP prioriza muitas operações curtas e consistentes. O data warehouse organiza dados de várias fontes para consultas analíticas pesadas.","dw"],
["idd",1,"Para que serve um API Gateway?",
 ["Ser o ponto de entrada das APIs, cuidando de autenticação, limites e roteamento", "Armazenar os dados de todos os clientes em um único disco, de modo a simplificar as cópias de segurança", "Substituir o firewall da rede interna", "Compilar o código-fonte das aplicações antes da publicação e gerar os pacotes de instalação para o cliente"],
 "O gateway centraliza regras comuns (autenticação, rate limit, logs, versionamento) para que cada serviço não precise implementá-las.","api"],
["idd",1,"O que é uma integração ponto a ponto?",
 ["Uma ligação direta entre dois sistemas, sem intermediário", "Uma ligação que passa sempre por um barramento central de integração, com regras de roteamento", "Uma rede dedicada entre duas filiais", "Uma cópia de dados que ocorre uma vez por ano, durante a janela de manutenção anual"],
 "Ponto a ponto é simples para poucos sistemas, mas, com muitos, vira uma teia difícil de manter. Por isso surgem barramentos, filas e plataformas de integração.","int"],
["idd",1,"Qual formato de dados é o mais usado nas respostas de APIs REST?",
 ["JSON", "Imagem BMP", "MP3", "Documento DOCX"],
 "JSON é leve, legível e suportado por quase todas as linguagens. XML ainda aparece em sistemas mais antigos e em serviços SOAP.","api"],
["idd",2,"Qual é a principal vantagem de usar uma fila entre um sistema de pedidos e o de faturamento?",
 ["Os pedidos continuam sendo recebidos mesmo que o faturamento esteja lento ou fora do ar", "O faturamento passa a calcular os impostos de forma mais precisa", "Os pedidos deixam de precisar de validação antes de serem aceitos", "O custo de armazenamento do banco de pedidos é eliminado"],
 "A fila funciona como amortecedor: absorve picos e falhas temporárias do consumidor. Isso é desacoplamento no tempo, com entrega assíncrona.","msg"],
["idd",2,"O que diferencia uma fila (queue) de um tópico (publish/subscribe)?",
 ["Na fila, cada mensagem é consumida por um consumidor; no tópico, várias assinaturas recebem a mesma mensagem", "A fila guarda dados por anos; o tópico apaga tudo após um segundo", "A fila só aceita texto; o tópico só aceita imagens", "A fila é exclusiva de bancos relacionais; o tópico, de bancos NoSQL"],
 "Filas distribuem trabalho entre consumidores. Em pub/sub, cada interessado recebe uma cópia, o que serve para notificar vários sistemas sobre um evento.","msg"],
["idd",2,"Qual é a diferença entre ETL e ELT?",
 ["No ELT, os dados são carregados primeiro no destino e transformados lá, aproveitando seu poder de processamento", "No ELT, a transformação acontece sempre em uma planilha local", "ELT é usado apenas para dados em tempo real, e ETL apenas para dados de voz e áudio gravados em chamadas telefônicas", "Não há diferença, pois são siglas diferentes para o mesmo processo, que apenas muda de nome conforme o fornecedor"],
 "Com data warehouses em nuvem, é comum carregar os dados brutos e transformá-los dentro do próprio destino (ELT), que escala melhor.","etl"],
["idd",2,"Qual a diferença entre data warehouse e data lake?",
 ["O warehouse guarda dados estruturados e modelados; o lake guarda dados brutos de vários formatos, a custo menor", "O lake só existe em datacenter próprio, e o warehouse só existe na nuvem pública, sem que haja outra combinação possível", "O warehouse armazena apenas vídeos, e o lake apenas planilhas", "O lake exige esquema rígido antes de gravar os dados, e o warehouse aceita qualquer arquivo sem estrutura definida"],
 "O lake aceita dados brutos (schema on read) e é barato; o warehouse impõe um modelo (schema on write) e entrega consultas rápidas e confiáveis.","dw"],
["idd",2,"Qual é o papel de um iPaaS (integration platform as a service)?",
 ["Oferecer, como serviço, conectores e fluxos prontos para integrar aplicações em nuvem e on-premises", "Fornecer servidores virtuais para hospedar qualquer aplicação, cobrando por hora e dispensando integrações entre sistemas", "Armazenar backups de longo prazo em fitas", "Substituir os sistemas de origem por um único sistema novo, desenvolvido sob medida e que absorve todas as funções"],
 "O iPaaS reduz o trabalho de integrar sistemas com conectores, mapeamentos e monitoramento prontos, em vez de código sob medida para cada ligação.","int"],
["idd",2,"Por que versionar uma API (por exemplo, /v1 e /v2)?",
 ["Para evoluir o contrato sem quebrar quem usa a versão anterior", "Para impedir que clientes novos consigam acessar a API durante o período de testes", "Para aumentar a velocidade de resposta em horário de pico de uso, sem alterar a infraestrutura", "Para dispensar a documentação das mudanças feitas"],
 "Mudanças que quebram o contrato precisam de nova versão, com período de convivência e aviso de descontinuação para os consumidores.","api"],
["idd",2,"O que é um webhook?",
 ["Uma chamada que um sistema faz a outro para avisá-lo de um evento, em vez de esperar ser consultado", "Um tipo de ataque que derruba sites por excesso de acessos simultâneos vindos de milhares de máquinas", "Um formato de arquivo para armazenar páginas web", "Uma ferramenta de monitoramento de redes locais"],
 "Webhooks invertem o fluxo: em vez de o consumidor perguntar a toda hora (polling), o provedor notifica quando algo acontece, o que economiza chamadas.","int"],
["idd",2,"Qual é o problema de uma integração por polling (consultar a cada poucos segundos)?",
 ["Gera chamadas desnecessárias e atraso entre o evento e sua percepção", "Impede qualquer tipo de autenticação entre os sistemas que consomem a mesma interface", "Só funciona com bancos de dados NoSQL", "Exige que os dois sistemas estejam na mesma rede local"],
 "No polling, a maior parte das consultas volta vazia, gastando recursos, e o dado só é visto no próximo ciclo. Eventos e webhooks evitam esse desperdício.","int"],
["idd",3,"Qual padrão evita que uma mensagem seja processada duas vezes por engano, quando a entrega é \"pelo menos uma vez\"?",
 ["Consumidores idempotentes, que tratam a repetição sem efeito duplicado", "Aumentar o tamanho da fila para guardar mais mensagens", "Desligar a confirmação de recebimento (ack) das mensagens para que nunca sejam reenviadas pelo broker", "Usar sempre um único consumidor, sem possibilidade de reinício ou de processamento em paralelo"],
 "Sistemas distribuídos podem reentregar mensagens. Se processar duas vezes dá o mesmo resultado (idempotência), a repetição deixa de ser problema.","msg"],
["idd",3,"O que é uma dead letter queue (DLQ)?",
 ["Uma fila para onde vão mensagens que falharam repetidamente, para análise posterior", "Uma fila que apaga as mensagens automaticamente depois de 24 horas, mesmo que ainda não tenham sido lidas", "Uma fila de prioridade máxima para mensagens críticas, que são processadas antes de todas as outras", "Uma cópia de segurança de toda a fila principal"],
 "A DLQ evita que uma mensagem com defeito trave o processamento. Ela fica isolada para ser investigada e reprocessada depois.","msg"],
["idd",3,"Qual a função do CDC (change data capture) em uma integração de dados?",
 ["Capturar as mudanças feitas em um banco e propagá-las quase em tempo real para outros destinos", "Compactar o banco de dados para reduzir o uso de disco e acelerar as cópias de segurança diárias", "Criptografar os dados em repouso com chave do cliente", "Converter todas as tabelas para o formato JSON"],
 "O CDC lê o log de transações e envia apenas inserções, alterações e exclusões. Evita cargas completas e mantém réplicas e data lakes atualizados.","etl"],
["idd",3,"Quando uma arquitetura orientada a eventos é mais adequada do que chamadas síncronas?",
 ["Quando vários sistemas precisam reagir a um fato de negócio, sem que o emissor conheça cada um deles", "Quando o usuário precisa da resposta completa na mesma chamada", "Quando existe apenas um sistema consumidor e ele precisa da resposta completa na mesma chamada, sem espera", "Quando os dados são pequenos e raramente mudam"],
 "Eventos desacoplam emissor e assinantes: novos consumidores entram sem mudar quem publica. O custo é maior complexidade de rastreio e consistência eventual.","msg"],
["idd",3,"Qual é a consequência da consistência eventual em uma integração assíncrona?",
 ["Por um período, os sistemas podem mostrar valores diferentes, até todos processarem as mudanças", "Os dados nunca ficam iguais em todos os sistemas", "As transações são sempre revertidas automaticamente depois de um minuto sem confirmação do destino", "Os sistemas ficam todos sincronizados no mesmo instante, pois a replicação ocorre antes da resposta ao usuário"],
 "Ao desacoplar, aceita-se um intervalo de divergência. O desenho precisa tratar a espera, as repetições e o que o usuário vê nesse intervalo.","int"],
["idd",3,"Por que definir limites de requisições (rate limit) e timeouts ao consumir uma API externa?",
 ["Para proteger o seu sistema e o do provedor contra lentidão em cascata e excesso de chamadas", "Para aumentar o volume de dados que a API devolve", "Para que o provedor consiga cobrar valores maiores pelo serviço e aumentar a margem sobre cada chamada recebida", "Para dispensar autenticação nas chamadas"],
 "Sem timeout, chamadas lentas acumulam threads e derrubam seu serviço. Com limites e retentativas com espera crescente, falhas ficam isoladas.","api"],
["idd",3,"Qual é o benefício principal de um modelo dimensional (esquema estrela) em um data warehouse?",
 ["Consultas analíticas simples e rápidas, com fatos centrais ligados a dimensões descritivas", "Eliminar qualquer necessidade de limpeza de dados", "Garantir que os dados sejam gravados em tempo real, sem nenhum atraso entre a origem e o destino, em qualquer cenário", "Reduzir a zero o uso de armazenamento"],
 "O esquema estrela separa medidas (fatos, como vendas) das dimensões (cliente, produto, tempo). Isso facilita agregações e a leitura por analistas.","dw"],
["idd",3,"Um cliente quer integrar 12 sistemas e hoje tem 40 ligações ponto a ponto. Qual é a melhor sugestão?",
 ["Um barramento ou plataforma de integração com contratos padronizados, para reduzir o número de ligações", "Criar mais ligações diretas, para ganhar redundância", "Unificar todos os sistemas em um único banco de dados", "Manter tudo como está e documentar as ligações em uma planilha"],
 "Com N sistemas, ponto a ponto chega a N×(N−1)/2 ligações. Um hub ou iPaaS reduz para cerca de N e centraliza monitoramento e segurança.","int"],
["idd",4,"Uma API aceita 100 requisições por segundo e o cliente envia 250 por segundo em pico, durante 10 s. Qual desenho absorve melhor essa carga?",
 ["Uma fila na frente do consumo, processando 100/s e acumulando o excedente", "Aumentar o timeout para 10 minutos nas chamadas síncronas, para que nenhuma requisição seja descartada", "Rejeitar todas as chamadas durante o pico, sem aviso", "Duplicar o pico no cliente para que a API se acostume"],
 "Em 10 s chegam 2.500 requisições e são processadas 1.000; a fila guarda as 1.500 restantes e esvazia depois. Timeouts longos só empilham chamadas travadas.","msg"],
["idd",4,"Em uma cadeia de três chamadas síncronas, cada serviço tem 99,9% de disponibilidade. Qual é a disponibilidade da cadeia?",
 ["Cerca de 99,7% (0,999³)", "Cerca de 99,9%, igual à de um serviço", "Cerca de 99,99%, pois a redundância aumenta o valor", "Cerca de 99,0%, que é a soma das indisponibilidades vezes dez"],
 "Em série, multiplicam-se as disponibilidades: 0,999³ ≈ 0,997. Quanto mais dependências síncronas, menor a disponibilidade, o que justifica filas, cache e fallbacks.","int"],
["idd",4,"Qual é o risco de usar o mesmo banco de dados como \"canal de integração\" entre vários sistemas?",
 ["Acoplamento forte pelo esquema, o que impede evoluir tabelas sem quebrar outros sistemas", "Impossibilidade de fazer backup do banco compartilhado", "Perda automática de todos os dados na primeira atualização", "Aumento garantido da segurança, que passa a ser centralizada em um único banco, sem necessidade de outros controles"],
 "Quando outros sistemas leem tabelas diretamente, qualquer mudança vira risco para todos. APIs e eventos criam contratos estáveis que escondem o esquema interno.","int"],
["idd",4,"Pedidos são gravados no banco e publicados na fila em dois passos. O banco confirma, mas a publicação falha. Qual padrão resolve a inconsistência?",
 ["Outbox transacional: grava o evento na mesma transação e um processo o publica depois", "Publicar na fila antes de gravar no banco, sem retentativa, e corrigir manualmente as eventuais divergências", "Ignorar a falha, pois a próxima venda corrige o estado, e confiar que o cliente refará o pedido quando perceber", "Reduzir o tempo de espera da fila para zero"],
 "Gravar dado e evento em uma única transação local e publicar a partir dessa tabela garante que nenhum fato se perca. Os dois passos separados não são atômicos.","msg"],
["idd",4,"Um relatório diário leva 6 horas e precisa terminar em 2 horas. Os dados são 3 TB e a leitura é feita em um só nó. Qual ação tem mais impacto?",
 ["Paralelizar a leitura e o processamento por partição, em vários nós", "Trocar a cor do painel e reduzir o número de colunas exibidas, para que o relatório carregue mais rápido", "Aumentar o intervalo entre execuções para uma vez por semana", "Reduzir a memória do nó para forçar o uso de disco"],
 "Dividir os dados em partições processadas em paralelo reduz o tempo quase em proporção ao número de nós, se não houver gargalo de I/O ou de junção.","etl"],
["idd",4,"Uma empresa quer análises em tempo real, mas sua origem é um ERP legado que só exporta arquivos à noite. Qual é a abordagem mais realista?",
 ["Combinar CDC no banco do ERP, quando possível, com a carga noturna como contingência, explicando o limite ao cliente", "Prometer dados em tempo real sem mexer na origem", "Substituir o ERP em uma semana para liberar os dados", "Executar o arquivo noturno a cada minuto até chegar ao tempo real, aumentando a frequência da exportação do ERP legado"],
 "A latência de uma análise nunca é menor que a da origem. Se não há evento ou log acessível, deve-se dizer isso, propor CDC e manter a carga em lote como base.","dw"],
["idd",4,"Uma API pública começa a receber centenas de milhares de chamadas repetidas para o mesmo recurso. Qual medida reduz mais o custo e a carga?",
 ["Cache (inclusive na borda/CDN) com tempo de validade adequado e cabeçalhos corretos", "Adicionar mais campos às respostas para satisfazer o consumidor", "Desativar a autenticação para acelerar a resposta", "Mudar o formato de JSON para XML, que é mais pesado"],
 "Se o recurso muda pouco, servir cópias em cache evita chegar ao backend. O desafio é definir o tempo de validade e a invalidação sem entregar dados velhos.","api"],
["idd",4,"Uma plataforma de dados mistura dados pessoais de clientes de vários países em um único lake. Qual cuidado de arquitetura é mais importante?",
 ["Classificar os dados, aplicar controle de acesso por coluna ou domínio e respeitar residência e retenção", "Armazenar tudo em um único bucket aberto para facilitar a consulta", "Duplicar os dados em todos os países para ganhar desempenho", "Eliminar o registro de acessos para economizar armazenamento"],
 "Um lake sem governança vira passivo legal. Classificação, minimização, mascaramento, auditoria e regras de localização são parte do desenho, e não um complemento.","dw"],
["gov",1,"O que é arquitetura corporativa (enterprise architecture)?",
 ["A prática de alinhar negócio, processos, dados, aplicações e tecnologia da empresa de forma coordenada", "O desenho da rede elétrica do prédio da empresa, incluindo geradores, nobreaks e circuitos de refrigeração do datacenter", "A escolha do provedor de nuvem de menor preço", "O organograma e o plano de cargos do departamento de TI, com os níveis salariais de cada função e carreira"],
 "A arquitetura corporativa olha a empresa inteira, e não um projeto isolado. Seu objetivo é fazer a TI apoiar as metas do negócio de modo coerente.","ea"],
["gov",1,"Para que serve a governança de TI?",
 ["Garantir que as decisões e os investimentos de TI estejam alinhados ao negócio, com responsabilidades e controles claros", "Aumentar o número de servidores da empresa", "Substituir o suporte técnico por automação total", "Escolher o fornecedor de internet mais barato"],
 "Governança define quem decide o quê, com quais regras e como se mede o resultado. Gestão é a execução do dia a dia, dentro dessas regras.","gv"],
["gov",1,"O que é o TOGAF?",
 ["Um framework de arquitetura corporativa com um método para planejar e evoluir a arquitetura", "Uma linguagem de programação para sistemas legados", "Um padrão de cabeamento estruturado para datacenters", "Uma certificação de segurança para provedores de nuvem"],
 "O TOGAF propõe o ADM, um ciclo de etapas para definir visão, arquiteturas de negócio, dados, aplicações e tecnologia, e gerenciar mudanças.","ea"],
["gov",1,"O que é a LGPD?",
 ["A lei brasileira que regula o tratamento de dados pessoais", "Um protocolo de rede para troca de e-mails", "Uma norma técnica para cabeamento de rede", "Um framework para desenvolvimento ágil de software, com sprints e backlog"],
 "A Lei Geral de Proteção de Dados define direitos dos titulares e deveres de quem trata dados pessoais. Afeta o desenho de sistemas, acessos e retenção.","cmp"],
["gov",1,"O que é uma política de TI?",
 ["Uma regra formal que orienta como a organização usa, protege e gerencia a tecnologia", "Um contrato de compra de equipamentos", "Um relatório mensal de chamados abertos", "Uma lista de senhas compartilhadas pela equipe"],
 "Políticas (como a de segurança, de backup e de acesso) transformam objetivos em regras que todos devem seguir e que podem ser auditadas.","gv"],
["gov",1,"O que significa \"padrão tecnológico\" em uma empresa?",
 ["Uma tecnologia escolhida e recomendada para ser reutilizada nos projetos, para reduzir variedade e custo", "A obrigação de comprar sempre o equipamento mais caro do mercado, para garantir desempenho máximo em todos os casos", "O nome interno do departamento de infraestrutura", "Uma regra que proíbe qualquer tecnologia nova"],
 "Padrões reduzem custo de suporte, risco e esforço de treinamento. Exceções existem, mas devem ser justificadas.","gv"],
["gov",1,"O que é um portfólio de aplicações?",
 ["Um inventário das aplicações da empresa, com informações como dono, criticidade, custo e tecnologia", "A lista de clientes que mais compram da empresa", "O conjunto de apresentações comerciais do time de vendas", "Um contrato de licenciamento de softwares"],
 "Sem inventário, não se sabe o que existe, quem é responsável nem o que modernizar ou desligar. É a base para decisões de racionalização.","cat"],
["gov",1,"O que é um ADR (architecture decision record)?",
 ["Um registro curto de uma decisão de arquitetura, com contexto, alternativas e consequências", "Um diagrama de rede da matriz da empresa", "Uma planilha de custos mensais da nuvem", "Um relatório de desempenho do banco de dados"],
 "Registrar decisões evita redescobrir, meses depois, o porquê de uma escolha. O ADR guarda o contexto e as alternativas descartadas.","adr"],
["gov",2,"Qual é o papel de um comitê de arquitetura (architecture review board)?",
 ["Revisar decisões relevantes, garantir aderência aos padrões e tratar exceções com critério", "Aprovar todas as compras de papel e material de escritório", "Executar as tarefas diárias de suporte aos usuários", "Contratar os fornecedores de limpeza do prédio"],
 "O comitê aplica a governança: avalia propostas contra padrões e princípios, aprova exceções e mantém coerência, sem se tornar um gargalo burocrático.","gv"],
["gov",2,"O que é um mapa de capacidades de negócio (business capability map)?",
 ["Uma visão do que a empresa faz (por exemplo, vender, entregar, cobrar), independente de sistemas e áreas", "Um mapa geográfico das filiais da empresa", "Uma lista dos servidores e suas capacidades de CPU, memória, disco e rede, mantida pela equipe de infraestrutura", "Um relatório de metas individuais de cada colaborador, usado na avaliação anual de desempenho da área de tecnologia"],
 "As capacidades são estáveis, ao contrário de sistemas e organogramas. Servem para relacionar investimentos de TI ao negócio e achar redundâncias.","cat"],
["gov",2,"Qual das opções descreve melhor a diferença entre governança e gestão?",
 ["A governança define direção, regras e responsabilidades; a gestão planeja e executa dentro delas", "A governança cuida da rede; a gestão cuida dos servidores", "Não existe diferença prática entre os dois termos", "A governança executa os projetos do dia a dia; a gestão apenas registra o resultado e arquiva os documentos"],
 "Em frameworks como COBIT, o conselho e a alta direção governam (avaliam, dirigem, monitoram), e a gestão planeja, constrói, opera e controla.","gv"],
["gov",2,"O que é a ISO/IEC 27001?",
 ["Uma norma para um sistema de gestão da segurança da informação, que pode ser certificada", "Uma norma de qualidade para fabricação de hardware, que define tolerâncias de componentes e testes de bancada", "Um padrão de formatação de documentos técnicos, que define fontes, margens e estilos de títulos de relatórios", "Uma lei brasileira sobre contratos de nuvem"],
 "A 27001 define requisitos para estabelecer, manter e melhorar a segurança da informação, com análise de risco e controles. Uma auditoria pode certificar a empresa.","cmp"],
["gov",2,"Qual é o papel do controlador e do operador na LGPD?",
 ["O controlador decide sobre o tratamento dos dados pessoais; o operador os trata em nome dele", "O controlador é o servidor que armazena os dados e o operador é o banco de dados que guarda as informações", "O controlador faz o backup e o operador faz a restauração", "Ambos são cargos exclusivos da autoridade fiscalizadora"],
 "O controlador define finalidade e meios. O operador (por exemplo, um provedor de nuvem) segue as instruções do controlador. Ambos têm obrigações e responsabilidades.","cmp"],
["gov",2,"Por que registrar princípios de arquitetura (por exemplo, \"reusar antes de comprar\")?",
