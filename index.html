<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6C4CF5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>:root{color-scheme:light dark}html,body{margin:0}body{font-size:14px}</style>
<title>Arquiteto de Bolso</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: uma coluna estreita de celular, sobre papel milimetrado de planta técnica. Trilhas são cartões com degraus numerados; o quiz ocupa a tela inteira. */
:root{
  --bg:#EDF0EE; --surface:#F8FAF9; --ink:#14222B; --ink-2:#4A5A63; --line:#C4CFCB; --grid:#DCE3E0;
  --accent:#B8420A; --on-accent:#FFFFFF; --accent-soft:#F6E1D5;
  --good:#1D7A4B; --good-bg:#DCF0E4; --bad:#B3261E; --bad-bg:#F8DEDA; --off:#D3DCD9;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1A21; --surface:#15252E; --ink:#E7EFF1; --ink-2:#9DB0B8; --line:#2B404B; --grid:#142530;
  --accent:#FF9A5C; --on-accent:#1A0F08; --accent-soft:#3A2417;
  --good:#6FD3A0; --good-bg:#12382A; --bad:#FF9188; --bad-bg:#40191A; --off:#233741; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1A21; --surface:#15252E; --ink:#E7EFF1; --ink-2:#9DB0B8; --line:#2B404B; --grid:#142530;
  --accent:#FF9A5C; --on-accent:#1A0F08; --accent-soft:#3A2417;
  --good:#6FD3A0; --good-bg:#12382A; --bad:#FF9188; --bad-bg:#40191A; --off:#233741; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink); font:16px/1.5 var(--f-body);
  padding-block:12px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.15}
p{margin:0}
.mono{font-family:var(--f-mono);font-weight:500;letter-spacing:.04em}
.label{font-family:var(--f-mono);font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}

/* topo */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.01em}
.brand span{color:var(--accent)}
.stats{display:flex;gap:8px}
.pill{display:flex;flex-direction:column;align-items:flex-start;min-width:76px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.pill b{font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums;line-height:1.2}
.goal{display:flex;flex-direction:column;gap:6px}
.goal-row{display:flex;justify-content:space-between;gap:12px}
.track{height:8px;border-radius:99px;background:var(--off);overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}

/* cartões */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h2{font-size:20px}
.muted{color:var(--ink-2)}
.primary,.secondary{min-height:48px;border-radius:10px;padding:10px 18px;font-weight:600;border:2px solid var(--accent);width:100%}
.primary{background:var(--accent);color:var(--on-accent)}
.secondary{background:transparent;color:var(--accent)}
.primary:disabled,.secondary:disabled{opacity:.45;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:8px 0;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;text-align:left;min-height:44px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 140px}

/* trilhas */
.trail-head{display:flex;flex-direction:column;gap:4px}
.tag{font-family:var(--f-mono);font-weight:500;font-size:12px;letter-spacing:.06em;color:var(--accent)}
.thead{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:none;border:0;padding:0;min-height:56px}
.tname{font-family:var(--f-display);font-weight:600;font-size:20px;line-height:1.15}
.tmeta{display:flex;align-items:center;gap:10px;flex:none}
.chev{width:32px;height:32px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:18px}
.row2{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.lvls{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.lvl{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0;min-height:64px}
.lvl:last-child{border-bottom:0}
.node{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:500;font-size:16px;border:2px solid var(--accent);color:var(--accent);background:var(--surface)}
.lvl[data-state="done"] .node{background:var(--good);border-color:var(--good);color:var(--surface)}
.lvl[data-state="locked"] .node{border-color:var(--off);color:var(--ink-2);background:var(--off)}
.lvl[data-state="locked"]{color:var(--ink-2)}
.lvl-main{flex:1;min-width:0;display:flex;flex-direction:column}
.lvl-main b{font-weight:600}
.lvl-main small{color:var(--ink-2);font-size:13px}
.lvl-side{flex:none;font-family:var(--f-mono);font-weight:500;font-size:12px;color:var(--ink-2);text-align:right;max-width:110px}
.lvl[data-state="done"] .lvl-side{color:var(--good)}
.lvl[data-state="open"] .lvl-side{color:var(--accent)}
.soon{opacity:.6;cursor:default}

/* quiz */
.qtop{display:flex;align-items:center;gap:12px}
.qtop .track{flex:1}
.qtop .count{font-family:var(--f-mono);font-weight:500;font-size:14px;font-variant-numeric:tabular-nums}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;min-height:40px;padding:6px 12px;color:var(--ink-2)}
.qcard{display:flex;flex-direction:column;gap:14px}
.qmeta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.boss{font-family:var(--f-mono);font-weight:500;font-size:12px;letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--on-accent);padding:2px 8px;border-radius:4px}
.qtext{font-family:var(--f-display);font-weight:600;font-size:20px;line-height:1.3}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;min-height:56px;padding:12px;border:2px solid var(--line);border-radius:10px;background:var(--surface)}
.opt .k{flex:none;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:500;font-size:13px;background:var(--off);color:var(--ink)}
.opt .t{min-width:0;overflow-wrap:anywhere}
.opt:not(:disabled):active{border-color:var(--accent)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.ok .k{background:var(--good);color:var(--surface)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .k{background:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default;color:var(--ink)}
.opt:disabled:not(.ok):not(.bad){opacity:.6}
.fb{border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px}
.fb.good{background:var(--good-bg);color:var(--ink);border:1px solid var(--good)}
.fb.bad{background:var(--bad-bg);color:var(--ink);border:1px solid var(--bad)}
.fb b{font-family:var(--f-display);font-size:18px}
.fb.good b{color:var(--good)} .fb.bad b{color:var(--bad)}

/* resultado */
.big{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:28px;color:var(--ink-2)}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}

.foot{font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.bk{width:100%;font:13px/1.4 var(--f-mono);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px;resize:vertical}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20}

/* ===== Visual v2: cores por trilha, ícones, botões com relevo, animações ===== */
:root{--ts:52%;--tl:36%;--tbs:60%;--tbl:92%;--accent-deep:#8E3007;--shadow:0 1px 0 rgba(20,34,43,.05),0 6px 16px -8px rgba(20,34,43,.25);--flame:#E8590C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ts:62%;--tl:68%;--tbs:32%;--tbl:20%;--accent-deep:#C46A33;--shadow:0 1px 0 rgba(0,0,0,.3),0 8px 18px -10px rgba(0,0,0,.7);--flame:#FF8A4C}}
:root[data-theme="dark"]{--ts:62%;--tl:68%;--tbs:32%;--tbl:20%;--accent-deep:#C46A33;--shadow:0 1px 0 rgba(0,0,0,.3),0 8px 18px -10px rgba(0,0,0,.7);--flame:#FF8A4C}
.ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.sm{width:18px;height:18px}
.card{border-radius:16px;box-shadow:var(--shadow)}
.tc{--tc:hsl(var(--h) var(--ts) var(--tl));--tbg:hsl(var(--h) var(--tbs) var(--tbl))}


.dgi{border:1px solid var(--line);border-left:5px solid var(--tc);background:var(--tbg);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.dgi .dgh{display:flex;flex-direction:column;gap:2px}
.dgi .label{color:var(--tc)}
.dgi b{font-size:16px;line-height:1.3}
.dgi .dgp{font-size:13px;color:var(--ink-2)}
.dgi p{margin:0}

.brand{font-size:22px}
.chips{display:flex;gap:8px}
.chip{display:flex;align-items:center;gap:6px;padding:6px 12px 6px 10px;border:1px solid var(--line);border-radius:99px;background:var(--surface);font-family:var(--f-mono);font-weight:500;font-size:15px;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.chip.fire .ico{color:var(--flame);fill:var(--flame);fill-opacity:.25}
.chip.xp .ico{color:var(--accent);fill:var(--accent);fill-opacity:.25}
.hero{display:flex;flex-direction:row;align-items:center;gap:16px;padding:16px}
.hero-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.hero-big{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.hero-big small{font-size:16px;font-weight:600;color:var(--ink-2)}
.ring{flex:none;width:76px;height:76px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bg{stroke:var(--off)}
.ring .fg{stroke:var(--accent);transition:stroke-dashoffset .6s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:15px;font-weight:500}

.primary,.secondary{border-radius:14px;box-shadow:0 4px 0 var(--accent-deep);transition:transform .08s,box-shadow .08s;letter-spacing:.01em}
.secondary{box-shadow:0 4px 0 var(--accent-soft)}
.primary:active:not(:disabled),.secondary:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--accent-deep)}
.primary:disabled,.secondary:disabled{box-shadow:none}

.tcard{padding:0;overflow:hidden;gap:0}
.tcard .thead{padding:14px 16px;min-height:76px;gap:12px}
.tbadge{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--tbg);color:var(--tc)}
.tbadge .ico{width:26px;height:26px}
.tcard .trail-head{flex:1;min-width:0;gap:2px}
.tcard .tag{color:var(--tc);font-size:11px}
.tcard .tname{font-size:19px}
.tmeta{flex-direction:column;align-items:flex-end;gap:8px}
.pips{display:flex;gap:4px}
.pip{width:11px;height:6px;border-radius:99px;background:var(--off)}
.pip.on{background:var(--tc)}
.chev{width:28px;height:28px;border:0;background:var(--tbg);color:var(--tc);transition:transform .2s}
.chev .ico{width:16px;height:16px;stroke-width:2.6}
.thead[aria-expanded="true"] .chev{transform:rotate(180deg)}
.tbody{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.tcard .row2 .label{color:var(--tc)}
.tcard .secondary{border-color:var(--tc);color:var(--tc);box-shadow:0 4px 0 var(--tbg)}
.lvls{border-top:0;gap:0}
.lvl{position:relative;border-bottom:0;padding:10px 0;min-height:76px;gap:14px}
.lvl:not(:last-child)::after{content:"";position:absolute;left:23px;top:calc(50% + 24px);height:calc(100% - 48px);width:4px;border-radius:2px;background:var(--off)}
.lvl[data-state="done"]:not(:last-child)::after{background:var(--tc)}
.node{width:48px;height:48px;border:0 solid transparent;background:var(--tbg);color:var(--tc);font-weight:500;font-size:18px;box-shadow:0 4px 0 var(--tc)}
.lvl[data-state="open"] .node{background:var(--surface);color:var(--tc);border:3px solid var(--tc);box-shadow:0 4px 0 var(--tbg);animation:glow 1.8s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 4px 0 var(--tbg),0 0 0 0 transparent}50%{box-shadow:0 4px 0 var(--tbg),0 0 0 6px var(--tbg)}}
.lvl[data-state="done"] .node{background:var(--tc);color:var(--surface);border-color:transparent;box-shadow:0 4px 0 hsl(var(--h) var(--ts) calc(var(--tl) - 14%))}
.lvl[data-state="locked"] .node{background:var(--off);color:var(--ink-2);box-shadow:0 4px 0 var(--line)}
.lvl[data-state="open"]:not(:disabled):active .node{transform:translateY(3px);box-shadow:0 1px 0 var(--tc)}
.lvl[data-state="open"] .lvl-side{color:var(--tc)}
.lvl[data-state="done"] .lvl-side{color:var(--good)}
.lvl-side{font-size:11px}

.qtop .track{height:12px}
.qtop .track i{background:var(--tc,var(--accent))}
.opt{border-bottom-width:4px;border-radius:14px;transition:transform .08s,border-color .15s}
.opt:not(:disabled):active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
.opt.ok{animation:pop .35s ease-out}
.opt.bad{animation:shake .4s}
.fb{animation:rise .25s ease-out}
.qtext{font-size:21px}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.intro{display:flex;flex-direction:row;gap:14px;align-items:flex-start}
.intro .tbadge{background:var(--accent-soft);color:var(--accent)}
.resultcard{position:relative;overflow:hidden}
.check{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--good-bg);color:var(--good)}
.check .ico{width:40px;height:40px;stroke-width:3}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;opacity:0;animation:fall 1.8s ease-in forwards}
@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(420px) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== Visual v3: vivo, arredondado, com cara de app de jogo ===== */
:root{
  --f-display:'Nunito','Segoe UI',system-ui,sans-serif; --f-body:'Nunito','Segoe UI',system-ui,sans-serif; --f-mono:'Nunito','Segoe UI',system-ui,sans-serif;
  --bg:#F2EFFF; --surface:#FFFFFF; --ink:#1E1B3A; --ink-2:#5E5B80; --line:#E1DCF6; --grid:transparent;
  --accent:#6C4CF5; --on-accent:#FFFFFF; --accent-soft:#E7E1FF; --accent-deep:#4A30C2;
  --good:#12A150; --good-bg:#DDF7E8; --bad:#E03A40; --bad-bg:#FFE2E3; --off:#E7E4F6;
  --flame:#FF7A1A; --pink:#FF4FA3; --blob1:rgba(108,76,245,.22); --blob2:rgba(255,79,163,.16);
  --ts:80%; --tl:42%; --tbs:90%; --tbl:94%; --tf1:54%; --tf2:44%;
  --shadow:0 2px 0 rgba(30,27,58,.04),0 10px 24px -12px rgba(74,48,194,.35);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13102B; --surface:#1E1A3F; --ink:#F3F1FF; --ink-2:#ABA7D8; --line:#332E66; --grid:transparent;
  --accent:#8C74FF; --on-accent:#120B33; --accent-soft:#2C2566; --accent-deep:#5A42D4;
  --good:#4ADE80; --good-bg:#12361F; --bad:#FF7B80; --bad-bg:#431B24; --off:#2A2656;
  --flame:#FF9A4C; --pink:#FF7AB8; --blob1:rgba(140,116,255,.20); --blob2:rgba(255,122,184,.10);
  --ts:90%; --tl:70%; --tbs:45%; --tbl:22%; --tf1:50%; --tf2:38%;
  --shadow:0 2px 0 rgba(0,0,0,.25),0 12px 26px -14px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13102B; --surface:#1E1A3F; --ink:#F3F1FF; --ink-2:#ABA7D8; --line:#332E66; --grid:transparent;
  --accent:#8C74FF; --on-accent:#120B33; --accent-soft:#2C2566; --accent-deep:#5A42D4;
  --good:#4ADE80; --good-bg:#12361F; --bad:#FF7B80; --bad-bg:#431B24; --off:#2A2656;
  --flame:#FF9A4C; --pink:#FF7AB8; --blob1:rgba(140,116,255,.20); --blob2:rgba(255,122,184,.10);
  --ts:90%; --tl:70%; --tbs:45%; --tbl:22%; --tf1:50%; --tf2:38%;
  --shadow:0 2px 0 rgba(0,0,0,.25),0 12px 26px -14px rgba(0,0,0,.8); color-scheme:dark}
body{
  background-color:var(--bg);
  background-image:radial-gradient(520px 320px at 0% -4%,var(--blob1),transparent 70%),radial-gradient(460px 300px at 100% 8%,var(--blob2),transparent 70%);
  background-attachment:fixed; background-size:auto; font-weight:600;
}
.label,.tag,.mono{font-weight:800;letter-spacing:.07em}
.muted{font-weight:600}
.tc{--tf:hsl(var(--h) 85% var(--tf1));--tf-d:hsl(calc(var(--h) + 22) 85% var(--tf2))}
.brand{font-weight:900;font-size:24px;background:linear-gradient(90deg,var(--accent),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand span{color:inherit}
.chip{font-weight:900;font-size:16px;border:0;border-radius:99px;padding:7px 14px 7px 10px}
.chip.fire{background:color-mix(in srgb,var(--flame) 16%,var(--surface));color:var(--flame)}
.chip.xp{background:var(--accent-soft);color:var(--accent)}
.card{border:0;border-radius:24px;box-shadow:var(--shadow)}
.card h2{font-weight:900;font-size:21px}
.hero{background:linear-gradient(135deg,#6C4CF5 0%,#9B4CF5 55%,#FF4FA3 120%);color:#fff;box-shadow:0 6px 0 #4A30C2,0 18px 30px -16px rgba(108,76,245,.7);margin-bottom:6px}
.hero .label,.hero .muted,.hero small{color:rgba(255,255,255,.88)}
.hero-big{font-weight:900;color:#fff;font-size:32px}
.hero .ring .bg{stroke:rgba(255,255,255,.28)} .hero .ring .fg{stroke:#fff} .hero .ring b{color:#fff;font-weight:900}
.primary,.secondary{border-radius:18px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;font-size:15px;min-height:54px;border-width:0}

["rede",3,"Uma VPN IPsec entre duas sedes funciona para pings, mas transferências grandes travam. Qual a causa mais provável?",
 ["Problema de MTU/MSS: os pacotes ficam maiores que o limite do túnel depois do encapsulamento e acabam descartados", "Resolução de DNS lenta entre as sedes, que atrasa o início de transferências muito longas", "Rota duplicada: o tráfego de ida e volta passa por dois caminhos ao mesmo tempo e chega fora de ordem", "Excesso de VLANs no roteador, que passa a descartar quadros marcados com 802.1Q em rajadas"],
 "O túnel adiciona cabeçalhos, e pacotes maiores que o MTU efetivo são fragmentados ou descartados. O ajuste do MSS (por exemplo, 1360) costuma resolver.","diag"],
["rede",3,"Uma empresa quer reduzir a tabela de rotas, agrupando as sub-redes 10.1.0.0/24, 10.1.1.0/24, 10.1.2.0/24 e 10.1.3.0/24 em um anúncio único. Qual é a sumarização correta?",
 ["10.1.0.0/22", "10.1.0.0/23", "10.1.0.0/21", "10.1.0.0/24"],
 "Quatro blocos /24 contíguos somam 1024 endereços, o que equivale a um /22 (22 bits de rede). Um /23 cobriria só dois blocos.","end"],
["rede",3,"Um firewall com estado fica entre duas redes, e existem dois caminhos de ida e volta. Algumas conexões caem. Qual a causa mais provável?",
 ["Roteamento assimétrico: a volta passa por outro firewall que não conhece a conexão", "Esgotamento da tabela de conexões do firewall, que passa a descartar os pacotes de conexões novas", "Uso de IPv6 nas duas redes, que o firewall não sabe inspecionar e por isso interrompe", "Falta de sincronização de horário (NTP) entre os firewalls, que invalida as sessões em andamento"],
 "Se a ida passa por um firewall e a volta por outro, o segundo não tem a entrada na tabela de conexões e descarta o pacote. A solução é garantir simetria ou sincronizar o estado.","vlan"],
["rede",3,"Qual a diferença entre um balanceador de camada 4 e um de camada 7?",
 ["O de camada 4 decide por IP e porta; o de camada 7 decide por conteúdo, como URL e cabeçalhos", "O de camada 4 decide por URL e cookies; o de camada 7 decide por IP e porta", "O de camada 7 só funciona com tráfego sem criptografia, e o de camada 4 só consegue tratar conexões HTTPS", "Os dois funcionam do mesmo modo, e a diferença é apenas o equipamento e o preço de cada um"],
 "O L4 distribui conexões com base em IP e porta, de forma rápida. O L7 entende a aplicação (HTTP) e pode rotear por caminho, cabeçalho ou cookie, e terminar TLS.","diag"],
["rede",3,"Antes de migrar um site para outro IP, a equipe quer que a troca de DNS seja rápida. O que fazer com antecedência?",
 ["Reduzir o TTL do registro dias antes da mudança", "Aumentar o TTL do registro para que os caches guardem a resposta", "Trocar o tipo do registro de A para CNAME no dia da mudança", "Desativar o DNS e acessar o site apenas pelo IP"],
 "O TTL define por quanto tempo os resolvedores guardam a resposta. Com TTL baixo configurado antes, a mudança de IP se espalha em minutos em vez de horas.","dns"],
["rede",3,"Dois roteadores devem compartilhar um gateway virtual para que os computadores continuem com saída se um deles falhar. Qual recurso usar?",
 ["VRRP ou HSRP (protocolos de redundância de gateway), que oferecem um endereço IP virtual compartilhado", "STP, que bloqueia portas redundantes para evitar laços", "VTP, que replica a lista de VLANs entre os switches de uma mesma rede de camada 2", "SNMP, que monitora o estado dos equipamentos e envia alertas ao sistema de gerência"],
 "VRRP e HSRP criam um IP virtual de gateway entre dois roteadores. Se o principal falha, o reserva assume o IP sem que os computadores mudem a configuração.","rot"],
["rede",3,"A empresa A (10.0.0.0/16) vai se interligar com a empresa B, que também usa 10.0.0.0/16, e as duas não podem renumerar suas redes agora. Qual abordagem permite a comunicação?",
 ["Fazer NAT entre as duas, apresentando a cada lado um bloco traduzido sem conflito", "Criar uma rota estática que aponte todo o bloco 10.0.0.0/16 para o roteador da outra empresa", "Ligar as duas redes por um switch comum, formando uma única rede de camada 2 sem tradução de endereços", "Anunciar as duas redes por BGP para a internet, que decide qual dos blocos 10.0.0.0/16 deve ser usado"],
 "Com blocos sobrepostos o roteamento comum não distingue os destinos. O NAT traduz cada rede para um bloco exclusivo na visão do outro lado. A solução definitiva é renumerar.","end"],
["rede",4,"Dois links de internet de operadoras diferentes chegam ao mesmo roteador. A empresa quer usar os dois ao mesmo tempo, dividindo o tráfego. Qual recurso torna isso possível no roteamento?",
 ["ECMP (múltiplos caminhos de igual custo), com rotas de mesmo custo", "STP, que mantém um dos links bloqueado como reserva e libera apenas quando o outro cair", "VRRP, que só ativa o segundo link quando o primeiro falha", "NAT estático, que associa cada servidor interno a um dos dois links de internet disponíveis"],
 "O ECMP permite que o roteador distribua fluxos entre vários caminhos de mesmo custo. STP e VRRP trabalham com um caminho ativo e outro de reserva.","rot"],
["rede",4,"Um serviço DNS precisa responder pelo servidor mais próximo do usuário, em vários países, usando o mesmo endereço IP. Qual técnica faz isso?",
 ["Anycast: o mesmo IP é anunciado em vários locais, e a rede leva ao mais próximo", "Multicast: o IP é entregue a todos os servidores do grupo ao mesmo tempo", "Broadcast: o IP alcança todos os dispositivos de uma mesma sub-rede", "NAT64, que traduz o IP entre redes IPv6 e IPv4 conforme a localização do usuário"],
 "No anycast vários servidores anunciam o mesmo prefixo por BGP, e cada usuário é levado ao mais próximo pela topologia. É usado em DNS e CDNs.","dns"],
["rede",4,"Um provedor anuncia por BGP um prefixo mais específico que o seu. O que acontece com o tráfego para esse destino?",
 ["Segue o prefixo mais específico, pois a rota de maior prefixo (a mais específica) sempre vence na tabela", "Segue o seu prefixo, pois ele foi anunciado primeiro e a tabela de rotas preserva a mais antiga", "Divide-se igualmente entre os dois caminhos, pois ambos os prefixos são válidos para o destino", "É descartado, pois o BGP rejeita automaticamente prefixos que se sobrepõem aos já existentes"],
 "O encaminhamento usa a correspondência mais longa (longest prefix match). Um /24 anunciado por terceiros vence um /22 seu, e é por isso que sequestros de rotas funcionam.","rot"],
["rede",4,"Na rede da empresa, uma aplicação funciona por IPv4 mas falha por IPv6 em alguns clientes, e os usuários reclamam de lentidão. Qual a estratégia adequada durante a transição?",
 ["Dual-stack bem testado, com IPv6 funcional ponta a ponta ou desativado de forma consciente", "Desativar o IPv4 imediatamente, forçando todos os clientes e servidores a usarem apenas IPv6", "Tunelar todo o IPv6 por NAT na saída da rede, dispensando a criação dos registros AAAA no DNS", "Manter o IPv6 ativo só no lado do cliente, sem configurar o servidor nem os registros no DNS"],
 "Se o DNS anuncia AAAA mas o IPv6 não funciona ponta a ponta, os clientes tentam IPv6, esperam o tempo limite e só então voltam ao IPv4. O dual-stack exige testar os dois caminhos.","end"],
["rede",4,"Uma ferramenta mostra que o traceroute perde pacotes em um salto intermediário, mas o destino final responde normalmente. Qual a interpretação mais provável?",
 ["O roteador do salto limita respostas de controle (ICMP), o que não indica falha no tráfego real de dados", "O tráfego real está sendo perdido naquele salto, e o equipamento precisa ser substituído com urgência", "O destino responde por outro caminho, ignorando o salto, o que mostra uma rota assimétrica com falha", "O DNS resolve para um IP incorreto a partir daquele salto, o que desvia os pacotes para outro destino"],
 "Muitos roteadores têm baixa prioridade para responder ICMP próprio. Se os saltos seguintes e o destino respondem sem perda, o tráfego de dados não está sendo afetado.","diag"],
["rede",4,"Dentro de um datacenter, os servidores de aplicação de uma VLAN não devem conversar entre si, apenas com o banco de dados. Qual o recurso mais adequado?",
 ["Microssegmentação, com regras de firewall por carga de trabalho", "Mais uma VLAN de gerenciamento, com todos os servidores de aplicação colocados nela juntos", "Um switch mais rápido com maior capacidade de encaminhamento", "Aumentar o tempo de vida (TTL) das entradas na tabela ARP dos servidores de aplicação da VLAN"],
 "A microssegmentação aplica regras entre cargas de trabalho, mesmo dentro de uma mesma sub-rede, bloqueando o movimento lateral de um invasor.","vlan"],
["rede",4,"A VPN site a site de uma filial usa uma rota estática. Se o link principal falhar, a filial perde o acesso mesmo com um segundo link disponível. Qual a melhoria mais adequada?",
 ["Usar roteamento dinâmico sobre os túneis, para trocar de caminho em falhas", "Aumentar o MTU do túnel VPN para o máximo permitido, a fim de reduzir a perda de pacotes na filial", "Colocar mais uma VLAN na filial, dedicada exclusivamente ao tráfego do segundo link", "Reduzir o TTL do DNS interno para 5 segundos, para que os nomes sejam atualizados mais rápido"],
 "Rotas estáticas não percebem a queda de um túnel. Com roteamento dinâmico (por exemplo BGP sobre IPsec) as rotas são retiradas e o tráfego muda para o outro caminho.","diag"],
["rede",4,"Uma empresa quer criar um novo escritório com 600 computadores, prevendo crescimento. O bloco 192.168.0.0/16 está livre. Qual alocação equilibra espaço e organização?",
 ["Um /22 para os computadores, dentro de um plano de endereçamento por local", "Um /16 inteiro para o escritório, sem planejar os demais locais", "Vários /30, um para cada computador, isolando por completo cada equipamento dos demais do escritório", "Um /24 repetido em seis VLANs diferentes, com o mesmo endereçamento em cada uma delas"],
 "Um /22 tem 1022 endereços utilizáveis, atende 600 computadores com folga e deixa espaço para outros locais. Um /24 comporta só 254, e sobreposição entre VLANs quebra o roteamento.","end"],
["arq",1,"O que é virtualização?",
 ["Rodar várias máquinas virtuais em um só servidor físico", "Criar um servidor que não consome energia elétrica", "Rodar o servidor somente pela internet, sem precisar de hardware algum", "Copiar os dados do servidor para um lugar seguro"],
 "Um programa chamado hypervisor divide o servidor físico em vários computadores virtuais independentes, aproveitando melhor o hardware.","vir"],
["arq",1,"Qual tipo de armazenamento funciona como um disco ligado ao servidor, onde roda um sistema operacional ou um banco de dados?",
 ["Armazenamento em bloco, que age como um disco do servidor", "Armazenamento de objetos, acessado por endereço web", "Armazenamento em fita, usado para arquivar dados antigos", "Pastas compartilhadas pela rede, como um drive de rede"],
 "O armazenamento em bloco se comporta como um disco comum, com baixa latência. Objetos guardam arquivos inteiros acessados por internet; arquivos são pastas compartilhadas pela rede.","sto"],
["arq",1,"Qual armazenamento serve melhor para guardar milhões de fotos e backups, acessados pela internet e com custo baixo?",
 ["Armazenamento de objetos, acessado pela internet e barato", "Armazenamento em bloco, ligado a um único servidor da empresa", "Memória RAM do servidor, que é muito rápida mas some quando ele desliga", "Cache do processador, que fica dentro da CPU"],
 "O armazenamento de objetos (como S3 e OCI Object Storage) escala quase sem limite, custa pouco por GB e é acessado por endereço web.","sto"],
["arq",1,"Qual é a diferença entre CPU, memória (RAM) e disco?",
 ["A CPU processa; a RAM guarda o que está em uso; o disco guarda de vez", "A CPU guarda os arquivos, e o disco faz os cálculos do sistema inteiro", "A RAM guarda os dados para sempre, mesmo com o servidor desligado e sem energia", "As três peças fazem exatamente a mesma função"],
 "Dimensionar um servidor exige olhar os três: poder de processamento, memória para o que está em execução e disco para os dados.","dim"],
["arq",1,"O que é RAID 1 (espelhamento)?",
 ["Grava os mesmos dados em dois discos; se um falhar, o outro segue", "Divide os dados entre discos para ganhar velocidade, sem proteção", "Faz uma cópia dos dados em nuvem a cada hora", "Comprime os dados para ocupar menos espaço"],
 "RAID 1 protege contra a falha de um disco, mas não contra exclusão por engano ou vírus. Por isso RAID não substitui backup.","sto"],
["arq",1,"Para que serve um sistema de monitoramento?",
 ["Avisar sobre problemas e acompanhar o uso antes que os usuários sintam", "Criptografar os dados guardados nos discos dos servidores", "Fazer cópias de segurança dos servidores todas as noites", "Distribuir endereços IP aos aparelhos da rede"],
 "Monitorar CPU, memória, disco e disponibilidade permite agir antes da queda. Alertas bem ajustados evitam tanto o susto quanto o excesso de avisos.","dim"],
["arq",1,"O que é a arquitetura em três camadas?",
 ["Interface, regras de negócio e dados (banco)", "Rede, energia e refrigeração do datacenter", "Usuário, administrador e visitante do sistema", "Entrada, processamento e saída de arquivos"],
 "Separar as camadas permite escalar, proteger e substituir cada parte sem mexer nas outras. É a base de muitas arquiteturas clássicas.","red"],
["arq",1,"Um servidor físico antigo roda uma única aplicação usando 10% da capacidade. A empresa quer reduzir custo e facilitar a manutenção. O que indicar?",
 ["Virtualizar e consolidar várias aplicações no mesmo servidor", "Comprar outro servidor igual para dividir a mesma aplicação entre os dois", "Aumentar a memória do servidor para usar mais capacidade", "Desligar o monitoramento para reduzir o consumo de energia"],
 "Com 90% de capacidade ociosa, consolidar em VMs economiza energia, espaço e licenças, e facilita backup e substituição do hardware.","vir"],
["arq",2,"Um servidor de arquivos precisa tolerar a falha de um disco e ter bom desempenho de escrita, aceitando usar metade da capacidade. Qual nível de RAID escolher?",
 ["RAID 10 (espelhamento com divisão), que tolera a falha de um disco e mantém boa velocidade de escrita", "RAID 0 (divisão sem redundância), que dobra a velocidade mas não protege", "RAID 5 (paridade distribuída), que tolera a falha de um disco, mas tem penalidade maior nas escritas", "JBOD (discos independentes), que soma a capacidade dos discos, sem nenhuma proteção contra falhas"],
 "O RAID 10 combina espelhos com divisão: bom desempenho e tolerância a falhas, ao custo de 50% da capacidade. O RAID 5 usa menos espaço, mas escreve mais devagar.","sto"],
["arq",2,"Uma VM precisa ser movida de um servidor físico para outro, sem desligar, para a manutenção do primeiro. Qual recurso do cluster permite isso?",
 ["Migração ao vivo (como vMotion ou Live Migration)", "Snapshot da VM, que guarda o estado do disco em um momento", "Clone completo da VM, que cria uma cópia independente", "Replicação do banco de dados, que copia as tabelas para outro servidor"],
 "A migração ao vivo move a memória e o estado da VM entre hosts enquanto ela continua rodando, normalmente com armazenamento compartilhado. Snapshot e clone não movem a VM em execução.","vir"],
["arq",2,"Uma equipe diz que o snapshot da VM antes de uma atualização substitui o backup. Qual o problema dessa ideia?",
 ["O snapshot depende do mesmo armazenamento e se perde junto com a VM ou o disco em caso de falha", "O snapshot é sempre mais lento de restaurar do que um backup completo feito em outro sistema", "O snapshot só protege contra falhas de rede e não registra o conteúdo do disco da VM", "O snapshot não guarda as alterações feitas depois de criado, e por isso não serve para voltar ao estado anterior"],
 "Snapshots ficam no mesmo armazenamento da VM, crescem com o tempo e não protegem contra falha de disco, exclusão do volume ou ataque. Servem para voltar de uma mudança, não como cópia de segurança.","bkp"],
["arq",2,"Uma aplicação web recebe picos e roda em um único servidor. Qual mudança melhora a disponibilidade e permite crescer horizontalmente?",
 ["Colocar vários servidores web atrás de um balanceador de carga", "Trocar o servidor por outro com o dobro de CPU e memória, mantendo apenas uma máquina em produção", "Aumentar o disco do servidor para guardar mais logs", "Trocar a versão do sistema operacional por uma mais recente"],
 "O balanceador distribui as requisições entre servidores idênticos: se um falhar, os outros seguem, e novos podem ser adicionados. Aumentar o hardware é escala vertical e mantém o ponto único de falha.","red"],
["arq",2,"O que significa provisionamento fino (thin provisioning) em um armazenamento?",
 ["O espaço é alocado conforme o uso real, e não de uma vez", "O espaço é reservado por inteiro no momento da criação do disco", "Os dados são comprimidos e guardados sem nenhuma redundância", "O disco só pode ser lido, e nunca alterado depois de criado"],
 "No thin provisioning o volume parece ter o tamanho total, mas consome espaço físico só quando recebe dados. Permite superalocar, e exige monitorar para não esgotar a capacidade.","sto"],
["arq",2,"Qual configuração descreve melhor uma redundância N+1 em um cluster de virtualização?",
 ["Servidores suficientes para a carga mais um extra, que cobre a falha de um", "Dois servidores para cada servidor necessário, duplicando tudo", "Um único servidor muito grande que concentra a carga inteira", "Servidores iguais sem nenhum extra, mas com réplicas das VMs e backup noturno dos dados"],
 "Em N+1, a capacidade necessária é atendida por N servidores e há um adicional para assumir a carga se um falhar. É mais econômico que 2N, que duplica todo o ambiente.","red"],
["arq",2,"Em um sistema de três camadas, qual componente costuma ser o mais difícil de escalar horizontalmente?",
 ["O banco de dados, por manter estado e consistência dos dados", "A camada web, por não guardar nenhum estado de usuário", "O balanceador de carga, por distribuir apenas conexões", "O servidor de arquivos estáticos, por servir cópias iguais de cada arquivo a todos os usuários"],
 "Servidores web e de aplicação sem estado são replicados com facilidade. O banco de dados guarda o estado e exige réplicas, partições ou técnicas mais elaboradas para crescer.","red"],
["arq",2,"Um datacenter tem 8 servidores de virtualização, cada um com 90% de uso de memória. Um servidor falha, e as VMs não conseguem reiniciar em outros. Qual o erro de planejamento?",
 ["Falta de capacidade reserva para absorver a falha de um servidor, pois todos já operam quase no limite", "Excesso de servidores, que dificulta o reinício automático das VMs", "Uso de memória alto demais nos servidores restantes, que o hipervisor trata como falha de rede", "Ausência de snapshots das VMs nos outros servidores, que impede o reinício automático"],
 "Oito servidores a 90% somam 720% de uso; os sete restantes só comportam 700%. Sem folga para o cenário N+1, as VMs do servidor que caiu não têm onde reiniciar.","dim"],
["arq",3,"Um banco de dados com muita escrita aleatória está lento em um storage com RAID 5. Qual alteração tende a melhorar mais o desempenho de escrita?",
 ["Migrar o volume para RAID 10 ou para discos SSD", "Trocar para RAID 6, que adiciona uma segunda paridade", "Aumentar o tamanho do cache de leitura do servidor web", "Adicionar mais um disco ao grupo, mantendo o RAID 5"],
 "Em RAID 5 cada escrita pequena exige ler e recalcular a paridade (penalidade de 4 operações). O RAID 10 tem penalidade de 2, e SSDs reduzem a latência. O RAID 6 piora a penalidade.","sto"],
["arq",3,"Uma empresa segue a regra 3-2-1 de backup. O que ela significa?",
 ["3 cópias dos dados, em 2 tipos de mídia diferentes, com 1 cópia mantida fora do local principal", "3 servidores de backup, em 2 datacenters diferentes, com 1 administrador responsável por tudo", "3 backups por semana, 2 por mês e 1 por ano, mantidos no mesmo servidor de arquivos", "3 níveis de RAID, 2 controladoras de disco e 1 disco reserva para cada grupo de discos"],
 "A regra 3-2-1 pede três cópias (a original e duas de backup), em dois tipos de mídia diferentes, com uma delas fora do local, o que protege contra falhas de hardware, erro e desastre.","bkp"],
["arq",3,"Em um ambiente com vários servidores e armazenamento compartilhado, o cluster precisa decidir qual grupo continua ativo após uma falha de rede entre os nós. Que mecanismo evita a divisão do cluster (split-brain)?",
 ["Quórum, em que só o grupo com a maioria dos votos continua operando", "Snapshot, em que o grupo com o instantâneo mais antigo do volume tem prioridade sobre os demais", "Thin provisioning, em que o grupo com menos disco assume", "Compressão, em que o grupo com menos dados compactados se desliga para liberar o disco"],
 "O quórum exige maioria de votos (nós ou uma testemunha) para continuar ativo. O grupo minoritário para, evitando que dois lados escrevam nos mesmos dados.","red"],
["arq",3,"Uma empresa quer simplificar seu datacenter, substituindo servidores, SAN e switches de armazenamento por nós que somam computação e disco local gerenciados por software. Como se chama essa abordagem?",
 ["Infraestrutura hiperconvergente (HCI)", "Infraestrutura em três camadas (three-tier)", "Colocation (aluguel de espaço em datacenter)", "Computação de borda (edge), com nós menores instalados perto dos usuários da empresa"],
 "Na HCI cada nó traz CPU, memória e discos, e o software agrega o armazenamento (como o vSAN). Reduz equipamentos separados e escala em nós, mas exige cuidados com licenças e rede.","vir"],
["arq",3,"Um sistema crítico usa dois servidores de banco de dados em cluster, mas um único switch de rede. Qual a fragilidade?",
 ["O switch é um ponto único de falha que derruba o cluster inteiro", "O cluster precisa obrigatoriamente de três servidores, e configurações com dois não são suportadas", "Os servidores devem ficar na mesma rede, o que é um erro", "O switch aumenta a latência, e isso impede replicar os dados"],
 "Redundância só vale se estiver em toda a cadeia: servidores, rede, energia e armazenamento. Um único switch é um SPOF. O correto é usar dois switches e conexões duplicadas (por exemplo, NIC teaming).","red"],
["arq",3,"A equipe de operações descobre que uma mudança pequena em um servidor derrubou outro sistema que ninguém sabia que dependia dele. O que teria evitado isso?",
 ["Um mapa de dependências e um banco de configurações (CMDB) atualizados, consultados antes de cada mudança", "Um servidor extra para cada sistema crítico, reservado para uso apenas em situações de emergência", "Um horário fixo para todas as mudanças da semana, mesmo sem análise prévia do impacto", "Um backup completo de todos os servidores antes de cada mudança planejada pela equipe"],
 "O CMDB e o mapeamento de dependências mostram o que se liga a quê, permitindo avaliar o impacto antes da mudança. Backups não evitam a queda de um sistema dependente.","red"],
["arq",3,"Uma empresa quer reduzir o custo de armazenar anos de backups raramente acessados, aceitando horas para recuperar. Qual solução é mais adequada?",
 ["Camada de arquivamento em fita ou armazenamento de objetos frio", "Discos SSD de alto desempenho em RAID 10, mantidos no mesmo datacenter com cópias diárias", "Replicação síncrona dos backups para um segundo datacenter, com acesso imediato aos dados", "Armazenamento em memória e em disco local de alta velocidade, com recuperação imediata"],
 "Dados que quase não são lidos e toleram demora vão para camadas frias, como fita ou objeto de arquivamento, com custo por GB bem menor que o de discos de produção.","bkp"],
["arq",3,"O banco de dados de um ERP roda em uma VM, com disco em SAN compartilhada com outras 60 VMs. No fechamento do mês o sistema fica lento, e o monitoramento mostra alta latência de disco, com CPU e memória normais. Qual a ação mais provável de resolver?",
 ["Isolar o banco em um volume dedicado, em camada mais rápida, ou mover o banco para discos SSD", "Adicionar mais vCPUs e mais memória à VM do banco, mantendo o disco compartilhado como está", "Aumentar o tamanho da janela de backup noturno para que ele termine antes do início do expediente", "Trocar o balanceador de carga da aplicação por um modelo mais novo e com mais portas"],
 "O sintoma (latência alta de disco, CPU e memória normais) aponta para contenção de armazenamento: muitas VMs disputando os mesmos discos. Isolar o banco e usar mídia mais rápida ataca a causa.","sto"],
["arq",4,"Uma empresa vai renovar o datacenter. Ela tem 200 VMs, picos previsíveis no fim do mês e crescimento de 20% ao ano. Qual abordagem de dimensionamento é mais adequada?",
 ["Dimensionar para o pico previsto mais o crescimento, com reserva N+1", "Dimensionar para a média atual e comprar mais quando faltar", "Dimensionar apenas para o cenário de falha, ignorando por completo o pico previsto do fim do mês", "Comprar o maior equipamento disponível, sem analisar os dados"],
