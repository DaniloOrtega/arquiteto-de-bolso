 "Contas esquecidas são um alvo comum. O processo de desligamento deve incluir todos os acessos, e revisões periódicas pegam o que escapou.","iam"],
["seg",2,"Qual método de autenticação multifator resiste melhor a ataques de phishing?",
 ["Chave de segurança física (FIDO2) ou passkey", "Código de seis dígitos recebido por SMS e digitado no site de login", "Pergunta de segurança, como o nome do primeiro animal de estimação", "Senha longa trocada todo mês, combinada com perguntas de segurança"],
 "Chaves FIDO2 e passkeys verificam o site de origem, então um site falso não consegue reutilizar a autenticação. Códigos por SMS ou aplicativo podem ser digitados em páginas falsas e repassados ao atacante.","iam"],
["seg",2,"Um desenvolvedor precisa apenas ler arquivos de um bucket de armazenamento. Qual permissão segue o princípio do menor privilégio?",
 ["Permissão de leitura limitada àquele bucket", "Permissão de administrador na conta inteira", "Permissão de leitura e escrita em todos os buckets da conta", "Permissão de exclusão no bucket, caso precise limpar arquivos"],
 "O menor privilégio concede apenas o que a tarefa exige, no escopo mais restrito possível. Permissões amplas aumentam o dano de um erro ou de um vazamento de credenciais.","iam"],
["seg",2,"Uma auditoria encontra uma regra de firewall que libera SSH (porta 22) para 0.0.0.0/0 em servidores de produção. Qual a melhor correção?",
 ["Restringir o acesso a IPs conhecidos ou usar um bastion ou acesso gerenciado, sem exposição pública", "Trocar a porta do SSH para 2222, mantendo a regra aberta para qualquer origem na internet", "Manter a regra aberta e instalar um antivírus e um agente de detecção em todos os servidores", "Remover a senha do usuário root e manter o acesso por chave, com a porta aberta ao mundo"],
 "Abrir SSH para a internet expõe o servidor a tentativas de acesso constantes. O ideal é limitar a origem ou usar um acesso intermediado (bastion, SSM, Bastion gerenciado). Mudar a porta é apenas obscuridade.","red"],
["seg",2,"Qual a diferença entre ameaça, vulnerabilidade e risco?",
 ["Ameaça é o que pode causar dano; vulnerabilidade é a fraqueza; risco é a chance de dano com seu impacto", "Ameaça é a fraqueza do sistema; vulnerabilidade é o atacante; risco é a correção que a equipe aplica depois", "São três nomes para o mesmo conceito, que variam conforme a norma de segurança adotada pela empresa", "Risco é o que causa o dano, e ameaça é a probabilidade de que esse dano chegue a acontecer"],
 "A ameaça (um atacante, um malware) explora uma vulnerabilidade (uma falha). O risco combina a probabilidade dessa exploração com o impacto no negócio.","gov"],
["seg",2,"Qual serviço registra quem executou cada ação na conta de nuvem, como a criação ou exclusão de recursos?",
 ["Registro de auditoria da conta (como CloudTrail, Activity Log ou Audit Logs), com o autor e o horário de cada ação", "Cofre de segredos (como Secrets Manager), que guarda e rotaciona as credenciais usadas pelos serviços", "Balanceador de carga de aplicação, que registra cada requisição recebida pelos serviços", "Serviço de monitoramento de desempenho, que mede o uso de CPU e memória das instâncias"],
 "Os logs de auditoria guardam o histórico de chamadas à API da conta, com quem fez o quê, quando e de onde. Eles são a base para investigar incidentes e comprovar conformidade.","inc"],
["seg",2,"Por que usar login único (SSO) com um provedor de identidade central é melhor que contas locais em cada sistema?",
 ["Centraliza a entrada e a saída de pessoas e aplica MFA e políticas em um só lugar", "Elimina a necessidade de senha em qualquer sistema, pois o provedor assume toda a autenticação", "Dispensa o registro de auditoria dos acessos, porque o provedor de identidade guarda tudo sozinho", "Permite que todos usem a mesma senha de administrador em todos os sistemas conectados"],
 "Com SSO, desligar uma pessoa no provedor revoga os acessos de uma vez, e as regras de MFA e de sessão são únicas. Contas locais espalham credenciais e dificultam o controle.","iam"],
["seg",2,"Qual a diferença principal entre um firewall de rede e um WAF (firewall de aplicação web)?",
 ["O de rede filtra por IP e porta; o WAF analisa requisições HTTP e bloqueia ataques como injeção de SQL", "O de rede analisa o conteúdo HTTP das requisições; o WAF filtra apenas endereços IP e portas de origem", "O WAF só funciona em redes internas da empresa, e o firewall de rede só protege tráfego vindo da internet", "Não há diferença prática, e o WAF é apenas o nome comercial de um firewall de rede comum"],
 "O firewall de rede decide por endereço e porta (camadas 3 e 4). O WAF entende HTTP (camada 7) e inspeciona URLs, cabeçalhos e corpo para detectar padrões de ataque a aplicações.","red"],
["seg",2,"Dados sensíveis estão guardados em um banco gerenciado. Qual medida atende melhor à criptografia em repouso?",
 ["Habilitar a criptografia do armazenamento com chaves em um serviço de gerenciamento (KMS)", "Esconder o endereço do banco, sem divulgá-lo para a equipe, e liberar o acesso só por IP", "Usar apenas HTTPS entre a aplicação e o banco, com certificados válidos e renovados", "Trocar a senha do banco todo ano e restringir quem conhece a nova senha na equipe"],
 "A criptografia em repouso protege os dados gravados no disco e nos backups, com chaves controladas no KMS. HTTPS protege os dados em trânsito, e esconder o endereço não é controle de segurança.","cri"],
["seg",3,"Qual a vantagem da criptografia por envelope (envelope encryption) no gerenciamento de chaves?",
 ["Uma chave de dados protege os dados e é cifrada por uma chave mestra, que raramente sai do serviço", "Uma única chave mestra cifra diretamente cada arquivo de grande volume, sem chaves intermediárias", "A chave de dados é publicada junto com o arquivo cifrado, para facilitar a leitura por quem tem acesso", "Dispensa o uso de um serviço de gerenciamento de chaves, pois as chaves ficam no próprio arquivo"],
 "Chaves de dados cifram o conteúdo de forma rápida, e a chave mestra (guardada no KMS ou HSM) cifra as chaves de dados. Trocar a mestra não exige recifrar todos os dados, apenas as chaves.","cri"],
["seg",3,"O time de segurança recebe milhares de alertas por dia, e a maioria é falso positivo. Qual medida melhora a detecção sem ignorar ameaças reais?",
 ["Ajustar regras e priorizar alertas por criticidade, automatizando os casos comuns", "Desativar os alertas mais frequentes, sem análise, até que o volume diário diminua", "Aumentar a quantidade de analistas de plantão sem mudar nenhuma regra de detecção existente", "Receber os alertas apenas por e-mail, em um resumo enviado uma vez por semana"],
 "O excesso de ruído esconde incidentes reais. Ajustar regras, correlacionar eventos e automatizar a triagem dos casos conhecidos (SOAR) reduz a fadiga de alertas. Desligar alertas às cegas cria pontos cegos.","inc"],
["seg",3,"Uma pipeline de CI/CD precisa acessar a nuvem para publicar uma aplicação. Qual abordagem é mais segura para a credencial?",
 ["Identidade federada da pipeline, com credenciais temporárias e permissões mínimas", "Uma chave de acesso permanente de administrador, guardada como variável de texto na própria pipeline", "A senha do usuário root salva no repositório de código, protegida por permissões de leitura restritas", "Uma chave compartilhada por todas as pipelines da empresa, trocada somente quando alguém sair da equipe"],
 "Credenciais temporárias obtidas por federação (OIDC) expiram sozinhas e podem ser restritas à pipeline. Chaves permanentes vazam com facilidade e dão acesso amplo se forem comprometidas.","iam"],
["seg",3,"Um site recebe um ataque de negação de serviço volumétrico. Qual combinação de defesa é mais adequada?",
 ["CDN e proteção anti-DDoS na borda, com limites de requisições e escala automática", "Aumentar o tamanho do servidor de aplicação até que ele suporte o volume do ataque", "Desligar o site por completo até que o ataque acabe e os provedores liberem o tráfego", "Bloquear manualmente cada IP atacante no firewall do servidor de aplicação, conforme eles aparecem"],
 "Ataques volumétricos precisam ser absorvidos antes de chegar à origem, em redes de grande capacidade (CDN e anti-DDoS). Bloqueios manuais não acompanham milhares de origens, e servidores maiores são esgotados.","red"],
["seg",3,"A empresa classificou seus dados em público, interno e confidencial. Qual a principal utilidade dessa classificação?",
 ["Definir controles proporcionais, como criptografia, acesso e retenção, para cada nível", "Reduzir o espaço de armazenamento usado pelos dados, descartando os menos importantes", "Substituir a necessidade de controle de acesso, já que o nível do dado define quem lê", "Criar um backup separado, em local diferente, para cada nível de classificação dos dados"],
 "A classificação orienta quais proteções aplicar a cada tipo de dado, evitando custo excessivo em dados públicos e proteção insuficiente em dados críticos. Ela não elimina outros controles.","gov"],
["seg",3,"O princípio de confiança zero (zero trust) é adotado em uma empresa. Qual prática é coerente com ele?",
 ["Verificar identidade, dispositivo e contexto a cada acesso, mesmo dentro da rede corporativa e a cada recurso", "Confiar em qualquer dispositivo que esteja conectado à rede do escritório, sem outras verificações", "Liberar acesso por VPN a todos os recursos da empresa depois do login, sem novas verificações por recurso", "Dispensar o MFA para usuários antigos da empresa, já que eles são conhecidos pela equipe de segurança"],
 "Zero trust parte do princípio de que a rede interna não é confiável. Cada acesso é verificado e limitado ao mínimo, com base em identidade, estado do dispositivo e contexto.","iam"],
["seg",3,"Uma aplicação web em nuvem permite que o usuário informe uma URL para a qual o servidor faz uma requisição. Um atacante usa isso para ler credenciais do serviço de metadados da instância. Qual proteção mitiga esse ataque?",
 ["Exigir a versão 2 do serviço de metadados (IMDSv2) e validar as URLs permitidas", "Aumentar o tamanho da instância que roda a aplicação, para suportar as requisições extras", "Trocar o nome da aplicação nos registros de DNS, para que o atacante não a encontre", "Desativar o cache de resposta do servidor web, para que ele não guarde dados do metadado"],
 "É um ataque SSRF (falsificação de requisição no servidor). O IMDSv2 exige um token e dificulta o abuso, e a validação das URLs impede que o servidor acesse destinos internos.","red"],
["seg",3,"Uma empresa guarda arquivos sensíveis em um bucket e precisa garantir que ninguém, nem administradores, consiga apagar ou alterar versões por 7 anos, por exigência regulatória. Qual recurso atende?",
 ["Bloqueio de objetos (object lock) em modo de conformidade, com retenção de 7 anos para todos os objetos", "Versionamento do bucket, sem bloqueio de objetos, mantendo as versões antigas por sete anos", "Uma política de ciclo de vida que move os arquivos antigos para uma camada de armazenamento mais barata", "Criptografia com chave gerenciada pelo cliente, sem política de retenção nem bloqueio"],
 "O object lock em modo de conformidade (WORM) impede alterações e exclusões durante o período, até para o administrador. O versionamento permite recuperar versões, mas elas ainda podem ser apagadas.","cri"],
["seg",4,"Uma chave de acesso de nuvem vazou em um repositório público há 20 minutos. Qual a ordem mais adequada de ações?",
 ["Desativar a chave, checar o uso nos logs, revogar sessões e emitir credenciais temporárias", "Apagar o repositório e esperar que ninguém tenha visto a chave durante os vinte minutos em que ela esteve pública", "Avisar a equipe por e-mail e aguardar a próxima reunião de segurança, que acontece todas as quintas-feiras", "Trocar o nome do usuário e manter a chave ativa para não quebrar os sistemas que dependem dela"],
 "Contenção primeiro: invalidar a chave. Depois, verificar nos logs se foi usada, remover recursos criados indevidamente e adotar um modelo sem chaves permanentes. Apagar o repositório não elimina cópias.","inc"],
["seg",4,"Para reduzir o impacto de ransomware, qual estratégia de backup é mais eficaz?",
 ["Cópias imutáveis, em conta isolada, com testes periódicos de restauração", "Backups na mesma conta, com permissão de exclusão para todos os administradores", "Um único backup semanal gravado no mesmo disco e no mesmo ambiente da produção", "Replicação em tempo real, que também copia os arquivos cifrados"],
 "O ransomware tenta apagar ou cifrar os backups. Cópias imutáveis (WORM) em outra conta, com credenciais separadas e restauração testada, garantem a recuperação. A replicação contínua propaga os arquivos cifrados.","inc"],
["seg",4,"Administradores têm acesso permanente de alto privilégio a produção, e a auditoria quer reduzir o risco. Qual prática é mais adequada?",
 ["Acesso just-in-time com aprovação, tempo limitado e registro das sessões, em vez de privilégio permanente", "Conceder um administrador adicional para cada sistema, com acesso permanente e revisão anual", "Compartilhar uma única conta de administrador entre toda a equipe, com a senha guardada em um cofre", "Manter o acesso permanente e aumentar a frequência de trocas de senha dos administradores"],
 "O acesso just-in-time concede privilégios apenas quando necessários e por tempo limitado, com aprovação e gravação das atividades. Isso reduz a janela de exposição e facilita auditar.","iam"],
["seg",4,"Um sistema trata dados pessoais de clientes e precisa atender à LGPD. Qual conjunto de práticas é coerente?",
 ["Mapear os dados, definir a base legal, limitar acessos e atender pedidos dos titulares", "Guardar todos os dados para sempre, caso sejam úteis em alguma análise futura da empresa e do mercado", "Compartilhar os dados com qualquer parceiro, desde que haja senha para acessar o arquivo enviado a ele", "Cifrar apenas o banco de dados e ignorar os demais usos, como relatórios, cópias e planilhas"],
 "A LGPD exige conhecer quais dados existem, ter base legal, coletar o mínimo, proteger, registrar o tratamento e responder a direitos como acesso e exclusão. Segurança técnica é parte, mas não o todo.","gov"],
["seg",4,"Uma equipe usa uma biblioteca de código aberto popular, e uma vulnerabilidade grave é divulgada. O que reduz o risco da cadeia de suprimentos de software?",
 ["Inventário de dependências (SBOM), varredura automática e atualização rápida", "Congelar as versões das bibliotecas e nunca atualizar, para evitar que algo quebre em produção", "Remover o código-fonte do repositório depois de publicar, para que ninguém inspecione o projeto", "Confiar que o autor da biblioteca corrigirá antes de qualquer ataque"],
 "Sem inventário não se sabe onde a biblioteca está. SBOM e varreduras contínuas localizam e priorizam correções, e a atualização rápida reduz a janela de exposição.","gov"],
["seg",4,"Em um projeto novo, a equipe quer identificar ameaças ainda no desenho da arquitetura. Qual técnica é a mais adequada?",
 ["Modelagem de ameaças (como STRIDE), analisando fluxos de dados e fronteiras de confiança", "Teste de desempenho com carga máxima, para saber quantos usuários o sistema suporta", "Revisão do código-fonte em busca de erros de ortografia e de padrões de formatação", "Auditoria financeira dos fornecedores, para identificar contratos com risco de inadimplência"],
 "A modelagem de ameaças examina como os dados fluem, onde há fronteiras de confiança e quais ataques (falsificação, adulteração, repúdio e outros) são possíveis, permitindo prever controles antes da implementação.","gov"],
["seg",4,"Um alerta indica que uma instância em produção está se comunicando com um servidor de comando e controle conhecido. Qual é a melhor sequência de resposta?",
 ["Isolar a instância, preservar as evidências (disco e memória), investigar a origem e só depois erradicar e restaurar", "Desligar e apagar a instância imediatamente, sem guardar disco nem memória, e recriá-la", "Ignorar o alerta se a aplicação continuar funcionando normalmente, e monitorar por mais um dia", "Reiniciar a instância e esperar que o problema desapareça, mantendo a rede como está"],
 "Primeiro conter, isolando a máquina da rede, sem perder evidências. Depois entender como o invasor entrou, erradicar a causa e restaurar de uma fonte limpa. Apagar tudo destrói provas e impede a análise.","inc"],
["seg",4,"Uma empresa quer reduzir o impacto de uma conta de nuvem comprometida e separar a administração de segurança da de infraestrutura. Qual arquitetura de contas é mais adequada?",
 ["Várias contas (produção, desenvolvimento, segurança e logs), com políticas centrais e registros em uma conta isolada", "Uma conta única, com as permissões separadas pelos nomes dos recursos e por etiquetas", "Contas individuais criadas por cada desenvolvedor, sem políticas centrais nem registros unificados", "Uma conta única, com todos os usuários como administradores e revisão trimestral"],
 "Contas separadas formam limites fortes de impacto. Logs e ferramentas de segurança em contas isoladas impedem que um invasor apague as evidências, e as políticas centrais evitam desvios.","gov"],
["ha",1,"Uma empresa aceita ficar no máximo 4 horas fora do ar depois de um desastre. Qual meta descreve esse limite?",
 ["Tempo máximo para voltar ao ar (RTO)", "Quantidade máxima de dados que pode se perder (RPO)", "Tempo médio entre duas falhas do sistema (MTBF)", "Operações de disco por segundo no armazenamento (IOPS)"],
 "RTO (Recovery Time Objective) é o tempo para restaurar o serviço. RPO (Recovery Point Objective) é quanto de dados, medido em tempo, se aceita perder.","met"],
["ha",1,"Um backup completo roda todo dia às 2h. No pior caso, quanto de dados a empresa pode perder?",
 ["Quase 24 horas, se a falha vier logo antes do próximo backup", "No máximo 2 horas, que é o intervalo desde o último horário do backup", "Nenhum dado, porque o backup noturno garante a recuperação total e imediata", "Só os dados do último minuto antes da falha"],
 "Tudo o que foi gravado depois do último backup se perde. Esse limite é o RPO. Para perder menos, é preciso backups mais frequentes ou replicação contínua.","met"],
["ha",1,"O que é um ponto único de falha (SPOF)?",
 ["Um componente sem reserva cuja falha derruba o sistema todo", "O primeiro servidor que recebe o tráfego dos usuários", "Um backup antigo que não pode mais ser restaurado", "A região principal escolhida em um provedor de nuvem"],
 "Uma única VM, um único banco ou um único link de rede são pontos únicos de falha. A solução é ter redundância (um segundo componente).","red"],
["ha",1,"Qual é o tempo aproximado de indisponibilidade permitido por ano em um SLA de 99,9%?",
 ["Cerca de 8 h 45 min", "Cerca de 52 min", "Cerca de 3,6 dias, ou 87 horas de parada por ano", "Cerca de 5 min"],
 "99,9% permite cerca de 8,76 horas por ano. 99,99% permite cerca de 52 minutos e 99% cerca de 3,65 dias. Cada 9 a mais divide o tempo tolerado por 10.","met"],
["ha",1,"Em nuvem pública, o que é uma zona de disponibilidade (AZ)?",
 ["Datacenters isolados, com energia e rede próprias, dentro de uma região", "Uma região inteira do provedor, instalada em outro país", "Um conjunto de racks dentro de uma mesma sala do mesmo datacenter, com um só circuito", "Um tipo de máquina virtual de alto desempenho, criada para bancos de dados grandes"],
 "Cada região tem zonas isoladas entre si, ligadas por rede rápida. Distribuir o sistema em duas ou mais zonas protege contra a falha de um datacenter. Na OCI o equivalente são os Availability Domains e os Fault Domains.","red"],
["ha",1,"Um banco tem uma réplica síncrona. Alguém executa um DELETE sem WHERE, apagando uma tabela inteira. Por que a réplica não salva os dados?",
 ["A exclusão também é copiada, e só o backup recupera os dados", "Réplicas copiam os dados apenas uma vez por dia", "Réplicas não guardam dados, só repassam as consultas", "O comando DELETE não pode ser copiado para réplicas"],
 "Replicação protege contra falha de equipamento, e não contra erro humano: o comando errado é copiado junto. Backup e restauração a um momento exato (PITR) cobrem esse caso.","dr"],
["ha",1,"Qual é o papel de um balanceador de carga em uma arquitetura de alta disponibilidade?",
 ["Distribuir os acessos entre servidores saudáveis e retirar os que falham", "Guardar cópias dos dados em outra zona de disponibilidade, a cada hora", "Criptografar os dados guardados no banco de dados", "Aumentar sozinho o tamanho das máquinas virtuais"],
 "O balanceador só envia usuários aos servidores que respondem bem. Se um cai, o tráfego segue para os outros sem intervenção humana.","red"],
["ha",1,"Uma loja online roda site, banco e arquivos em uma única VM, numa única zona. Qual melhoria reduz mais risco com menos esforço?",
 ["Banco gerenciado e 2 servidores em zonas diferentes", "Trocar a VM por uma maior, com mais CPU e memória", "Trocar o disco por um mais rápido, com mais desempenho", "Fazer um backup manual da VM todas as semanas"],
 "Uma VM maior continua sendo um ponto único de falha. O ganho vem da redundância: dois servidores em zonas diferentes e um banco gerenciado com troca automática (failover). Backups seguem necessários.","red"],
["ha",2,"Qual é aproximadamente a indisponibilidade máxima por ano de um serviço com 99,99% de disponibilidade?",
 ["Cerca de 52 minutos", "Cerca de 8 horas e 45 minutos", "Cerca de 5 minutos", "Cerca de 3 dias e meio"],
 "99,99% deixa 0,01% do ano fora do ar: 0,0001 × 525 600 minutos ≈ 52 minutos. 99,9% equivale a cerca de 8h45, e 99% a cerca de 3,6 dias.","met"],
["ha",2,"Um sistema precisa voltar ao ar em até 30 minutos após uma falha e aceita perder no máximo 5 minutos de dados. Quais são os valores de RTO e RPO?",
 ["RTO de 30 minutos e RPO de 5 minutos", "RTO de 5 minutos e RPO de 30 minutos", "RTO de 35 minutos e RPO de 35 minutos, com backups a cada meia hora", "RTO de 30 minutos e RPO de zero"],
 "RTO (objetivo de tempo de recuperação) é o tempo para voltar a operar. RPO (objetivo de ponto de recuperação) é a quantidade máxima de dados que se aceita perder, medida em tempo.","met"],
["ha",2,"Um balanceador de carga envia tráfego a um servidor que travou, e os usuários recebem erros. Qual recurso evita isso?",
 ["Verificações de saúde (health checks) que retiram automaticamente os servidores com falha do balanceamento", "Aumentar o tempo de vida (TTL) do DNS do site, para que os clientes guardem o endereço por mais tempo", "Adicionar uma regra de firewall liberando a porta do servidor para o endereço do balanceador", "Trocar o protocolo entre balanceador e servidor de HTTP para HTTPS, com certificado renovado"],
 "O balanceador testa periodicamente cada servidor e deixa de enviar tráfego aos que não respondem, voltando a enviar quando se recuperam. Sem isso, parte das requisições vai para um destino morto.","red"],
["ha",2,"Um banco gerenciado está configurado com a opção Multi-AZ. O que isso garante?",
 ["Uma réplica em outra zona, com troca automática se a principal falhar", "Cópias de leitura em outra região, para distribuir as consultas entre vários servidores diferentes", "Backup automático a cada hora, guardado em outra zona, com restauração manual pelo cliente", "Capacidade de escrita dobrada, com dois servidores ativos"],
 "Multi-AZ mantém um standby em outra zona com replicação síncrona e promove automaticamente em caso de falha. Serve para alta disponibilidade, e não para aumentar a capacidade de consultas.","red"],
["ha",2,"Qual vantagem uma camada web sem estado (stateless) traz para a alta disponibilidade?",
 ["Qualquer servidor atende qualquer requisição, e um que falhe é substituído sem perda de sessão", "Os servidores nunca precisam de atualização de software, pois o estado dos usuários não depende deles", "Os dados dos usuários ficam sempre guardados nos servidores web, o que dispensa um banco de dados externo", "O balanceador deixa de ser necessário, pois cada usuário passa a usar sempre o seu próprio servidor"],
 "Se as sessões ficam em um repositório compartilhado (cache ou banco), os servidores web são intercambiáveis. A falha de um não derruba a sessão do usuário, e novos servidores entram sem preparação.","red"],
["ha",2,"Uma empresa faz backup todas as noites, mas nunca restaurou um. Qual o risco principal?",
 ["Descobrir só na hora do desastre que a restauração não funciona ou demora mais do que o negócio aceita", "Os backups ocuparem mais espaço do que os dados originais e elevarem o custo de armazenamento", "O backup noturno atrapalhar o desempenho da aplicação durante o expediente do dia seguinte", "A impossibilidade de apagar dados antigos dos backups, que ficam retidos para sempre"],
 "Um backup não testado é uma suposição. Testar a restauração valida os dados, o procedimento e o tempo real, que muitas vezes supera o RTO esperado.","dr"],
["ha",2,"Qual das opções descreve uma estratégia de recuperação com ambiente reduzido sempre ligado na região de reserva?",
 ["Warm standby (espera morna)", "Backup e restauração", "Cold site (espera fria)", "Ativo-ativo em duas regiões com carga total"],
 "No warm standby há uma versão reduzida do ambiente em execução, e ela é ampliada quando necessário. Isso encurta o RTO em relação ao backup e restauração, com custo menor que o ativo-ativo.","dr"],
["ha",2,"Uma aplicação tem uma fila e funcionários que processam as mensagens. Se o processamento falhar, as mensagens são perdidas. O que torna a arquitetura mais resiliente?",
 ["Fila durável com reentrega e fila de mensagens mortas (DLQ) para as que falham sempre", "Mais funcionários processando as mensagens ao mesmo tempo, sem alterar o comportamento da fila", "Reduzir o tempo de vida das mensagens para poucos segundos, descartando as que não forem processadas", "Gravar as mensagens apenas na memória do servidor, para que o processamento seja mais rápido"],
 "Uma fila durável reenvia mensagens não confirmadas, e a DLQ separa as que falham repetidamente para análise. Assim não há perda silenciosa nem bloqueio da fila por uma mensagem problemática.","res"],
["ha",3,"Uma empresa compara quatro estratégias de DR: backup e restauração, pilot light, warm standby e ativo-ativo. Em qual ordem, do menor para o maior custo (e do maior para o menor RTO), elas aparecem?",
 ["Backup e restauração, pilot light, warm standby, ativo-ativo", "Ativo-ativo, warm standby, pilot light, backup e restauração", "Pilot light, backup e restauração, ativo-ativo, warm standby", "Warm standby, ativo-ativo, backup e restauração, pilot light"],
 "Quanto mais recursos ficam prontos na região de reserva, menor o RTO e maior o custo. O backup e restauração é a mais barata e lenta, e o ativo-ativo é a mais cara e rápida.","dr"],
["ha",3,"O banco de dados replica de forma assíncrona para a região de reserva, com atraso médio de 2 minutos. Qual o RPO realista dessa estratégia?",
 ["Em torno de alguns minutos, correspondendo ao atraso médio da replicação entre a região principal e a de reserva", "Zero, pois a replicação garante que nenhuma escrita se perde, mesmo em uma falha súbita", "Igual ao RTO, pois ambos medem o mesmo tempo de indisponibilidade percebido pelos clientes durante a falha", "Um dia inteiro, pois a perda depende do backup noturno e não da replicação assíncrona para a região de reserva"],
 "Na replicação assíncrona, as últimas escritas ainda não replicadas se perdem em uma falha, e o RPO é aproximadamente o atraso. Só a replicação síncrona oferece RPO próximo de zero, ao custo de latência.","con"],
["ha",3,"A troca de região por DNS demora mais que o esperado na simulação de desastre. Qual a causa mais provável?",
 ["O TTL alto dos registros, que faz resolvedores e clientes guardarem o endereço antigo", "Falta de memória nos servidores da região de reserva, que demoram a atender as primeiras requisições", "Excesso de certificados digitais instalados nos servidores da região principal e da região de reserva", "Uso de IPv4 em vez de IPv6 nos servidores, que atrasa a resolução dos nomes durante a troca de região"],
 "Enquanto o TTL não expira, resolvedores continuam apontando para a região antiga. Para failover por DNS, usa-se TTL baixo e verificações de saúde que mudam o registro automaticamente.","dr"],
["ha",3,"Um serviço começa a falhar, e os clientes repetem as chamadas sem pausa, o que agrava a sobrecarga e derruba outros serviços. Como se chama o padrão que impede isso?",
 ["Circuit breaker (disjuntor), que interrompe as chamadas a um serviço que está falhando e deixa que ele se recupere", "Sticky session, que prende cada usuário sempre ao mesmo servidor durante a sessão inteira", "Blue/green, que alterna dois ambientes completos a cada nova versão publicada pela equipe", "Cache-aside, que guarda as respostas mais frequentes para reduzir o número de consultas"],
 "O disjuntor para de chamar um serviço doente por um tempo, evitando o efeito cascata, e testa a recuperação aos poucos. Em conjunto com backoff e limites, impede tempestades de repetição.","res"],
["ha",3,"Uma aplicação perde o serviço de recomendações, mas continua exibindo o catálogo e permitindo compras. Qual princípio de resiliência isso demonstra?",
 ["Degradação graciosa: manter as funções essenciais quando parte do sistema falha", "Dimensionamento vertical dos servidores principais, com mais CPU e memória em cada um deles", "Replicação síncrona entre as regiões, para que nenhuma recomendação seja perdida na falha", "Aumento do tempo de vida do cache do navegador, para que a página continue disponível"],
 "Na degradação graciosa, falhas em componentes não críticos retiram funcionalidades secundárias sem derrubar o fluxo principal. É um desenho deliberado, que exige separar o que é essencial.","res"],
["ha",3,"Uma equipe quer testar a resiliência do sistema em produção, desligando instâncias aleatoriamente em horário controlado. Como se chama essa prática?",
 ["Engenharia do caos (chaos engineering)", "Teste de aceitação do usuário (UAT)", "Revisão de arquitetura anual, feita por uma equipe externa sobre os diagramas atuais", "Teste de penetração, feito por especialistas em segurança contra o ambiente de produção"],
 "A engenharia do caos injeta falhas de forma controlada para verificar se o sistema se recupera como esperado e descobrir fraquezas antes que o problema real aconteça.","res"],
["ha",3,"Um e-commerce usa uma região, três zonas e banco Multi-AZ. Uma falha afeta toda a região por 4 horas, e o negócio exige no máximo 30 minutos de parada. O que faltou?",
 ["Uma estratégia de DR em outra região, com dados replicados continuamente e um plano testado", "Mais uma zona de disponibilidade na mesma região, com o banco replicado entre as quatro zonas", "Um servidor maior em cada zona da região, com mais memória e discos mais rápidos", "Um balanceador adicional na mesma região, para distribuir melhor as requisições entre as zonas"],
 "Várias zonas protegem de falha de um datacenter, mas não de uma região inteira. Para RTO de 30 minutos é preciso ambiente preparado em outra região, replicação de dados e failover testado.","dr"],
["ha",3,"Uma aplicação em uma zona só usa uma VM com banco de dados local. A empresa quer RTO de 10 minutos e RPO próximo de zero com o menor ajuste possível. Qual mudança é a mais adequada?",
 ["Migrar o banco para um serviço gerenciado Multi-AZ e colocar a aplicação em duas zonas atrás de um balanceador", "Aumentar a frequência do snapshot do disco para a cada 5 minutos, mantendo tudo em uma zona", "Trocar a VM por outra maior, com mais memória e CPU, e manter o banco local no mesmo disco", "Copiar o banco para outra região toda noite e restaurá-lo manualmente se houver falha"],
 "Multi-AZ síncrono dá RPO próximo de zero e failover automático em minutos. Snapshots não atingem esse RPO nem esse RTO, e VMs maiores mantêm o ponto único de falha.","red"],
["ha",4,"Em uma arquitetura ativo-ativo em duas regiões, o mesmo cliente escreve nas duas ao mesmo tempo, e surgem dados conflitantes. Qual abordagem trata o problema?",
 ["Definir regras de resolução de conflitos ou particionar a propriedade dos dados por região", "Remover a replicação entre as regiões, deixando cada uma com uma cópia independente", "Aumentar o tamanho dos discos nas duas regiões, para comportar as versões conflitantes", "Gravar os dados em fita todas as noites e reconciliar os conflitos na manhã seguinte"],
 "No ativo-ativo, escritas concorrentes exigem uma regra (última escrita, tipos de dados sem conflito) ou a divisão dos dados por dono, de modo que cada registro só seja escrito em uma região.","con"],
["ha",4,"Durante um desastre regional, a equipe descobre que o plano de recuperação depende de um console e de uma API da região afetada. Qual lição de projeto isso traz?",
 ["Evitar dependências do plano de controle da região em falha, preparando recursos antecipadamente", "Ter menos recursos preparados em outra região, para simplificar o processo de recuperação", "Aumentar o número de regiões envolvidas no plano, sem testar a troca entre elas", "Documentar o plano apenas em papel, sem automação, para que não dependa de nenhum console"],
 "Planos de DR que dependem de criar recursos na região com problema podem falhar justamente quando mais precisam. Recursos pré-provisionados e automação independente reduzem esse risco.","dr"],
["ha",4,"Uma aplicação crítica em duas regiões precisa decidir qual banco é o principal quando a conexão entre elas cai, para evitar escritas duplicadas. Qual mecanismo ajuda?",
 ["Eleição de líder com quórum, com uma testemunha em um terceiro local", "Aumentar o TTL do DNS nas duas regiões, para que os clientes mantenham a mesma resposta por mais tempo", "Gravar localmente nas duas regiões e reconciliar tudo manualmente um mês depois da queda", "Desativar a replicação durante a queda da conexão e religá-la só quando houver decisão manual da equipe"],
 "Com duas regiões, nenhuma consegue saber se a outra falhou ou se apenas a rede caiu. Uma testemunha em um terceiro local forma a maioria e permite decidir quem continua, evitando o split-brain.","con"],
["ha",4,"O RTO de um sistema é de 15 minutos, mas a restauração do banco leva 2 horas nos testes. Qual mudança de arquitetura é mais adequada?",
 ["Manter uma réplica pronta e atualizada em outra região, em vez de depender da restauração do backup", "Aumentar a frequência dos backups para a cada hora, mantendo a restauração como único recurso", "Comprar discos mais rápidos e mais caros para o servidor principal, mantendo o mesmo processo", "Reduzir o número de testes de restauração, para evitar descobrir novos problemas no processo"],
 "Se restaurar leva mais que o RTO, só uma réplica já sincronizada, pronta para assumir, atende o requisito. Backups mais frequentes reduzem o RPO, mas não o tempo de restauração.","dr"],
["ha",4,"Após um failover para a região B, a aplicação fica lenta porque a região B tem 30% da capacidade da região A. O que o plano deveria ter previsto?",
 ["Capacidade suficiente ou escalonamento automático garantido na região de reserva", "Maior latência de rede entre as regiões A e B durante a replicação contínua dos dados", "Mais usuários cadastrados no sistema do que o previsto no dimensionamento inicial do projeto", "Um domínio DNS adicional para a região B, com o mesmo certificado e as mesmas regras"],
 "A região de reserva precisa suportar a carga real, ou ter escala automática e limites de cota liberados com antecedência. Muitos planos falham por subdimensionar o ambiente de recuperação.","dr"],
["ha",4,"Um serviço de pagamentos exige que nenhum pedido confirmado seja perdido, mesmo em caso de falha de zona, e tolera alguns segundos de latência extra. Qual estratégia de replicação é a mais coerente?",
 ["Replicação síncrona entre zonas, confirmando a escrita só depois de gravada em mais de uma delas e verificada", "Replicação assíncrona entre zonas, com confirmação imediata ao cliente antes da gravação no segundo local", "Backup diário copiado para outra região, restaurado quando ocorrer uma falha no ambiente principal", "Cache em memória como única fonte dos pedidos confirmados, com gravação no banco feita ao final do dia"],
 "Para perda zero, a escrita só é confirmada quando persistida em mais de um local. Zonas da mesma região têm baixa latência, o que torna a replicação síncrona viável e o custo de alguns milissegundos aceitável.","con"],
["ha",4,"Uma empresa tem 40 sistemas e precisa definir metas de recuperação sem gastar demais. Qual abordagem é mais adequada?",
 ["Classificar os sistemas por criticidade e atribuir RTO e RPO por nível, com a estratégia de DR correspondente", "Aplicar ativo-ativo em duas regiões para todos os 40 sistemas, independentemente da criticidade", "Aplicar apenas backup semanal para todos os sistemas, para economizar com recuperação", "Deixar cada equipe escolher livremente a estratégia de recuperação, sem critérios comuns"],
 "A criticidade para o negócio determina quanto vale investir. Sistemas críticos recebem estratégias caras e rápidas, e os demais, opções mais simples. Padronizar por níveis facilita decisão e governança.","met"],
["ha",4,"Uma empresa global quer que usuários da Europa e do Brasil tenham baixa latência e que cada região continue funcionando se a outra cair. Os dados dos clientes pertencem a um país. Qual desenho é mais coerente?",
 ["Multirregião com dados particionados por país, rotas para a região do cliente e failover definido", "Uma região única, com cache em cada continente e réplicas de leitura nos demais", "Uma região, com backup diário copiado para as outras duas e restauração manual", "Duas regiões escrevendo nas mesmas tabelas, sem regra de conflito, para simplificar o desenho"],
 "Particionar os dados por país mantém cada registro em um dono e atende residência e latência. Cada região atende seus clientes e, se for preciso, a outra assume com replicação planejada.","con"],
["db",1,"Qual cenário combina melhor com um banco relacional?",

["db",1,"O que a letra A de ACID garante?",
 ["Atomicidade: a transação acontece por inteiro ou não acontece", "Disponibilidade: o banco funciona 24 horas por dia", "Autenticação: só usuários válidos acessam os dados", "Arquivamento: dados antigos vão para camadas de armazenamento mais baratas"],
 "ACID significa atomicidade, consistência, isolamento e durabilidade. Atomicidade evita estados pela metade, como debitar uma conta sem creditar a outra.","tra"],
["db",1,"Um catálogo tem produtos cujos atributos variam muito de um item para outro. Que tipo de banco costuma ser natural?",
 ["De documentos (como o MongoDB)", "De série temporal, usado para métricas de sensores", "De grafo, usado para relações entre pessoas", "De data warehouse, usado para relatórios históricos"],
 "Bancos de documentos guardam cada item com sua própria estrutura (em formato JSON, por exemplo), sem precisar de colunas opcionais. Um relacional também pode funcionar, com mais esforço de modelagem.","mod"],
["db",1,"Para reduzir leituras repetidas e baixar o tempo de resposta de consultas frequentes, o que usar?",
 ["Um cache em memória, como Redis ou Memcached", "Um segundo banco idêntico gravando em paralelo", "Mais discos de armazenamento no servidor atual", "Backups mais frequentes do banco de dados"],
 "Um cache guarda as respostas mais usadas na memória e responde em frações de milissegundo, aliviando o banco. O cuidado é saber até quando esses dados continuam válidos.","rep"],
["db",1,"Qual é o principal uso de uma réplica de leitura?",
 ["Distribuir as consultas de leitura e aliviar o banco principal", "Dobrar a capacidade de escrita do banco principal, sem mudar mais nada", "Substituir o backup do banco de dados", "Criptografar os dados guardados no disco do servidor principal do banco de dados"],
 "Réplicas de leitura escalam consultas. As gravações continuam indo ao banco principal. Como a cópia costuma ser assíncrona, a réplica pode estar alguns segundos atrasada.","rep"],
["db",1,"Qual vantagem típica de um banco gerenciado pelo provedor, em comparação a instalar o banco em uma VM?",
 ["Backups, atualizações e troca automática feitos pelo provedor", "Acesso total ao sistema operacional do servidor", "Custo sempre menor que o de instalar em uma VM", "Dispensa qualquer monitoramento de desempenho"],
 "O provedor assume tarefas repetitivas de operação. Em troca, você perde parte do controle e ainda precisa acompanhar desempenho e custo.","mod"],
["db",1,"Qual é a diferença entre um banco transacional (OLTP) e um data warehouse?",
 ["OLTP atende o dia a dia; o warehouse, análises grandes", "Os dois termos são sinônimos para o mesmo tipo de banco", "O OLTP serve somente para guardar cópias de segurança", "O warehouse guarda apenas imagens e arquivos de vídeo"],
 "OLTP é o banco das aplicações (pedidos, cadastros). O data warehouse reúne dados históricos para relatórios e análises.","mod"],
["db",1,"Uma aplicação lenta repete as mesmas consultas de leitura milhares de vezes por minuto, e o banco chega a 90% de CPU. O que tentar primeiro?",
 ["Usar cache e revisar índices antes de aumentar o servidor", "Trocar de banco de dados imediatamente, sem analisar o que está lento", "Desligar o monitoramento para liberar CPU", "Apagar dados antigos sem fazer nenhuma análise"],
 "Primeiro medir. Índices ausentes e leituras repetidas são causas comuns, e cache e índices custam menos que escalar ou migrar.","rep"],
["db",2,"Uma consulta que filtra pela coluna email em uma tabela de 50 milhões de linhas está lenta. Qual a primeira medida mais indicada?",
 ["Criar um índice na coluna email, se ela for muito consultada", "Adicionar mais colunas à tabela para espalhar os dados entre elas e reduzir o tamanho de cada linha", "Trocar o banco por um servidor de arquivos, que lê os dados em formato de texto", "Aumentar o número de linhas por página de resultado, para reduzir as viagens ao banco"],
 "Sem índice, o banco lê a tabela inteira (varredura completa). Um índice na coluna filtrada permite localizar as linhas rapidamente, ao custo de um pouco mais de espaço e de tempo nas escritas.","per"],
["db",2,"Qual a diferença entre um índice clusterizado e um não clusterizado em bancos relacionais?",
 ["O clusterizado define a ordem física dos dados; o não clusterizado é uma estrutura separada que aponta para eles", "O clusterizado é uma cópia completa da tabela mantida em outro servidor; o não clusterizado fica guardado só em memória", "O clusterizado só existe em bancos NoSQL, e o não clusterizado existe apenas em bancos relacionais comuns", "Os dois funcionam do mesmo jeito, mudando apenas o nome conforme o fornecedor do banco de dados escolhido"],
 "Em geral, só pode haver um índice clusterizado por tabela, pois ele ordena os dados. Os não clusterizados guardam as chaves e ponteiros para as linhas, podendo existir vários.","per"],
["db",2,"Uma tabela de pedidos e outra de clientes se relacionam por uma chave. Qual o papel da chave estrangeira (foreign key)?",
 ["Garantir que cada pedido aponte para um cliente que existe", "Aumentar a velocidade de gravação dos pedidos, ao dispensar a verificação de cada linha", "Criptografar o identificador do cliente em cada pedido gravado na tabela", "Copiar os dados do cliente para dentro do pedido"],

["db",2,"Um banco recebe muitas leituras do site e poucas escritas, e o servidor principal está sobrecarregado. Qual solução reduz a carga sem mudar a aplicação por completo?",
 ["Réplicas de leitura, direcionando as consultas de leitura do site para elas e poupando o servidor principal", "Aumentar o tamanho dos backups noturnos, para que as leituras possam ser feitas sobre eles", "Desativar os índices para acelerar as escritas, aceitando que as consultas de leitura fiquem mais lentas", "Trocar o banco por arquivos de texto, que podem ser lidos em paralelo pelo site"],
 "Réplicas de leitura copiam os dados do principal e atendem consultas, aliviando o servidor de escrita. Elas têm um pequeno atraso na cópia, o que a aplicação precisa tolerar.","rep"],
["db",2,"Qual a diferença entre backup lógico e backup físico de um banco de dados?",
 ["O lógico exporta os dados e a estrutura em comandos ou formato próprio; o físico copia os arquivos do banco", "O lógico copia os discos inteiros do servidor, bloco a bloco; o físico exporta apenas as tabelas escolhidas", "O lógico só funciona em nuvem pública, e o físico só funciona em servidores locais", "Os dois são idênticos, e o nome depende apenas da ferramenta usada para executá-los"],
 "O backup lógico (como pg_dump ou mysqldump) é portável entre versões e permite restaurar partes, mas é lento em bases grandes. O físico é mais rápido, porém ligado à versão e à plataforma.","bkp"],
["db",2,"Uma aplicação precisa guardar sessões de usuário que expiram em 30 minutos, com acessos rapidíssimos. Qual tecnologia é mais indicada?",
 ["Armazenamento chave-valor em memória, com tempo de expiração (como Redis)", "Banco relacional com várias tabelas normalizadas e índices em todas as colunas de sessão", "Armazenamento de objetos, gravando cada sessão como um arquivo único com data de expiração", "Data warehouse com consultas analíticas, atualizado a cada vez que o usuário faz login"],
 "Sessões são acessadas por uma chave, exigem baixa latência e expiram sozinhas. Um repositório chave-valor em memória com TTL atende bem a esse padrão. Os outros são mais pesados para esse uso.","mod"],
["db",2,"O que significa normalizar um banco de dados relacional?",
 ["Organizar as tabelas para reduzir a repetição de dados e evitar inconsistências nas atualizações", "Aumentar o número de índices em todas as colunas, para acelerar qualquer consulta futura", "Copiar todas as tabelas para um servidor de reserva, mantendo uma segunda versão sincronizada", "Compactar os dados das tabelas para que ocupem menos disco e sejam lidos mais rápido"],
 "A normalização divide os dados em tabelas relacionadas, de modo que cada informação seja guardada em um só lugar. Isso evita anomalias de atualização, ao custo de mais junções (JOINs) nas consultas.","mod"],
["db",2,"Duas transações tentam alterar a mesma linha ao mesmo tempo, e a segunda fica esperando indefinidamente. O que isso indica?",
 ["Um bloqueio (lock) que não foi liberado, possivelmente um deadlock se houver dependência cruzada", "Um erro de DNS entre a aplicação e o banco, que impede o servidor de liberar a linha bloqueada", "Falta de espaço em disco no servidor, que impede a gravação do segundo comando no log", "Um índice duplicado na tabela, que força o banco a reavaliar a linha repetidamente"],
 "Transações bloqueiam as linhas que alteram. Se uma não termina, a outra espera. Em um deadlock, cada uma espera pela outra, e o banco precisa encerrar uma delas.","tra"],
["db",3,"Qual nível de isolamento de transações evita leituras sujas (dirty reads), mas ainda permite que uma leitura repetida veja valores diferentes?",
 ["Read Committed (leitura confirmada)", "Read Uncommitted (leitura não confirmada)", "Serializable (serializável), que isola totalmente as transações, como se fossem sequenciais", "Repeatable Read (leitura repetível)"],
 "No Read Committed uma transação só enxerga dados já confirmados, mas duas leituras seguidas podem ver resultados diferentes se outra transação confirmar no meio. O Serializable é o mais estrito.","tra"],
["db",3,"Uma tabela de eventos cresceu para bilhões de linhas, e as consultas por período ficaram lentas. Qual técnica ajuda mais?",
 ["Particionamento por data, para que a consulta leia só as partições do período", "Aumentar o tamanho da coluna de identificação da tabela, para que os registros novos caibam melhor", "Duplicar a tabela em outra com o mesmo nome, mantendo as duas sincronizadas por gatilhos de banco de dados", "Remover o índice da coluna de data, para que o banco leia a tabela de forma sequencial"],

["db",3,"Uma aplicação grava no banco principal e lê de uma réplica. Depois de salvar um dado, o usuário não o vê imediatamente. Qual a causa e a abordagem?",

["db",3,"Um banco NoSQL de documentos precisa de consultas por vários campos e de relações complexas entre entidades com junções frequentes. Qual avaliação é mais prudente?",
 ["Considerar um banco relacional, mais adequado a relações e consultas flexíveis", "Manter o banco de documentos e simular as junções na aplicação sem avaliar", "Trocar por um repositório chave-valor, que oferece consultas por vários campos sem junções", "Usar um data warehouse para o tráfego transacional, mantendo o banco de documentos para os logs"],
 "Bancos de documentos brilham com dados aninhados e acesso por chave. Para relações complexas e consultas variadas, o modelo relacional costuma ser mais simples e eficiente.","mod"],
["db",3,"Qual a função do pool de conexões em uma aplicação que acessa um banco de dados?",
 ["Reaproveitar conexões abertas, evitando custo de abertura e limitando o total simultâneo", "Criptografar o conteúdo das consultas enviadas pela aplicação, antes de chegarem ao banco", "Armazenar os resultados das consultas em memória, para devolver respostas repetidas sem consultar o banco", "Dividir a tabela em várias partes, para que cada conexão leia apenas uma delas"],
 "Abrir conexões é caro, e bancos têm limite de conexões. O pool mantém um conjunto reutilizável, reduz a latência e protege o banco de sobrecarga quando muitas requisições chegam juntas.","per"],
["db",3,"Para um relatório mensal que lê terabytes e faz agregações complexas, sem afetar o sistema de vendas, qual abordagem é mais adequada?",
 ["Mover os dados para um data warehouse colunar, atualizado por cargas periódicas e otimizado para agregações", "Executar a consulta diretamente no banco transacional em horário de pico, com prioridade alta de processamento", "Aumentar os índices do banco transacional em todas as colunas, para acelerar as agregações do relatório", "Copiar a tabela para uma planilha e fazer as agregações do relatório mensal manualmente fora do banco"],
 "Bancos colunares são otimizados para leituras analíticas e agregações. Separar a carga analítica da transacional evita que os relatórios prejudiquem o atendimento ao cliente.","mod"],
["db",3,"Um banco de produção tem 2 TB e precisa ser migrado com no máximo 15 minutos de parada. Qual abordagem é a mais realista?",
 ["Carga inicial seguida de replicação contínua (CDC) até a virada controlada", "Parar o sistema, exportar tudo e importar no destino, aceitando uma janela de algumas horas", "Copiar o backup semanal para o destino e aceitar a perda do que mudou depois dele", "Migrar os dados em lotes mensais, enviados por transferência de arquivos entre as equipes"],
 "Com a replicação contínua das alterações, o destino acompanha a origem enquanto o sistema funciona. A parada se limita ao momento da virada. Exportar e importar tudo levaria horas de parada.","bkp"],
["db",3,"O catálogo de um site recebe 5 mil leituras por segundo dos mesmos produtos, e o banco chega a 95% de CPU. O catálogo muda poucas vezes por dia. Qual combinação reduz mais a carga com menos risco?",
 ["Cache em memória com expiração para o catálogo, índices revisados e réplicas de leitura para o restante", "Aumentar a CPU e a memória do banco principal e manter a mesma arquitetura, sem cache nem réplicas adicionais", "Gravar o catálogo inteiro em cada sessão de usuário, para evitar consultas repetidas ao banco principal", "Desativar os índices do catálogo para reduzir o trabalho de escrita, mesmo com mil vezes mais leituras"],
 "Dados lidos muito e alterados pouco são ideais para cache: a maior parte das leituras nem chega ao banco. Índices e réplicas tratam o restante. Só aumentar a CPU adia o problema e custa mais.","rep"],
["db",4,"Uma loja global precisa de baixa latência de escrita em três regiões e aceita consistência eventual em alguns dados. Qual categoria de solução se encaixa?",
 ["Banco distribuído multirregional com replicação multimestre e regras de resolução de conflitos", "Um único banco relacional em uma região, com réplicas de leitura nas demais e escritas feitas sempre à distância", "Um arquivo compartilhado por rede entre as três regiões, acessado por todos os servidores de aplicação", "Backup diário copiado para cada região e restaurado conforme a demanda de cada local"],
 "Para escrever localmente em várias regiões, é preciso um banco com múltiplos nós de escrita e mecanismos para conflitos, aceitando consistência eventual. Um único principal impõe latência às regiões distantes.","tra"],
["db",4,"Uma equipe quer garantir que o saldo de uma conta nunca fique negativo mesmo com milhares de transferências simultâneas. Qual estratégia é a mais segura?",
 ["Transações com isolamento adequado e restrição de integridade verificada pelo próprio banco", "Verificar o saldo na tela do usuário antes de enviar a transferência ao servidor", "Confiar no cache da aplicação, que é atualizado a cada minuto com o saldo mais recente", "Gravar as transferências em arquivos e processá-las em lote durante a noite"],
 "A regra deve ser aplicada no banco, de forma atômica, com bloqueios ou controle de concorrência, e não só na aplicação. Caso contrário, duas transações simultâneas leem o mesmo saldo e ambas o debitam.","tra"],
["db",4,"Um serviço usa um banco chave-valor e, em horário de pico, algumas partições recebem muito mais acessos que outras, causando limitação (throttling). Como se chama o problema e qual a mitigação?",
 ["Partição quente (hot partition); redesenhar a chave para espalhar o acesso entre as partições", "Falha de DNS; a solução é reduzir o TTL dos registros que apontam para as partições", "Índice duplicado em cada partição; a solução é remover os índices da tabela", "Falta de backup das partições mais acessadas; a solução é aumentar a retenção"],
 "Quando muitas requisições caem na mesma chave ou partição, ela esgota sua capacidade, mesmo com o total do banco sobrando. Incluir um sufixo na chave ou usar chaves mais variadas distribui a carga.","per"],
["db",4,"Uma migração de Oracle para PostgreSQL precisa preservar a lógica em procedimentos armazenados (PL/SQL). Qual o ponto de maior risco?",
 ["A conversão de código procedural e de funções específicas, que exige reescrita e testes extensos", "A cópia dos dados das tabelas, que é sempre automática e sem risco, e portanto não exige validação alguma", "A mudança do nome do servidor, que exige uma nova licença do banco de dados e uma nova janela de manutenção", "A criação de usuários, que é incompatível entre os dois bancos e precisa ser refeita manualmente depois"],
 "Dados são relativamente simples de mover, mas o código procedural e os recursos proprietários (tipos, pacotes, sintaxe) costumam ser a parte mais trabalhosa. Ferramentas ajudam, mas a validação é essencial.","bkp"],
["db",4,"A empresa usa um banco relacional único para vários microsserviços, e alterações de esquema de um time quebram os outros. Qual direção arquitetural reduz o acoplamento?",
 ["Cada serviço com seu próprio banco, comunicando-se por APIs ou eventos em vez de compartilhar tabelas", "Adicionar mais tabelas ao banco compartilhado, separadas por prefixo para cada time", "Impedir qualquer mudança de esquema, congelando o modelo de dados para todos os times", "Duplicar o banco para cada desenvolvedor, sincronizando as alterações no fim do dia"],
 "Um banco por serviço dá autonomia e isola mudanças, ao custo de lidar com consistência entre serviços (eventos, sagas). O banco compartilhado cria um acoplamento difícil de gerenciar.","mod"],
["db",4,"O requisito é recuperar o banco para um momento exato, antes de uma exclusão acidental ocorrida 3 horas atrás. Qual recurso atende?",
 ["Recuperação pontual (PITR) com backup e logs de transação contínuos", "Réplica de leitura, que já reflete a exclusão e pode ser promovida a principal", "Snapshot noturno, que restaura o banco ao estado da última noite, perdendo o que veio depois", "Cache da aplicação, que guarda os dados mais recentes e pode ser usado para reconstruir a tabela"],
 "O PITR combina um backup completo com os logs de transação, permitindo restaurar a qualquer instante dentro da retenção, em uma nova instância. A réplica copia a exclusão, e o snapshot noturno não tem a precisão.","bkp"],
["db",4,"Uma plataforma precisa publicar eventos de negócio sempre que grava um pedido, sem risco de gravar no banco e não publicar (ou o contrário). Qual padrão resolve?",
 ["Transactional outbox: gravar o evento na mesma transação e publicá-lo a partir dele", "Gravar no banco e publicar o evento logo em seguida, sem nenhuma coordenação entre as duas operações", "Publicar primeiro o evento e gravar no banco apenas se a publicação funcionar", "Gravar em dois bancos independentes e comparar os dois depois para ajustar diferenças"],
 "Gravar o pedido e o evento na mesma transação garante atomicidade. Um processo separado lê a tabela de outbox e publica. Duas operações separadas podem falhar de forma parcial.","tra"],
["db",4,"Uma empresa precisa escolher o banco para um sistema financeiro regulado, com requisitos de auditoria, transações complexas, relatórios e crescimento moderado. Qual escolha é a mais coerente?",
 ["Relacional com transações ACID, auditoria e réplicas, com um data warehouse separado para análises", "Banco chave-valor sem esquema, priorizando velocidade de escrita e escala horizontal ilimitada", "Arquivos de texto em armazenamento de objetos, com versionamento e registros de acesso", "Banco de grafos como repositório principal, modelando contas e transferências como relacionamentos"],
 "Requisitos financeiros e regulatórios favorecem transações ACID, integridade e auditoria. Relatórios pesados vão para um repositório analítico separado. Os outros modelos não atendem bem a essas garantias.","tra"],
["cont",1,"O que é um contêiner?",
 ["Pacote leve com a aplicação e suas dependências, sem sistema operacional próprio", "Uma máquina virtual completa, com seu próprio sistema operacional, memória e disco dedicados", "Um tipo de disco de alta velocidade para bancos de dados", "Um servidor físico pequeno, instalado em um rack"],
 "Como o contêiner não carrega um sistema operacional inteiro, ele é pequeno e inicia em segundos.","doc"],
["cont",1,"Qual a diferença entre VM e contêiner?",
 ["A VM traz um sistema completo; o contêiner é mais leve", "Os dois são idênticos, só mudam de nome comercial conforme o fornecedor escolhido", "O contêiner é sempre mais pesado do que uma VM", "A VM só pode ser executada dentro da nuvem pública, nunca em servidor próprio"],
 "VMs isolam mais fortemente, enquanto contêineres permitem aproveitar melhor o servidor. Muitos ambientes usam os dois.","doc"],
["cont",1,"O que é uma imagem de contêiner?",
 ["O modelo, em arquivo, usado para criar contêineres iguais", "Uma foto da tela do servidor, usada como evidência", "Uma cópia do banco de dados da aplicação", "Um tipo de rede privada entre contêineres"],
 "A imagem contém o código e as dependências. Cada contêiner criado a partir dela é idêntico.","doc"],
["cont",1,"O que é o Docker?",
 ["Ferramenta popular para criar e executar contêineres", "Um banco de dados relacional de código aberto, usado para guardar dados das aplicações", "Um provedor de nuvem pública com datacenters", "Um sistema de arquivos distribuído para servidores, criado só para guardar dados"],
 "Docker popularizou os contêineres. Existem outras ferramentas compatíveis, mas o formato de imagem é um padrão amplamente usado.","doc"],
["cont",1,"O que é serverless?",
 ["Você envia o código, e o provedor cuida dos servidores", "Modelo em que não existe nenhum servidor no mundo, nem dentro do provedor", "Um servidor sem sistema operacional instalado", "Uma rede sem fio usada em datacenters"],
 "Os servidores existem, mas você não os administra. Paga-se pelo que roda, e em geral nada quando o sistema está parado.","srv"],
["cont",1,"O que é uma função (como AWS Lambda ou Azure Functions)?",
 ["Código que roda quando ocorre um evento, sem gerenciar servidores", "Um tipo de banco de dados para eventos", "Um servidor dedicado que fica sempre ligado", "Uma regra de firewall que bloqueia eventos"],
 "Exemplos de eventos: um arquivo enviado, uma mensagem na fila ou uma chamada de API. A função processa e termina.","srv"],
["cont",1,"Qual é uma vantagem típica dos contêineres?",
 ["Rodar do mesmo jeito no notebook, no teste e na produção", "Dispensar completamente o uso de qualquer sistema operacional no servidor", "Nunca falhar, mesmo quando o servidor cai", "Eliminar a necessidade de rede entre os serviços, pois tudo roda em um só lugar"],
 "Como tudo o que a aplicação precisa vai junto na imagem, diminuem os problemas do tipo funciona na minha máquina.","doc"],
["cont",1,"Uma tarefa roda uma vez por dia por 2 minutos, processando arquivos. Qual opção costuma ser mais barata e simples?",
 ["Uma função serverless agendada para rodar uma vez por dia", "Uma VM mantida ligada 24 horas por dia, só para essa tarefa de 2 minutos", "Um cluster de contêineres sempre ativo", "Um servidor físico novo, comprado para essa tarefa"],
 "Pagar só pelos 2 minutos diários é muito mais barato do que manter um servidor ocioso o resto do tempo.","srv"],
["cont",2,"Em um Dockerfile, por que é recomendado copiar o arquivo de dependências e instalá-las antes de copiar o código da aplicação?",
 ["Para aproveitar o cache de camadas: as dependências só são reinstaladas quando o arquivo de dependências muda", "Para que o contêiner use menos memória durante a execução, pois as dependências ficam fora dele", "Para impedir que o código da aplicação seja lido por outros contêineres do mesmo host", "Para tornar a imagem compatível com qualquer sistema operacional, inclusive os que não rodam contêineres"],
 "Cada instrução gera uma camada em cache. Se o código muda mais que as dependências, deixá-lo por último evita refazer a instalação e acelera as construções.","doc"],
["cont",2,"Qual a principal desvantagem de usar a tag latest em imagens de contêiner em produção?",
 ["Não fixa uma versão, e a mesma tag pode apontar para conteúdos diferentes com o tempo", "A tag latest impede que a imagem seja executada em clusters gerenciados, que só aceitam tags numeradas", "A tag latest dobra o tamanho da imagem, porque guarda todas as versões anteriores dentro da mesma camada", "A tag latest só funciona com registros privados, e por isso não pode ser usada em registros públicos"],
 "Com latest, um novo deploy ou reinício pode puxar uma versão diferente da testada. Tags de versão (ou digest) tornam o deploy reproduzível e a reversão simples.","doc"],
["cont",2,"No Kubernetes, qual a diferença entre requests e limits de recursos de um contêiner?",
 ["Request é a quantidade reservada para agendamento; limit é o máximo que o contêiner pode consumir", "Request é o máximo permitido de consumo; limit é o valor mínimo reservado para o agendamento", "Os dois definem apenas o espaço em disco da imagem e o tamanho dos volumes montados", "Os dois só valem para memória e nunca para CPU, que é compartilhada de forma livre"],
 "O agendador usa o request para decidir onde colocar o pod. O limit restringe o uso: excesso de CPU é limitado (throttling) e excesso de memória pode causar a finalização do contêiner.","k8s"],
["cont",2,"Um pod está em execução, mas ainda carrega dados e não pode receber tráfego. Qual verificação do Kubernetes controla isso?",
 ["Readiness probe: indica se o pod está pronto para receber requisições e entrar no balanceamento", "Liveness probe: reinicia o contêiner automaticamente se ele parar de responder às verificações", "Startup script: roda uma única vez durante a criação da imagem, antes de qualquer pod existir", "ConfigMap: guarda as variáveis de ambiente do contêiner e controla quando ele recebe tráfego"],
 "A readiness probe retira o pod do balanceamento enquanto não estiver pronto. A liveness probe, por outro lado, decide se o contêiner deve ser reiniciado por estar travado.","k8s"],
["cont",2,"Uma aplicação precisa de uma senha de banco de dados, e a equipe quer evitar colocá-la na imagem. Qual abordagem é a mais adequada?",
 ["Injetar a senha em tempo de execução por um Secret ou cofre de segredos", "Escrever a senha no Dockerfile e proteger o repositório de código com permissões restritas", "Deixar a senha em um ConfigMap em texto simples, visível a todos os que têm acesso ao cluster", "Incluir a senha no nome da imagem, para que a equipe a encontre com facilidade no registro"],
 "Imagens são copiadas e inspecionadas, então segredos embutidos vazam. O ideal é entregar o valor na execução, por Secrets (idealmente cifrados) ou por um cofre externo, com acesso restrito.","ope"],
["cont",2,"No Kubernetes, qual objeto fornece um endereço estável para acessar um conjunto de pods que muda ao longo do tempo?",
 ["Service", "Deployment", "ConfigMap", "Namespace"],
 "Pods surgem e somem com IPs variáveis. O Service oferece um IP e um nome estáveis e distribui o tráfego entre os pods que correspondem ao seletor. O Deployment gerencia as réplicas.","k8s"],
["cont",2,"Uma função serverless demora mais na primeira execução após ficar sem uso. Qual a explicação?",
 ["Partida a frio (cold start): o ambiente precisa ser criado antes da execução", "Falta de memória no servidor do provedor, que precisa liberar espaço antes de iniciar a função", "Excesso de usuários simultâneos no balanceador, que atrasa apenas as primeiras requisições da manhã", "Cobrança extra pelo primeiro acesso do dia, aplicada pelo provedor sobre o tempo de execução da função"],
 "Quando não há ambiente quente disponível, o provedor precisa iniciar um novo, carregar o código e o runtime. Reduzir o tamanho do pacote ou manter capacidade provisionada atenua o efeito.","srv"],
["cont",2,"Uma tarefa de processamento de imagens roda em contêiner, é disparada por uploads e deve parar de consumir recursos quando não há trabalho. Qual arquitetura é mais coerente?",
 ["Fila de mensagens com consumidores que escalam conforme o tamanho da fila, podendo chegar a zero quando ociosa", "Contêineres ligados 24 horas por dia, em quantidade fixa, reservados para o pico de uploads", "Uma VM grande e dedicada, ligada o mês inteiro, para processar as imagens assim que elas chegarem", "Um servidor físico no escritório, ligado por VPN, processando os uploads um de cada vez e sem fila"],
 "Escalar pelo tamanho da fila alinha a capacidade ao trabalho pendente. Com escala até zero, não há custo quando não há uploads. Capacidade fixa paga por ociosidade.","srv"],
["cont",3,"No Kubernetes, qual a diferença entre o autoscaler horizontal de pods (HPA) e o autoscaler de cluster?",
 ["O HPA ajusta o número de pods; o autoscaler de cluster ajusta o número de nós", "O HPA ajusta o número de nós; o autoscaler de cluster ajusta o número de pods", "Os dois ajustam apenas a memória de cada pod, um por pod e outro por nó", "São dois nomes diferentes para a mesma função, usados por provedores distintos de Kubernetes"],
 "O HPA cria ou remove réplicas conforme métricas como a CPU. Se os pods novos não cabem nos nós, o autoscaler de cluster adiciona nós. Os dois costumam trabalhar em conjunto.","k8s"],
["cont",3,"Durante uma atualização de versão em um Deployment, o serviço fica indisponível por alguns segundos. Qual configuração melhora isso?",
 ["Atualização gradual (rolling update) com readiness probes e margem de réplicas extras", "Excluir todos os pods antigos antes de criar os novos, para garantir que não haja duas versões juntas", "Reduzir o número de réplicas para uma, para evitar que duas versões rodem ao mesmo tempo", "Desativar as verificações de saúde, para que o Kubernetes não retire pods durante a troca"],
 "A atualização gradual troca alguns pods por vez, e a readiness probe garante que só recebam tráfego quando prontos. Com surge e unavailable bem definidos, o serviço mantém capacidade durante a troca.","k8s"],
["cont",3,"Uma equipe quer executar um banco de dados dentro do Kubernetes, que precisa de identidade de rede estável e disco persistente por réplica. Qual recurso é mais adequado?",
 ["StatefulSet com volumes persistentes", "Deployment com disco efêmero, usando um serviço comum para localizar o pod do banco", "DaemonSet, que executa um pod do banco em cada nó, com disco local de cada um", "Job, que executa uma tarefa até terminar"],
 "O StatefulSet mantém nomes e volumes estáveis para cada réplica, o que bancos e sistemas com estado exigem. Pods de um Deployment são intercambiáveis e descartáveis.","k8s"],
["cont",3,"Qual o objetivo de uma network policy no Kubernetes?",
 ["Restringir quais pods podem se comunicar entre si e com o exterior", "Aumentar a banda de rede disponível para os pods, limitando o tráfego dos demais", "Substituir o DNS interno do cluster, resolvendo nomes a partir de regras de acesso", "Escolher em qual nó cada pod será executado, conforme a carga e a afinidade configuradas"],
 "Por padrão, pods de um cluster podem falar entre si. A network policy aplica regras de entrada e saída, implementando segmentação e reduzindo o movimento lateral de um invasor.","ope"],
["cont",3,"Uma função serverless conectada a um banco relacional esgota as conexões do banco quando há picos de execuções simultâneas. Qual solução ajuda?",
 ["Usar um proxy ou pool de conexões gerenciado entre as funções e o banco, para reaproveitar as conexões", "Aumentar o tempo limite da função para 15 minutos, para que ela espere a liberação de uma conexão", "Reduzir a memória da função para o mínimo, para que menos execuções ocorram ao mesmo tempo", "Desativar o registro de logs das funções, para reduzir o tempo de cada execução no banco"],
 "Cada execução simultânea pode abrir uma conexão, e bancos têm limite. Um proxy mantém um conjunto reduzido de conexões e o reutiliza, protegendo o banco dos picos.","srv"],
["cont",3,"O que um PodDisruptionBudget (orçamento de interrupção de pods) garante?",
 ["Um mínimo de pods disponíveis durante interrupções voluntárias, como a atualização de nós", "Um limite máximo de gastos mensais com o cluster, com bloqueio automático quando o valor é atingido", "A recuperação automática de qualquer falha de hardware nos nós, sem interrupção para os usuários", "A criptografia do tráfego entre os pods durante as atualizações e as interrupções de nós"],
 "O PDB impede que uma manutenção planejada, como drenar nós, remova pods demais ao mesmo tempo, preservando a disponibilidade do serviço. Falhas involuntárias não são cobertas por ele.","k8s"],
["cont",3,"Uma aplicação precisa receber tráfego HTTP externo e distribuí-lo para vários serviços internos por caminho (por exemplo /api e /web). Qual recurso é o mais indicado?",
 ["Ingress (ou gateway), com regras de roteamento por caminho e domínio", "Um Service do tipo ClusterIP para cada rota, exposto diretamente à internet pelo nó", "Um DaemonSet que escuta na porta 80 de todos os nós e repassa para os serviços", "Um Job que redireciona as requisições externas para cada serviço em intervalos fixos"],
 "O Ingress define regras de entrada HTTP/HTTPS, roteando por domínio e caminho para os Services, com um único ponto de entrada e terminação TLS. ClusterIP é acessível apenas dentro do cluster.","k8s"],
["cont",3,"Uma equipe decide entre funções serverless e contêineres para uma API com tráfego constante, alto e previsível, com respostas em milissegundos. Qual tende a ser a melhor escolha?",
 ["Contêineres em serviço gerenciado, pelo custo previsível e pela ausência de partidas a frio", "Funções serverless, pois sempre são mais baratas em qualquer volume de requisições, mesmo constante", "VMs desligadas e ligadas manualmente a cada acesso, para pagar apenas o tempo de uso", "Um servidor físico sem balanceador, dimensionado para o pico do mês na empresa"],
 "Com tráfego alto e constante, o modelo de pagamento por execução tende a custar mais que capacidade reservada, e a partida a frio afeta a latência. Contêineres atendem melhor, com escala automática.","srv"],
["cont",4,"Vários times compartilham um cluster Kubernetes. Qual conjunto de medidas melhor isola as equipes?",
 ["Namespaces por time, cotas de recursos, RBAC e network policies, aplicados de forma padronizada", "Um único namespace com permissões de administrador para todos os times, para facilitar a colaboração", "Um servidor físico diferente para cada pod, com rede dedicada entre eles", "Cópias da mesma imagem para cada equipe, com tags diferentes por time e por ambiente"],
 "Isolamento em multi-tenancy combina limites lógicos (namespaces), de consumo (quotas), de acesso (RBAC) e de rede (policies). Sem esses controles, uma equipe pode afetar ou acessar os recursos das outras.","ope"],
["cont",4,"A empresa quer garantir que apenas imagens verificadas e assinadas sejam executadas em produção. Qual prática atende?",
 ["Assinatura de imagens e política de admissão que bloqueia imagens não assinadas", "Confiar que os desenvolvedores usarão apenas imagens corretas, com revisão ocasional", "Usar apenas a tag latest, para ter sempre a versão mais nova das imagens em produção", "Armazenar as imagens em um bucket aberto, protegido apenas por nomes difíceis de adivinhar"],
 "A assinatura (por exemplo, Cosign) comprova a origem e a integridade da imagem, e um controlador de admissão impede a execução de imagens fora da política. Isso protege a cadeia de suprimentos de software.","ope"],
["cont",4,"Os pods de uma aplicação com três réplicas estão todos no mesmo nó e na mesma zona, e uma falha derruba o serviço. Qual configuração melhora a resiliência?",
 ["Regras de distribuição (topology spread ou anti-afinidade) entre nós e zonas, para espalhar as réplicas", "Aumentar os limites de CPU de cada pod, para que o nó suporte mais carga antes de qualquer falha", "Adicionar mais um contêiner em cada pod, para que um deles assuma se o outro falhar no mesmo nó", "Trocar a imagem do contêiner por uma menor, que inicie mais rápido depois de uma falha de nó"],
 "Sem distribuição, o agendador pode concentrar réplicas. Regras de topology spread ou anti-afinidade garantem que réplicas fiquem em nós e zonas diferentes, de modo que uma falha não afete todas.","k8s"],
["cont",4,"O custo de um cluster com cargas tolerantes a interrupção (processamento em lote) está alto. Qual estratégia reduz o gasto com risco aceitável?",
 ["Grupos de nós com instâncias spot para essas cargas, com tolerância a interrupções", "Mover todo o cluster para instâncias spot, inclusive os sistemas críticos que atendem os clientes", "Manter nós ociosos de reserva em todas as zonas, para absorver qualquer interrupção", "Executar tudo em um único nó grande, com instância spot e sem redundância entre zonas"],

["cont",4,"Uma aplicação orientada a eventos processa mensagens de uma fila, e algumas mensagens são entregues mais de uma vez. O que a aplicação deve garantir?",

["cont",4,"Qual a vantagem de adotar GitOps para implantar aplicações em Kubernetes?",
 ["O estado desejado fica versionado no Git, e uma ferramenta reconcilia o cluster, com auditoria e reversão", "Elimina a necessidade de revisar mudanças antes do deploy, pois o Git aprova tudo automaticamente", "Permite alterar o cluster manualmente sem deixar rastros, pois o Git sincroniza depois", "Substitui a necessidade de testes automatizados, pois o Git valida os manifestos sozinho"],

["cont",4,"Uma empresa vai modernizar um sistema legado com 10 módulos, mas a equipe tem pouca experiência com Kubernetes e o prazo é curto. Qual abordagem é mais prudente?",
 ["Começar com contêineres em serviço gerenciado simples, evoluindo conforme a necessidade", "Adotar Kubernetes com service mesh completo desde o primeiro módulo, mesmo sem experiência da equipe", "Reescrever os 10 módulos como funções independentes, todas de uma só vez, em um único projeto grande", "Manter tudo em VMs, sem nenhuma modernização planejada, e revisar o assunto novamente apenas em cinco anos"],
 "Complexidade operacional é um custo real. Serviços gerenciados mais simples entregam valor rápido e reduzem o risco, e a adoção de Kubernetes e recursos avançados pode vir quando o benefício justificar.","ope"],
["cont",4,"Uma API em contêineres precisa lançar uma nova versão para 5% dos usuários, medir erros e latência, e só ampliar se os números estiverem bons, revertendo automaticamente em caso de problema. Qual combinação é a mais adequada?",
 ["Implantação canário com roteamento por peso (gateway ou service mesh), métricas de SLO e rollback automático", "Troca completa da versão em horário de baixo uso, sem métricas e com reversão manual se falhar", "Duas versões em ambientes diferentes que nunca recebem tráfego real, comparados pelos testes", "Publicar a versão nova para todos e pedir feedback por e-mail aos usuários mais ativos"],
 "Canário expõe a mudança a uma parcela controlada do tráfego e compara indicadores. Com rollback automático por métricas, um problema afeta poucos usuários e é revertido sem intervenção manual.","k8s"],
["ops",1,"O que é DevOps?",

 "Em vez de um time que escreve o código e outro que mantém o sistema, os dois compartilham objetivos e automatizam o caminho até a produção.","cic"],
["ops",1,"O que significa CI/CD?",

 "A cada mudança, o pipeline compila, testa e, se tudo passar, publica. Entregas pequenas e frequentes reduzem o risco.","cic"],
["ops",1,"O que é o versionamento de código (como o Git)?",

["ops",1,"O que é observabilidade?",

["ops",1,"A equipe publica uma vez por mês, com muita tensão e erros. Qual mudança ajuda mais?",

["ops",2,"Qual a diferença entre entrega contínua (continuous delivery) e implantação contínua (continuous deployment)?",

["ops",2,"O que significa dizer que uma ferramenta de infraestrutura como código é idempotente?",

["ops",2,"Qual a principal vantagem de manter ramificações (branches) de vida curta e integrar com frequência na ramificação principal?",

["ops",2,"Em observabilidade, qual a diferença entre métricas, logs e rastreamentos (traces)?",

["ops",2,"Qual alerta tende a ser mais útil para quem está de plantão?",

["ops",2,"Qual a relação entre SLI, SLO e SLA?",

["ops",2,"Um pipeline precisa usar uma credencial para publicar um sistema. Qual prática é a mais segura?",

["ops",2,"Depois de um incidente, a equipe faz uma reunião para entender o que aconteceu. Qual é a prática recomendada?",

["ops",3,"Qual a principal diferença entre implantações blue/green e canário?",

["ops",3,"O estado real da infraestrutura difere do que o código de IaC descreve, porque alguém alterou um recurso pelo console. Como se chama isso e qual a prática?",

["ops",3,"Quais indicadores a pesquisa DORA usa para medir a performance de entrega de software?",

["ops",3,"Um serviço tem alta cardinalidade nas métricas (um rótulo com o ID de cada usuário) e o custo de monitoramento explodiu. Qual a correção?",

["ops",3,"Uma equipe quer desacoplar a publicação de código da liberação de funcionalidades para os usuários. Qual prática ajuda?",

 ["Toil (trabalho braçal); limitá-lo, por exemplo, a 50% do tempo, automatizando as tarefas repetitivas", "Postmortem; fazer uma reunião de análise para cada tarefa manual executada pela equipe de operações", "Error budget; aumentar o orçamento de erros permitido, para que a equipe tenha mais tempo livre", "Drift; reconciliar os recursos da nuvem com o código, corrigindo as diferenças encontradas manualmente"],

["ops",4,"Os módulos de IaC são usados por 20 equipes, e uma mudança em um módulo comum quebrou vários ambientes. Qual prática reduz esse risco?",

["ops",4,"Durante um incidente grave, vários engenheiros tentam ajudar ao mesmo tempo, com ações conflitantes. Qual prática organiza a resposta?",

["ops",4,"Um serviço crítico atende 99,95% das requisições, e o SLO é 99,9%. A equipe quer reduzir os alertas sem perder detecção de problemas reais. Qual abordagem é a mais coerente?",
