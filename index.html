 ["Dar um critério comum para decidir e justificar escolhas em vários projetos", "Impedir qualquer projeto novo de ser aprovado", "Substituir a necessidade de requisitos de negócio", "Garantir que todos os projetos usem a mesma linguagem de programação, o mesmo banco e o mesmo fornecedor"],
 "Princípios curtos e claros orientam decisões quando faltam regras detalhadas. Cada um deve trazer justificativa e implicações.","adr"],
["gov",2,"O que significa o termo \"dívida técnica\"?",
 ["O custo futuro de atalhos ou soluções subótimas adotadas hoje, que exigirão retrabalho", "O valor devido ao fornecedor de hardware por equipamentos adquiridos e ainda não pagos pela empresa", "O saldo de horas extras da equipe de TI", "A diferença entre o orçamento previsto e o valor efetivamente gasto em tecnologia ao longo do exercício fiscal"],
 "Como uma dívida financeira, ela rende \"juros\": quanto mais tempo ela fica, mais custa manter e evoluir o sistema. Deve ser visível e priorizada.","adr"],
["gov",2,"O que é a estratégia de racionalização de aplicações com as opções \"retain, retire, replace, rehost, refactor\"?",
 ["Classificar cada aplicação pelo destino mais adequado no processo de modernização", "Medir a velocidade da rede entre aplicações", "Definir quantos usuários cada aplicação suporta ao mesmo tempo e qual será o tamanho do servidor de cada uma", "Escolher a cor das telas das aplicações"],
 "Cada aplicação do portfólio recebe um destino (manter, aposentar, substituir, mover como está ou refatorar) com base em valor de negócio, custo e risco.","cat"],
["gov",3,"Uma área compra uma ferramenta SaaS sem passar pela TI (shadow IT). Qual é a resposta de governança mais saudável?",
 ["Entender a necessidade, avaliar segurança e integração e, se fizer sentido, formalizar e incluir no portfólio", "Bloquear todos os acessos à internet da empresa", "Ignorar o caso, pois a área é responsável pelo orçamento e pelas decisões sobre as ferramentas que usa no trabalho", "Cancelar a ferramenta imediatamente, sem conversar com a área, e bloquear o domínio do fornecedor na rede da empresa"],
 "Shadow IT revela uma necessidade não atendida. O caminho é trazer a ferramenta para dentro de controles (segurança, dados, contrato) sem travar o negócio.","gv"],
["gov",3,"No TOGAF, qual é a função da fase \"Visão da Arquitetura\" do ADM?",
 ["Definir escopo, partes interessadas e objetivos, e obter aprovação para iniciar o trabalho", "Implantar os servidores e configurar a rede", "Escrever o código das aplicações do projeto", "Encerrar o contrato com os fornecedores antigos e iniciar uma nova rodada de cotação de equipamentos e licenças"],
 "A fase de visão estabelece o problema, o escopo e a proposta de valor, e cria o consenso inicial. As demais fases detalham negócio, dados, aplicações e tecnologia.","ea"],
["gov",3,"Qual é a diferença entre arquitetura-alvo (to-be) e arquitetura atual (as-is)?",
 ["A atual descreve como é hoje; a alvo, como se deseja que seja, e a diferença forma o plano de transição", "A atual é a que está na nuvem; a alvo é a que está no datacenter", "A atual é sempre a mais barata; a alvo, a mais cara", "São sinônimos usados por equipes diferentes"],
 "Comparar as duas gera a análise de lacunas (gap analysis) e o roadmap em etapas, com riscos e dependências.","ea"],
["gov",3,"Um cliente exige que dados pessoais de clientes europeus fiquem na União Europeia. Qual é o impacto no desenho?",
 ["Escolher regiões e serviços compatíveis, controlar réplicas e backups e documentar a base legal para transferências", "Nenhum impacto, pois a nuvem armazena os dados em qualquer lugar e o cliente não precisa se preocupar com a localização", "Apenas trocar o idioma da interface dos sistemas", "Apagar os dados após cada consulta feita pelo usuário, de modo que nenhuma informação pessoal permaneça armazenada em outro lugar"],
 "A localização afeta backup, réplicas, suporte remoto e logs. É preciso mapear onde cada dado vai parar, e não apenas onde o banco está.","cmp"],
["gov",3,"Qual é a melhor definição de \"guardrails\" (limites de proteção) em governança de nuvem?",
 ["Regras automáticas (políticas) que impedem ou sinalizam configurações fora do padrão, sem travar as equipes", "Reuniões semanais para aprovar manualmente cada recurso criado, com a presença obrigatória de todos os gestores de área", "Contratos que proíbem o uso de qualquer serviço novo", "Equipamentos físicos que protegem o datacenter contra incêndio"],
 "Guardrails dão autonomia com segurança: por exemplo, bloquear buckets públicos ou exigir tags. Substituem aprovações manuais por controle contínuo.","gv"],
["gov",3,"Como um ADR deve registrar uma decisão para ser realmente útil no futuro?",
 ["Com contexto, opções avaliadas, critérios, decisão e consequências, incluindo o que se aceitou perder", "Apenas com o nome da tecnologia escolhida", "Com um texto longo, sem estrutura, escrito pelo fornecedor, descrevendo apenas o nome da tecnologia e a data da escolha", "Sem alternativas, para não gerar discussão com o comitê e acelerar a aprovação das decisões nos projetos da empresa"],
 "O valor do ADR está no porquê. Registrar as alternativas e os trade-offs permite revisitar a decisão quando o contexto mudar.","adr"],
["gov",3,"Qual métrica ajuda a mostrar o valor da arquitetura corporativa para o negócio?",
 ["Redução de aplicações redundantes, de custo de suporte e do tempo para entregar mudanças", "Quantidade de diagramas produzidos por mês", "Número de reuniões do comitê realizadas por ano e quantidade de participantes presentes em cada uma delas", "Quantidade de páginas do documento de padrões e de diagramas produzidos por cada equipe de arquitetura"],
 "Resultados mensuráveis (menos duplicidade, entrega mais rápida, menos incidentes) mostram impacto. Produção de documentos, isoladamente, não prova valor.","ea"],
["gov",3,"Uma empresa quer reduzir 300 aplicações para menos de 200. Qual é o primeiro passo mais sensato?",
 ["Inventariar as aplicações com dono, uso, custo e criticidade, e classificar cada uma", "Desligar as 100 aplicações com menor tráfego, sem consultar os donos, para atingir a meta de redução imediatamente", "Migrar as 300 aplicações para a nuvem como estão", "Contratar uma ferramenta nova para substituir todas elas"],
 "Sem dados de uso, custo e valor, cortes viram palpite e geram risco. O portfólio classificado permite aposentar, consolidar ou modernizar com segurança.","cat"],
["gov",4,"Duas equipes pedem exceções ao padrão de banco de dados no mesmo mês. Qual é a análise mais adequada?",
 ["Avaliar se os requisitos justificam a exceção e se o padrão está desatualizado, revisando-o se for o caso", "Negar todas as exceções para manter o padrão como está, independentemente dos requisitos apresentados pelas equipes", "Aprovar todas as exceções para não atrasar os projetos", "Eliminar o padrão e deixar cada equipe escolher sem critério, para que a governança deixe de atrapalhar os projetos"],
 "Exceções repetidas são sinal: ou os projetos têm necessidades legítimas, ou o padrão ficou obsoleto. A governança deve aprender com elas.","gv"],
["gov",4,"Um incidente de vazamento de dados pessoais ocorre em um sistema de nuvem. Qual combinação de ações é a mais adequada de acordo com a lógica da LGPD?",
 ["Conter o incidente, avaliar o risco aos titulares, comunicar a autoridade e os titulares quando houver risco relevante, e registrar", "Esperar a imprensa noticiar e só então avaliar", "Apagar os registros do incidente para evitar processos", "Comunicar apenas ao provedor de nuvem, sem avisar os titulares nem a autoridade, e tratar o assunto como falha técnica interna de baixa prioridade"],
 "A LGPD prevê comunicação à ANPD e aos titulares quando há risco ou dano relevante. O registro e a resposta rápida fazem parte da responsabilização do controlador.","cmp"],
["gov",4,"Em uma fusão de duas empresas, ambas têm um ERP. Qual é a melhor abordagem de arquitetura corporativa?",
 ["Mapear as capacidades de cada uma, avaliar custos e riscos de cada opção e definir uma arquitetura-alvo com um roteiro faseado", "Escolher o ERP da empresa maior e migrar tudo em um fim de semana, com toda a equipe de plantão para corrigir os problemas que surgirem", "Manter os dois ERPs para sempre, sem integração", "Contratar um terceiro ERP e desativar os dois imediatamente, para recomeçar do zero com uma plataforma única e moderna escolhida pelo fornecedor"],
 "Fusões exigem integração gradual, com análise de capacidades, dados mestres e processos. Uma data única é arriscada, e dois ERPs sem integração geram retrabalho.","ea"],
["gov",4,"Como equilibrar autonomia das equipes de produto com consistência entre os sistemas?",
 ["Definir poucos padrões obrigatórios nas fronteiras (segurança, dados, integração) e liberar as escolhas internas", "Padronizar todas as ferramentas, linguagens e bibliotecas em todos os times, com aprovação prévia de cada nova dependência", "Deixar cada equipe criar suas regras de segurança e de dados", "Concentrar todas as decisões em um único arquiteto aprovando cada commit"],
 "Controle onde o risco é compartilhado (identidade, dados, contratos) e liberdade onde o impacto é local. Padronizar demais trava; padronizar de menos fragmenta.","gv"],
["gov",4,"Uma auditoria aponta que o acesso privilegiado a produção não tem revisão periódica. Qual controle é o mais adequado?",
 ["Revisão periódica de acessos, princípio do menor privilégio, aprovação com prazo e registro de uso", "Compartilhar uma única conta administrativa com a equipe", "Remover todos os logs para reduzir o espaço utilizado", "Conceder acesso permanente a todos os desenvolvedores"],
 "Acesso privilegiado é alto risco. Recertificação periódica, acesso temporário (just in time) e trilha de auditoria atendem tanto a normas quanto à boa prática.","cmp"],
["gov",4,"Qual risco surge quando a arquitetura é definida apenas por tecnologia, sem ouvir o negócio?",
 ["Soluções tecnicamente elegantes que não resolvem prioridades do negócio, com baixo retorno", "Redução automática do custo operacional da TI, pois a padronização elimina a necessidade de suporte e manutenção", "Aumento imediato da satisfação dos clientes", "Eliminação da dívida técnica pela padronização, já que todos os sistemas passam a usar as mesmas tecnologias"],
 "Arquitetura deve começar nos objetivos e nas capacidades do negócio. Sem esse vínculo, o investimento tende a se concentrar onde é mais interessante tecnicamente, e não onde gera valor.","ea"],
["gov",4,"Uma empresa tem três provedores de nuvem por decisões isoladas de áreas. Qual é a ação de governança mais coerente?",
 ["Avaliar custo, risco e competências, definir quando cada provedor é permitido e padronizar controles mínimos comuns", "Migrar tudo para o provedor mais barato em 30 dias", "Proibir imediatamente todas as cargas de trabalho já existentes nos provedores, até que se defina um provedor único", "Deixar cada área negociar contratos sem visibilidade central, para que o preço seja decidido por quem usa o serviço"],
 "Multicloud pode ser decisão legítima, mas precisa ser consciente. Governança define critérios, controles comuns (identidade, rede, custos) e visibilidade central.","gv"],
["gov",4,"Ao propor um roteiro (roadmap) de modernização a 3 anos, qual abordagem tem mais chance de sucesso?",
 ["Entregas incrementais com valor mensurável a cada etapa e revisão periódica do plano", "Uma única entrega ao final do terceiro ano, com todo o benefício concentrado em um grande lançamento", "Um plano fixo, sem revisão, para evitar mudanças de escopo e manter a equipe focada nos prazos definidos", "Um plano sem custos, apenas com datas"],
 "Fases curtas mostram valor cedo, reduzem risco e permitem ajustar o rumo quando o negócio muda. Grandes entregas únicas costumam falhar ou chegar obsoletas.","ea"],
["ia",1,"O que é machine learning (aprendizado de máquina)?",
 ["Técnica em que o sistema aprende padrões a partir de dados, em vez de seguir regras escritas à mão", "Um tipo de servidor com mais memória que os convencionais, usado para armazenar grandes volumes de dados históricos", "Um equipamento de rede que filtra pacotes", "Uma linguagem usada apenas para planilhas"],
 "No ML, o modelo é treinado com exemplos e depois faz previsões ou classificações sobre dados novos.","ml"],
["ia",1,"Qual é a diferença entre treinamento e inferência?",
 ["Treinar é ensinar o modelo com dados; inferência é usar o modelo pronto para gerar resultados", "Treinamento é a instalação do software; inferência é a compra da licença", "Treinamento só ocorre em nuvem; inferência só ocorre no datacenter", "Não há diferença, os dois termos descrevem a mesma etapa"],
 "O treinamento é caro e feito de vez em quando. A inferência acontece a cada uso e exige baixa latência e custo por requisição controlado.","mlo"],
["ia",1,"O que é um LLM (large language model)?",
 ["Um modelo treinado em grande quantidade de texto, capaz de gerar e compreender linguagem natural", "Um banco de dados que guarda grandes arquivos de log gerados pelos servidores e pelos equipamentos de rede", "Uma rede privada para ligar filiais distantes", "Um protocolo de e-mail criptografado"],
 "LLMs, como os que sustentam assistentes de IA, preveem a próxima palavra com base no contexto, o que permite responder, resumir e escrever.","gen"],
["ia",1,"Por que as GPUs são tão usadas em IA?",
 ["Porque executam muitas operações matemáticas em paralelo, o que acelera o treinamento e a inferência", "Porque são a única opção de armazenamento de dados", "Porque consomem sempre menos energia do que uma CPU", "Porque substituem completamente a necessidade de memória e de armazenamento nos servidores de treinamento de modelos"],
 "Redes neurais fazem milhões de multiplicações de matrizes. As GPUs (e aceleradores similares) têm milhares de núcleos para esse trabalho paralelo.","inf"],
["ia",1,"O que são dados de treinamento?",
 ["Os exemplos usados para ensinar o modelo a reconhecer padrões", "As senhas usadas para acessar o modelo", "Os logs de acesso dos usuários ao sistema", "As cópias de backup do modelo"],
 "A qualidade e a representatividade dos dados determinam a qualidade do modelo. Dados ruins ou enviesados produzem resultados ruins ou injustos.","ml"],
["ia",1,"O que é uma \"alucinação\" em IA generativa?",
 ["Uma resposta que parece convincente, mas contém informação inventada ou incorreta", "Um erro de hardware causado por superaquecimento", "Um ataque que derruba o serviço por excesso de acessos", "Um modelo que se recusa a responder qualquer pergunta"],
 "Modelos generativos produzem texto plausível, não necessariamente verdadeiro. Por isso é preciso validar respostas e, quando possível, apoiá-las em fontes.","gen"],
["ia",1,"Por que é importante tratar dados pessoais com cuidado ao usar IA?",
 ["Porque podem ser expostos ou usados fora da finalidade, o que traz risco legal e de privacidade", "Porque dados pessoais não podem ser processados por computadores, e apenas pessoas autorizadas podem manipulá-los", "Porque deixam o modelo mais lento em qualquer caso", "Porque a lei proíbe qualquer uso de IA em empresas"],
 "Ao enviar dados a um serviço de IA, é preciso saber onde são armazenados, se são usados para treinar modelos e qual é a base legal do tratamento.","eti"],
["ia",1,"Qual é um exemplo de uso de machine learning no dia a dia de TI?",
 ["Detectar anomalias em métricas de monitoramento e prever falhas de disco", "Conectar dois cabos de rede em um switch", "Instalar um sistema operacional em um servidor", "Criar uma regra de firewall para liberar uma porta específica de acesso entre duas redes internas"],
 "Detecção de anomalias e manutenção preditiva são aplicações comuns: o modelo aprende o comportamento normal e aponta desvios.","ml"],
["ia",2,"Qual é a diferença entre aprendizado supervisionado e não supervisionado?",
 ["No supervisionado os dados têm respostas conhecidas (rótulos); no não supervisionado o modelo busca padrões sem rótulos", "O supervisionado exige um professor humano acompanhando o treinamento em tempo real; o não supervisionado funciona sem nenhum dado de entrada", "O supervisionado só funciona com imagens e vídeos; o não supervisionado funciona apenas com números e tabelas simples de dados", "Não há diferença, a distinção é apenas de nome comercial"],
 "Classificar e-mails como spam, com exemplos marcados, é supervisionado. Agrupar clientes semelhantes, sem marcações, é não supervisionado (clustering).","ml"],
["ia",2,"O que é overfitting (sobreajuste)?",
 ["O modelo decora os dados de treino e vai mal em dados novos", "O modelo é pequeno demais para aprender qualquer padrão", "O modelo precisa de mais GPUs do que o disponível", "O modelo recusa dados em formato diferente do esperado"],
 "Um modelo com ótimo resultado no treino e fraco em produção está sobreajustado. Dados de validação separados e regularização ajudam a detectá-lo e reduzi-lo.","ml"],
["ia",2,"O que é RAG (retrieval-augmented generation)?",
 ["Recuperar informações de uma base confiável e incluí-las no contexto do modelo antes de gerar a resposta", "Treinar um modelo novo do zero com todos os dados da empresa", "Reduzir o tamanho do modelo apagando partes dele", "Substituir o modelo por uma busca por palavras-chave"],
 "O RAG liga o LLM aos documentos da empresa sem retreinar o modelo. Reduz alucinações e permite citar fontes e atualizar a base com facilidade.","gen"],
["ia",2,"O que é um \"prompt\"?",
 ["A instrução ou o contexto enviado ao modelo para orientar sua resposta", "Um tipo de banco de dados vetorial", "O nome do processo de treinamento de um modelo com os dados históricos da empresa", "Uma licença de uso de um provedor de IA, cobrada por usuário e por mês de utilização"],
 "A qualidade do prompt influencia a resposta: contexto, formato desejado e exemplos tendem a melhorar o resultado.","gen"],
["ia",2,"Por que um modelo precisa ser monitorado depois de entrar em produção?",
 ["Porque os dados reais mudam com o tempo (drift) e o desempenho pode cair sem aviso", "Porque modelos prontos nunca falham e só precisam de logs", "Porque o monitoramento aumenta a precisão do modelo automaticamente, sem necessidade de novo treinamento ou de ajuste", "Porque é uma exigência de todos os provedores de nuvem"],
 "Mudanças no comportamento dos usuários ou nos dados degradam o modelo (data drift, concept drift). É preciso medir e retreinar quando necessário.","mlo"],
["ia",2,"O que é MLOps?",
 ["Práticas para treinar, publicar, monitorar e atualizar modelos de forma automatizada e repetível", "Uma linguagem para escrever modelos de rede", "Um tipo de processador feito para inferência, que substitui a necessidade de servidores durante o treinamento dos modelos", "Uma norma de segurança para datacenters"],
 "MLOps aplica ideias de DevOps ao ciclo de vida de modelos: versionamento de dados e modelos, pipelines, implantação e monitoramento.","mlo"],
["ia",2,"Qual é a vantagem de usar um serviço gerenciado de IA (como API de LLM) em vez de hospedar o próprio modelo?",
 ["Menor esforço de infraestrutura e acesso rápido a modelos avançados, com pagamento por uso", "Controle total do hardware e dos dados em qualquer circunstância, sem dependência de nenhum provedor externo ou contrato", "Eliminação de qualquer risco de privacidade ou de compliance, pois o provedor assume toda a responsabilidade legal", "Custo sempre menor, independentemente do volume de uso"],
 "O serviço gerenciado acelera a entrega. Em contrapartida, há dependência do provedor, custo variável por volume e questões de privacidade a avaliar.","inf"],
["ia",2,"O que significa viés (bias) em um modelo de IA?",
 ["Tendência a resultados sistematicamente injustos ou distorcidos, geralmente herdados dos dados", "A velocidade com que o modelo responde a uma pergunta, medida em tokens por segundo, sob carga de teste", "O tamanho do modelo em gigabytes", "A quantidade de GPUs usadas no treinamento"],
 "Se os dados de treino refletem desigualdades, o modelo as reproduz. Avaliar por grupos e revisar os dados ajuda a reduzir o problema.","eti"],
["ia",3,"Qual métrica é mais enganosa para avaliar um modelo que detecta fraude, em que apenas 0,1% das transações são fraudes?",
 ["Acurácia, pois um modelo que diga \"não é fraude\" sempre acerta 99,9%", "Revocação (recall), que mostra quantas fraudes reais foram encontradas", "Precisão, que mostra quantos dos alertas emitidos pelo modelo realmente eram fraude confirmada", "F1, que combina precisão e revocação"],
 "Em dados desbalanceados, a acurácia esconde falhas. Precisão, revocação e F1 mostram se o modelo realmente encontra os casos raros.","ml"],
["ia",3,"Em um modelo de classificação, o que significa aumentar o limiar (threshold) para considerar algo \"positivo\"?",
 ["Menos alertas e maior precisão, mas menor revocação (mais casos reais perdidos)", "Mais alertas e maior revocação, mas menor precisão, porque o modelo passa a classificar mais casos como positivos", "Nenhuma mudança, pois o limiar não afeta o resultado, que depende só dos dados de treinamento", "O modelo passa a ser treinado novamente do zero"],
 "Há sempre um trade-off. Em fraude ou doenças, perder um caso real pode custar mais do que investigar um falso alarme, e o limiar deve refletir isso.","ml"],
["ia",3,"Por que um banco vetorial (vector database) é usado em aplicações com LLM?",
 ["Para buscar trechos semanticamente parecidos com a pergunta e enviá-los ao modelo como contexto", "Para armazenar apenas as senhas dos usuários", "Para substituir o modelo de linguagem por consultas SQL, que retornam sempre a resposta exata ao usuário", "Para comprimir as respostas do modelo antes do envio"],
 "Textos viram vetores numéricos (embeddings). A busca por similaridade encontra passagens relevantes mesmo sem as mesmas palavras, base do RAG.","gen"],
["ia",3,"Uma empresa quer usar um LLM com documentos confidenciais. Qual é o cuidado mais importante?",
 ["Garantir que os dados não sejam usados para treinar o modelo de terceiros, controlar acesso e definir onde ficam armazenados", "Enviar os documentos sem qualquer revisão, para ganhar tempo", "Usar o serviço gratuito disponível na internet com a conta pessoal de cada funcionário, para agilizar o início e testar a ideia rapidamente", "Desativar o registro de acessos para evitar custo de armazenamento e simplificar a operação da plataforma de IA, sem perder desempenho"],
 "Confidencialidade exige contrato, controle de acesso, residência dos dados e, em alguns casos, modelo dedicado. Serviços de consumo raramente atendem a requisitos corporativos.","eti"],
["ia",3,"O custo de um LLM por API é cobrado por token. Qual medida reduz mais o custo sem perder qualidade nas respostas?",
 ["Enviar apenas o contexto necessário (por exemplo, via RAG) e usar um modelo menor quando a tarefa permite", "Enviar todos os documentos da empresa em cada pergunta", "Repetir cada pergunta várias vezes para confirmar a resposta e escolher a que aparecer com mais frequência entre as tentativas", "Aumentar o tamanho máximo de resposta em todas as chamadas, de modo que o modelo nunca interrompa o texto gerado"],
 "O custo cresce com tokens de entrada e saída. Contexto enxuto, cache de respostas frequentes e modelos proporcionais à tarefa reduzem a fatura.","inf"],
["ia",3,"Qual é o papel de um conjunto de teste (test set) separado?",
 ["Medir o desempenho do modelo em dados que ele nunca viu, para estimar o resultado em produção", "Treinar o modelo com mais exemplos", "Armazenar os resultados finais do modelo para que possam ser apresentados à diretoria no relatório do projeto", "Servir de backup caso os dados de treino se percam, permitindo recuperar o modelo e os pesos já ajustados"],
 "Avaliar com dados de treino superestima a qualidade. O conjunto de teste, intocado durante o desenvolvimento, dá uma estimativa honesta.","mlo"],
["ia",3,"Para que serve o versionamento de dados e de modelos em MLOps?",
 ["Reproduzir resultados, comparar versões e reverter para um modelo anterior se algo piorar", "Reduzir o tamanho de cada modelo em disco", "Evitar que usuários acessem o modelo", "Criptografar os modelos em repouso"],
 "Sem versionar dados, código e modelo, não se sabe por que um resultado mudou. É a base de auditoria e de rollback em produção.","mlo"],
["ia",3,"Em uma proposta de IA, o cliente espera \"100% de acerto\". Qual é a resposta mais profissional?",
 ["Explicar que modelos têm taxa de erro, definir métricas aceitáveis e prever revisão humana nos casos críticos", "Prometer 100% para fechar o contrato", "Afirmar que a IA nunca erra quando bem treinada e que a revisão humana é desnecessária em qualquer caso de uso", "Recusar o projeto, pois nenhum modelo é perfeito e, portanto, nenhuma solução de IA pode ser entregue ao cliente"],
 "Modelos erram. A conversa correta define o nível de erro tolerável por caso de uso, as métricas e onde há um humano na decisão (human in the loop).","eti"],
["ia",4,"Um modelo de 70 bilhões de parâmetros usa 16 bits (2 bytes) por parâmetro. Quanta memória, no mínimo, ocupam apenas os pesos?",
 ["Cerca de 140 GB (70 bilhões × 2 bytes)", "Cerca de 70 GB, contando 1 byte por parâmetro", "Cerca de 14 GB, dividindo por dez", "Cerca de 1,4 TB, multiplicando por vinte"],
 "70 × 10⁹ × 2 bytes = 140 GB, sem contar ativações e cache de atenção. Por isso a quantização (8 ou 4 bits) e o uso de várias GPUs são comuns.","inf"],
["ia",4,"Uma API de LLM cobra US$ 3 por milhão de tokens de entrada e US$ 15 por milhão de tokens de saída. Em uma chamada com 2.000 tokens de entrada e 500 de saída, qual é o custo aproximado?",
 ["Cerca de US$ 0,0135 (0,006 + 0,0075)", "Cerca de US$ 0,135, deslocando a vírgula uma casa", "Cerca de US$ 1,35 por chamada", "Cerca de US$ 0,0015, considerando apenas a saída"],
 "Entrada: 2.000 × 3 ÷ 1.000.000 = 0,006. Saída: 500 × 15 ÷ 1.000.000 = 0,0075. Total ≈ US$ 0,0135. Em volume (milhões de chamadas), o custo muda a viabilidade.","inf"],
["ia",4,"O desempenho de um modelo em produção cai 15% em três meses, sem mudança no código. Qual é a hipótese mais provável?",
 ["Drift: os dados reais mudaram em relação aos usados no treino", "Os servidores esqueceram os pesos do modelo", "O modelo fica naturalmente mais lento e menos preciso com o tempo de uso do hardware", "A licença do software expirou silenciosamente e o provedor passou a usar uma versão menor do modelo"],
 "Mudanças em comportamento, sazonalidade ou processos alteram a distribuição dos dados. Monitorar entradas e saídas permite detectar e retreinar.","mlo"],
["ia",4,"Qual é o melhor argumento para usar RAG em vez de fazer fine-tuning para responder com base em documentos internos?",
 ["Os documentos mudam com frequência, e o RAG permite atualizar a base sem retreinar e citar a origem", "O fine-tuning é proibido para dados corporativos", "O RAG elimina qualquer chance de erro do modelo", "O RAG aumenta o número de parâmetros do modelo"],
 "Fine-tuning ajusta estilo e comportamento, mas incorpora o conhecimento no modelo, o que é caro de atualizar. O RAG consulta a fonte atual e é mais rastreável.","gen"],
["ia",4,"Um chatbot interno com LLM pode acessar documentos de RH. Qual controle é indispensável?",
 ["Respeitar as permissões do usuário na busca, para que ele só receba conteúdo que já poderia ver", "Dar ao chatbot acesso total e confiar que ele não revelará nada", "Esconder os documentos sensíveis apenas na interface", "Usar o mesmo acesso administrativo para todas as consultas"],
 "Se o índice mistura documentos sem controle de acesso, o chatbot pode revelar o que o usuário não deveria ver. A autorização deve ser aplicada na recuperação, e não só na tela.","eti"],
["ia",4,"Um projeto de IA tem dados espalhados em cinco sistemas, sem donos definidos, e a diretoria quer resultados em 2 meses. Qual é a melhor condução?",
 ["Alinhar expectativas, priorizar um caso de uso viável, tratar a qualidade e o acesso aos dados antes de modelar", "Começar a treinar o modelo com os dados disponíveis, sem verificar a qualidade, e ajustar os resultados no final do projeto", "Prometer a entrega em 2 meses e resolver os dados depois", "Cancelar o projeto, porque dados espalhados em cinco sistemas e sem donos definidos impedem qualquer iniciativa de IA"],
 "A maior parte do esforço de IA está em dados. Um escopo menor com dados confiáveis entrega valor e prova viabilidade, em vez de um modelo bom sobre dados ruins.","mlo"],
["ia",4,"Qual cenário justifica hospedar modelos próprios (on-premises ou em GPU dedicada), em vez de usar uma API de terceiros?",
 ["Volume alto e previsível, requisitos rígidos de privacidade ou necessidade de baixa latência e controle", "Uso esporádico, com poucas dezenas de chamadas por mês", "Equipe sem experiência e sem orçamento para operação", "Prova de conceito rápida, que será descartada em uma semana, sem exigência de volume, de latência nem de privacidade"],
 "Com muito volume e dados sensíveis, o custo por token de terceiros pode superar o custo fixo de GPUs. Em contrapartida, exige operação, capacidade e atualização dos modelos.","inf"],
["ia",4,"Qual prática reduz o risco de \"prompt injection\" em um assistente que lê e-mails e executa ações?",
 ["Tratar o conteúdo externo como não confiável, limitar as ações permitidas e exigir confirmação humana nas sensíveis", "Dar ao assistente permissões de administrador para evitar bloqueios, de modo que ele execute as tarefas pedidas sem interrupção", "Confiar nas instruções que vierem dentro dos e-mails", "Permitir que o modelo execute qualquer comando solicitado dentro do e-mail, desde que o remetente pareça conhecido pelo usuário"],
 "Um texto malicioso em um e-mail pode tentar mudar o comportamento do modelo. Menor privilégio, filtragem e aprovação humana limitam o dano.","eti"],
["esp",1,"En español, ¿qué significa \"servidor\"?",
 ["Servidor, o computador que fornece serviços ou recursos a outros", "Servente, o funcionário que faz a limpeza e a manutenção do datacenter durante a madrugada", "Cliente, o usuário que consome o serviço", "Roteador, o equipamento que liga duas redes e encaminha os pacotes entre elas"],
 "\"Servidor\" é igual em português. Cuidado com \"cliente\" (cliente ou usuário do serviço) e \"enrutador\"/\"router\" (roteador).","inf"],
["esp",1,"¿Qué significa \"nube\" en tecnología?",
 ["Nuvem, o ambiente de computação oferecido por um provedor pela internet", "Nó, o ponto de conexão entre dois cabos", "Núcleo, a parte central de um processador, onde ocorrem os cálculos de cada thread", "Rede, o conjunto de equipamentos interligados que trocam dados dentro de uma empresa"],
 "\"La nube\" é a computação em nuvem. \"Nube\" literalmente é a nuvem do céu, e \"red\" é a rede.","nub"],
["esp",1,"¿Qué es una \"contraseña\"?",
 ["Uma senha, usada para autenticar um usuário", "Um contrato de serviço entre duas empresas", "Uma cópia de segurança dos dados", "Uma regra de firewall que bloqueia o acesso"],
 "\"Contraseña\" é senha. Um falso amigo comum: \"contrato\" é contrato, e não senha.","seg"],
["esp",1,"¿Qué significa \"copia de seguridad\"?",
 ["Backup, uma cópia dos dados para recuperação", "Segurança do prédio, feita por vigilantes", "Uma cópia de um documento impresso", "Um acordo de confidencialidade"],
 "\"Copia de seguridad\" (ou \"respaldo\" em alguns países) é backup. \"Restaurar\" a copia é restaurar o backup.","inf"],
["esp",1,"En una reunión, alguien dice \"el plazo\". ¿A qué se refiere?",
 ["Ao prazo para entregar algo", "Ao preço do serviço", "Ao plano de contingência", "À equipe técnica responsável pelo projeto"],
 "\"Plazo\" é prazo ou período de tempo. \"Precio\" é preço, \"plan\" é plano, \"equipo\" é equipe.","rep"],
["esp",1,"¿Qué quiere decir \"base de datos\"?",
 ["Banco de dados", "Base de apoio de um equipamento", "Dados de base para cálculo de impostos", "Servidor de arquivos"],
 "\"Base de datos\" é banco de dados. \"Datos\" é dados, e a ordem das palavras é diferente do português.","inf"],
["esp",1,"¿Qué significa \"caída del servicio\"?",
 ["Interrupção ou queda do serviço", "Redução do preço do serviço contratado", "Mudança de fornecedor do serviço", "Atualização do serviço"],
 "\"Caída\" vem de \"caer\" (cair). Em incidentes: \"hubo una caída del sistema\" quer dizer que o sistema ficou fora do ar.","inc"],
["esp",1,"¿Cómo se dice \"propuesta\" en portugués?",
 ["Proposta", "Proposição legal", "Pesquisa de mercado", "Preço final"],
 "\"Propuesta\" é proposta. Em pré-vendas: \"enviamos la propuesta comercial\" é \"enviamos a proposta comercial\".","rep"],
["esp",2,"¿Qué significa \"tenemos que escalar el incidente\"?",
 ["Precisamos escalar (encaminhar a um nível superior) o incidente", "Precisamos subir de escada até o datacenter", "Precisamos ampliar o servidor com mais memória", "Precisamos desligar o sistema e esperar"],
 "\"Escalar\" pode ser aumentar capacidade ou subir o chamado a outro nível. No contexto de incidentes, é o encaminhamento (escalamento).","inc"],
["esp",2,"¿Qué es un \"cortafuegos\"?",
 ["Um firewall, equipamento ou software que filtra o tráfego de rede", "Uma proteção contra incêndio instalada no datacenter, com gás e sensores de fumaça", "Um disjuntor elétrico", "Um programa antivírus para estações"],
 "\"Cortafuegos\" é a tradução literal de firewall. Na prática, é comum ouvir \"firewall\" em espanhol também.","seg"],
["esp",2,"¿Qué significa \"nos hace falta ancho de banda\"?",
 ["Precisamos de mais largura de banda", "Temos largura de banda sobrando", "A largura de banda está bloqueada pelo provedor", "Vamos reduzir a largura de banda"],
 "\"Hacer falta\" é precisar ou fazer falta. Cuidado: não é \"fazer falta\" no sentido de erro, e sim necessidade. \"Ancho de banda\" é largura de banda.","inf"],
["esp",2,"¿Qué quiere decir \"alta disponibilidad\"?",
 ["Alta disponibilidade, capacidade de manter o serviço ativo apesar de falhas", "Alta demanda de usuários em horário de pico", "Alto custo de operação do serviço", "Alto nível de segurança"],
 "\"Disponibilidad\" é disponibilidade. É comum ver \"99,9% de disponibilidad\" em SLAs e \"alta disponibilidad\" em desenhos de arquitetura.","nub"],
["esp",2,"El cliente dice: \"Necesitamos migrar a la nube antes de fin de año\". ¿Qué pide?",
 ["Migrar para a nuvem antes do fim do ano", "Criar uma nova nuvem privada no ano seguinte", "Atualizar o sistema operacional até o fim do ano", "Cancelar o contrato com o provedor atual"],
 "\"Antes de fin de año\" é antes do fim do ano. \"Migrar a la nube\" é migrar para a nuvem. A preposição \"a\" indica destino.","nub"],
["esp",2,"¿Qué es una \"vulnerabilidad\"?",
 ["Uma vulnerabilidade, falha que pode ser explorada por um atacante", "Uma falha de energia no datacenter", "Um erro de digitação em um documento", "Um tipo de ataque de negação de serviço, causado por excesso de acessos simultâneos"],
 "\"Vulnerabilidad\" é um ponto fraco de segurança. \"Parche\" é correção (patch), e \"parchear\" é aplicar a correção.","seg"],
["esp",2,"En una propuesta: \"Quedan fuera del alcance las integraciones con terceros\". ¿Qué significa?",
 ["Integrações com terceiros ficam fora do escopo", "Integrações com terceiros são o foco da proposta", "Integrações serão feitas apenas com o fornecedor", "Integrações serão alcançadas em uma fase posterior, sem custo"],
 "\"Alcance\" também é escopo. \"Quedan fuera\" significa ficam de fora. É a mesma ideia de \"out of scope\" em inglês.","rep"],
["esp",2,"¿Qué significa \"balanceador de carga\"?",
 ["Balanceador de carga, que distribui o tráfego entre vários servidores", "Um equipamento que mede o peso dos servidores no rack e avisa quando passa do limite", "Uma ferramenta que mede a bateria do nobreak e registra o tempo de autonomia em cada queda", "Um tipo de cabo de alimentação"],
 "\"Carga\" é a carga de trabalho (tráfego, requisições). O balanceador distribui as requisições para evitar sobrecarga e aumentar a disponibilidade.","inf"],
["esp",3,"Un cliente escribe: \"Nuestros servidores están al límite de su capacidad\". ¿Cuál es la lectura correcta?",
 ["Os servidores estão no limite da capacidade e precisam de ampliação", "Os servidores estão limitados por contrato de licenciamento e não podem receber novas cargas", "Os servidores estão sobrando em capacidade", "Os servidores acabaram de ser desligados"],
 "\"Al límite de su capacidad\" é no limite da capacidade. Frase típica de dimensionamento: a pergunta seguinte deve ser sobre picos e crescimento.","rep"],
["esp",3,"¿Qué significa \"recuperación ante desastres\"?",
 ["Recuperação de desastres (DR), plano para restaurar sistemas após uma falha grave", "Recuperação de senhas esquecidas", "Recuperação de arquivos apagados da lixeira do sistema pelo próprio usuário, sem apoio da equipe de TI", "Reparação de um equipamento danificado por um acidente físico, dentro do prazo de garantia do fabricante"],
 "\"Ante\" significa diante de. \"Plan de recuperación ante desastres\" é o plano de DR. Os valores de RTO e RPO definem o alvo.","inc"],
["esp",3,"¿Cuál es la traducción correcta de \"incumplimiento del SLA\"?",
 ["Descumprimento do SLA", "Cumprimento do SLA acordado", "Renovação do SLA", "Redução do SLA"],
 "\"Incumplimiento\" é o não cumprimento, e \"cumplimiento\" é conformidade ou cumprimento. Em contratos, o descumprimento pode gerar multas ou créditos.","rep"],
["esp",3,"En un informe: \"La causa raíz fue una regla de firewall mal configurada\". ¿Qué ocurrió?",
 ["A causa raiz foi uma regra de firewall configurada incorretamente", "A causa raiz foi um firewall sem energia", "A causa raiz foi um usuário que perdeu a senha", "A causa raiz foi um ataque externo bem-sucedido contra a rede da empresa, feito por um grupo organizado"],
 "\"Causa raíz\" é causa raiz. \"Mal configurada\" é configurada de modo errado. Relatórios de incidente em espanhol seguem a mesma estrutura dos em português.","inc"],
["esp",3,"¿Qué quiere decir \"cifrado en reposo y en tránsito\"?",
 ["Criptografado quando armazenado e quando em trânsito pela rede", "Criptografado apenas durante a cópia de segurança, mas sem proteção durante o uso normal do sistema", "Criptografado só no momento do login", "Sem criptografia, porém com senha forte"],
 "\"Cifrado\" é criptografado (\"cifrar\" é criptografar). \"En reposo\" é em repouso (no disco), e \"en tránsito\" é enquanto trafega.","seg"],
["esp",3,"¿Qué significa \"pago por uso\"?",
 ["Pagamento por uso, em que se paga apenas pelo que se consome", "Pagamento adiantado de todo o contrato", "Pagamento fixo mensal, independente do consumo, definido no momento da assinatura do contrato", "Pagamento feito apenas ao final do projeto"],
 "É o modelo típico da nuvem. Em espanhol também se diz \"pago por consumo\". Diferente de \"tarifa plana\" (tarifa fixa).","nub"],
["esp",3,"La frase \"Podemos ofrecer una estimación aproximada, sujeta a validación\" significa:",
 ["Podemos oferecer uma estimativa aproximada, sujeita a validação", "Podemos oferecer um preço fixo, sem validação e sem alterações, mesmo que o escopo mude depois", "Podemos oferecer uma auditoria sem custo", "Podemos oferecer uma validação em troca do pagamento antecipado da primeira parcela do contrato"],
 "\"Estimación\" é estimativa, \"aproximada\" é aproximada, e \"sujeta a\" é sujeita a. Importante para deixar claro que o número não é definitivo.","rep"],
["esp",3,"¿Qué es una \"copia de seguridad incremental\"?",
 ["Um backup que guarda apenas o que mudou desde o último backup", "Um backup que copia todos os dados toda vez que é executado, independente de mudanças", "Um backup realizado em fita magnética", "Um backup que apaga os dados originais depois de copiá-los para o destino de armazenamento"],
 "\"Incremental\" salva apenas a variação. Diferente do \"completo\" (total) e do \"diferencial\" (mudanças desde o último completo).","inf"],
["esp",4,"Lea: \"Se requiere alta disponibilidad, escalado horizontal y cifrado de extremo a extremo; no se contempla migración de datos\". ¿Qué NO está incluido en el alcance?",
 ["A migração de dados", "A alta disponibilidade", "O escalonamento horizontal", "A criptografia de ponta a ponta"],
 "\"No se contempla\" significa não está contemplado (não incluído). Os três primeiros itens são requisitos; a migração de dados fica fora, e precisa constar como tal na proposta.","rep"],
["esp",4,"¿Cuál es la mejor traducción de \"Nos comprometemos a restablecer el servicio en un máximo de cuatro horas\"?",
 ["Comprometemo-nos a restabelecer o serviço em no máximo quatro horas", "Pretendemos reiniciar o serviço quatro horas depois de receber o chamado, sem prazo máximo de resolução", "Garantimos o serviço por quatro horas", "Esperamos que o serviço volte em até quatro dias, dependendo da disponibilidade do nosso fornecedor"],
 "\"Restablecer\" é restabelecer, e \"un máximo de\" é no máximo. É um compromisso de tempo de resolução, parecido com um RTO ou SLA de reparo.","inc"],
["esp",4,"Un correo dice: \"Detectamos un acceso no autorizado a la cuenta de administración. Hemos revocado las credenciales y rotado las claves\". ¿Qué se hizo?",
 ["Detectou-se acesso não autorizado, revogaram-se as credenciais e giraram-se as chaves", "Detectou-se acesso autorizado e criaram-se novas contas", "Detectou-se lentidão e reiniciou-se o servidor", "Detectou-se falha de backup e restaurou-se a rede"],
 "\"Revocar\" é revogar, e \"rotar las claves\" é trocar (rotacionar) as chaves. É a resposta esperada a um acesso indevido: conter e trocar segredos.","seg"],
["esp",4,"El cliente pregunta: \"¿Qué ocurre si superamos la cuota?\" ¿Cuál es la respuesta adecuada?",
 ["Explicar o que acontece com cobrança, limites e alertas quando a cota é ultrapassada", "Responder que a cota nunca pode ser ultrapassada e que, se isso acontecer, o serviço é cancelado sem aviso", "Perguntar por que ele não leu o contrato", "Ignorar a pergunta e passar ao preço"],
 "\"Cuota\" é cota ou limite. \"Superar\" é ultrapassar. A resposta deve explicar custo adicional, bloqueio ou degradação, e como configurar alertas.","nub"],
["esp",4,"Una propuesta indica: \"El precio no incluye impuestos ni costes de transferencia de datos\". ¿Qué debe entender el cliente?",
 ["Que impostos e custos de transferência de dados serão cobrados à parte", "Que todos os custos já estão incluídos no preço", "Que a transferência de dados é gratuita", "Que os impostos serão devolvidos ao final"],
 "\"No incluye\" é não inclui. \"Costes\" (Espanha) e \"costos\" (América Latina) são custos. A transferência de saída costuma ser surpresa na fatura.","rep"],
["esp",4,"¿Qué significa \"conmutación por error\" en una arquitectura de alta disponibilidad?",

 "\"Conmutación por error\" é failover. \"Conmutar\" é comutar (trocar). O retorno ao ambiente original é \"conmutación por recuperación\" (failback).","nub"],
["esp",4,"Durante una crisis, el cliente dice: \"Necesitamos un plan de contención inmediato y un informe posterior al incidente\". ¿Qué pide?",
 ["Um plano de contenção imediato e um relatório pós-incidente", "Um plano de expansão e um relatório financeiro", "Um contrato novo e uma auditoria interna", "Um plano de comunicação e uma campanha publicitária"],
 "\"Contención\" é conter o impacto agora. \"Informe posterior al incidente\" é o postmortem, com causa raiz e ações corretivas.","inc"],
["esp",4,"Una cláusula dice: \"El proveedor deberá notificar cualquier brecha de seguridad en un plazo máximo de 72 horas\". ¿Cuál es la interpretación correcta?",
 ["O fornecedor deve notificar qualquer violação de segurança em até 72 horas", "O fornecedor pode notificar a violação em até 72 dias, contados a partir da data de confirmação", "O fornecedor deve notificar apenas violações que causem perda financeira comprovada ao cliente", "O fornecedor deve corrigir a violação em até 72 horas"],
 "\"Brecha de seguridad\" é violação ou incidente de segurança, e \"notificar\" é comunicar. O prazo refere-se à notificação, e não à correção. Padrão comparável ao da LGPD e do GDPR.","seg"],

function sfx(n){

      o.type=s.w||"sine"; o.frequency.setValueAtTime(s.f,a); if(s.f2)o.frequency.exponentialRampToValueAtTime(s.f2,a+s.d);
      g.gain.setValueAtTime(0.0001,a); g.gain.exponentialRampToValueAtTime(s.v||0.16,a+0.015); g.gain.exponentialRampToValueAtTime(0.0001,a+s.d);
      o.connect(g); g.connect(AC.destination); o.start(a); o.stop(a+s.d+0.03);

/* Nota de qualidade: vozes neurais/online soam bem melhor que as vozes compactas instaladas no aparelho. */
function voiceScore(v,lang){
  var vl=String(v.lang||"").replace("_","-").toLowerCase(), L=lang.toLowerCase(), n=String(v.name||""), sc=0;
  if(vl===L)sc+=40; else if(vl.slice(0,2)===L.slice(0,2))sc+=15; else return -999;
  if(/natural|neural|wavenet|premium|enhanced|aprimorad|melhorad|online/i.test(n))sc+=40;
  if(/google/i.test(n))sc+=25;
  if(/microsoft/i.test(n)&&/online/i.test(n))sc+=10;
  if(/luciana|francisca|thalita|antonio|samantha|ava|jenny|aria|elvira|paulina|monica/i.test(n))sc+=8;
  if(/compact|espeak|eloquence|novelty|whisper|bad news|bells|bahh|boing|bubbles|cellos|zarvox|trinoids|superstar|organ|jester|albert|fred|junior|ralph|grandma|grandpa|rocko|shelley|sandy|flo|reed|eddy/i.test(n))sc-=60;
  if(v.localService===false)sc+=5;
  return sc;
}
function voicesFor(lang){
  var vs=[]; try{vs=speechSynthesis.getVoices()||[];}catch(e){}
  return vs.map(function(v){return {v:v,s:voiceScore(v,lang)};}).filter(function(x){return x.s>-999;})
    .sort(function(a,b){return b.s-a.s||String(a.v.name).localeCompare(String(b.v.name));}).map(function(x){return x.v;});
}
function voiceFor(lang){
  var list=voicesFor(lang), key=lang.slice(0,2), want=prefs.voice[key];
  if(want){for(var i=0;i<list.length;i++){if(list[i].voiceURI===want||list[i].name===want)return list[i];}}
  return list[0]||null;
}
function stopVoice(){if(TTS){try{speechSynthesis.cancel();}catch(e){}}}
function say(parts){
  if(!TTS)return;
  stopVoice();
  parts.forEach(function(p){
    var x=String(p.x||"").trim(); if(!x)return;
    var u=new SpeechSynthesisUtterance(x); u.lang=p.l; var v=voiceFor(p.l); if(v)u.voice=v; u.rate=(p.l==="pt-BR"?1:0.92)*prefs.rate;
    try{speechSynthesis.speak(u);}catch(e){}
  });
}
/* Divide o enunciado em trechos: em inglês, o que está entre aspas (ou o termo depois de "significa") vai na voz em inglês. */
function qParts(q,t){
  if(t==="esp")return [{x:q,l:FL.esp}];
  if(t!=="ing")return [{x:q,l:"pt-BR"}];
  if(q.indexOf('"')<0){
    var mm=q.match(/^(.*?significa )(.+?)( em .*|)\?$/);
    return mm?[{x:mm[1],l:"pt-BR"},{x:mm[2],l:FL.ing},{x:mm[3],l:"pt-BR"}]:[{x:q,l:"pt-BR"}];
  }
  var out=[], re=/"([^"]+)"/g, last=0, m;
  while((m=re.exec(q))){out.push({x:q.slice(last,m.index),l:"pt-BR"}); out.push({x:m[1],l:FL.ing}); last=re.lastIndex;}
  out.push({x:q.slice(last),l:"pt-BR"}); return out;
}
function speakQ(){
  var s=sess; if(!s||!s.cur)return;
  try{if(speechSynthesis.speaking){stopVoice();return;}}catch(e){}
  var q=s.cur, fl=FL[q.t]||"pt-BR", parts=qParts(q.q,q.t);
  if(q.type==="order")s.pool.concat(s.ans).sort(function(a,b){return a-b;}).forEach(function(i){parts.push({x:q.items[i],l:fl});});
  else if(q.type==="match"){s.L.forEach(function(i){parts.push({x:q.pairs[i][0],l:fl});}); s.R.forEach(function(i){parts.push({x:q.pairs[i][1],l:"pt-BR"});});}
  else if(q.type==="build")q.slots.forEach(function(sl){parts.push({x:sl.h+".",l:"pt-BR"});});
  else s.opts.forEach(function(o,i){parts.push({x:"ABCD".charAt(i)+".",l:"pt-BR"}); parts.push({x:o.t,l:"pt-BR"});});
  say(parts);
}

}

function qHash(q){
  var t=JSON.stringify([q.q,q.o||q.items||q.pairs||q.slots,q.extra||null,q.e]), h=5381;
  for(var i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0; // NOSONAR: o "|0" aqui é de propósito, mantém o hash em 32 bits (Math.trunc não faz isso)
  return (h>>>0).toString(36);
}

function flagQ(q,note){state.flagged[q.id]={h:qHash(q),note:String(note||"").slice(0,300),at:Date.now()}; save();}
function unflagQ(id){var f=state.flagged[id]; if(f){f.off=true; f.at=Date.now(); save();}}
var fixedOnLoad=0;
(function autoReturn(){
  Object.keys(state.flagged||{}).forEach(function(id){
    var f=state.flagged[id]; if(!f||f.off)return;
    if(!BYID[id]||qHash(BYID[id])!==f.h){f.off=true; f.fixed=true; f.at=Date.now(); fixedOnLoad++;}
  });

function pad(n){return String(n).padStart(2,"0");}
function dkey(d){d=d||new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function addDays(k,n){var p=k.split("-").map(Number);return dkey(new Date(p[0],p[1]-1,p[2]+n));}
function touchDay(){var t=dkey(); if(state.last===t)return; state.streak=(state.last===addDays(t,-1))?state.streak+1:1; state.last=t;}
function addXP(n){var t=dkey(); if(state.day!==t){state.day=t;state.dayXp=0;} state.xp+=n; state.dayXp+=n; var wkk=weekKey(); if(!state.wk||state.wk.k!==wkk)state.wk={k:wkk,xp:0}; state.wk.xp+=n; touchDay();}
function streakNow(){var t=dkey(); return (state.last===t||state.last===addDays(t,-1))?state.streak:0;}
function dayXpNow(){return state.day===dkey()?state.dayXp:0;}
/* Repetição espaçada: toda questão respondida entra na agenda.
   Erro: volta hoje (caixa 0). Acerto: sobe uma caixa e só volta após 1, 3, 7, 14 e 30 dias. */
function dueIds(){
  var t=dkey();
  return Object.keys(state.review).filter(function(id){return BYID[id]&&!isHidden(id)&&state.review[id].due<=t;})
    .sort(function(a,b){var x=state.review[a],y=state.review[b]; if((x.box===0)!==(y.box===0))return x.box===0?-1:1; return x.due<y.due?-1:(x.due>y.due?1:0);});
}
function dueCounts(){var ids=dueIds(),e=0;ids.forEach(function(id){if(state.review[id].box===0)e++;});return {total:ids.length,err:e,fresh:ids.length-e};}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x;}return a;}
function unlocked(t,l){
  if(l===1)return true;
  if(state.placed&&state.placed[t]>=l)return true;
  var p=state.prog[t]&&state.prog[t][l-1]; return !!(p&&p.done);
}

var bkText="", openTrails={};
var view="home", sess=null, res=null, confirmReset=false, showBackup=false;

function newSess(mode,extra){
  var s={mode:mode,i:0,right:0,xpGain:0,missed:[],locked:false,pick:null,opts:[],cur:null,gain:0,total:0};
  for(var k in extra)s[k]=extra[k];
  return s;
}
function startLesson(t,l){
  var group=QS.filter(function(q){return q.t===t&&q.l===l&&!isHidden(q.id);});
  var plain=shuffle(group.filter(function(q){return !q.boss&&!q.type;}));
  var xs=shuffle(group.filter(function(q){return q.type&&q.type!=="build";})).slice(0,1).concat(group.filter(function(q){return q.type==="build";}).slice(0,1));
  var body=shuffle(plain.slice(0,Math.max(0,plain.length-xs.length)).concat(xs));
  var boss=group.filter(function(q){return q.boss;});
  var qs=body.concat(boss);
  sess=newSess("lesson",{t:t,l:l,qs:qs,total:qs.length});
  view="quiz"; loadQ();
}
function startReview(){
  var ids=shuffle(dueIds().slice(0,10));
  if(!ids.length){toast("Nenhuma questão para revisar agora.");return;}
  sess=newSess("review",{qs:ids.map(function(id){return BYID[id];}),total:ids.length});
  view="quiz"; loadQ();
}
function startPlacement(t){
  var seq=[],ptr={}; ptr[t]=2;
  for(var i=0;i<PLACE_Q;i++)seq.push(t);
  sess=newSess("placement",{t:t,seq:seq,ptr:ptr,used:{},total:PLACE_Q});
  view="quiz"; loadQ();
}
function startPlacementAll(){
  var seq=[],ptr={};
  GEN_ORDER.forEach(function(t){ptr[t]=2; for(var i=0;i<PLACE_ALL_Q;i++)seq.push(t);});
  sess=newSess("placement",{all:true,seq:seq,ptr:ptr,used:{},total:seq.length});
  view="quiz"; loadQ();
}
function pickPlacement(t){
  var s=sess, want=s.ptr[t], order=[want,want+1,want-1,want+2,want-2].filter(function(l){return l>=1&&l<=4;});
  for(var n=0;n<order.length;n++){
    var c=QS.filter(function(q){return q.t===t&&q.l===order[n]&&!q.boss&&!s.used[q.id]&&!isHidden(q.id);});
    if(c.length){var q=c[Math.floor(Math.random()*c.length)];s.used[q.id]=1;return q;}
  }
  var any=QS.filter(function(q){return q.t===t&&!s.used[q.id]&&!isHidden(q.id);}); if(!any.length)any=QS.filter(function(q){return q.t===t&&!isHidden(q.id);});
  var q2=any[Math.floor(Math.random()*any.length)]; s.used[q2.id]=1; return q2;
}
function loadQ(){
  var s=sess;
  s.cur=(s.mode==="placement")?pickPlacement(s.seq[s.i]):s.qs[s.i];
  var q=s.cur; s.opts=[]; s.pool=[]; s.ans=[]; s.L=[]; s.R=[]; s.m={}; s.sel=null;
  if(q.type==="order"){
    var idx=q.items.map(function(x,k){return k;}), p=idx;
    for(var tries=0;tries<10&&p.join()===idx.join();tries++)p=shuffle(idx);
    s.pool=p;
  }else if(q.type==="match"){
    var ix=q.pairs.map(function(x,k){return k;}); s.L=shuffle(ix); s.R=shuffle(ix);
    for(var tr=0;tr<10&&s.R.join()===s.L.join();tr++)s.R=shuffle(ix);
  }else if(q.type==="build"){
    s.bopts=shuffle(q.slots.map(function(x){return x.a;}).concat(q.extra));
    s.place=q.slots.map(function(){return -1;}); s.bsel=0;
  }else s.opts=shuffle(q.o.map(function(t,k){return {t:t,ok:k===0};}));
  s.locked=false; s.pick=null; s.ok=false; s.gain=0; s.flagUI=false; stopVoice();
  render(); window.scrollTo(0,0);
}
function pick(i){
  var s=sess; if(s.locked||!s.opts[i])return; s.pick=i; grade(s.opts[i].ok);
}
function checkX(){
  var s=sess, q=s.cur; if(s.locked)return;
  if(q.type==="order"){ if(s.pool.length)return; grade(s.ans.every(function(v,k){return v===k;})); }
  else if(q.type==="match"){ if(Object.keys(s.m).length<q.pairs.length)return; grade(q.pairs.every(function(x,k){return s.m[k]===k;})); }
  else if(q.type==="build"){ if(s.place.indexOf(-1)>=0)return; grade(q.slots.every(function(sl,k){return s.bopts[s.place[k]]===sl.a;})); }
}
function grade(ok){
  var s=sess; if(s.locked)return; s.locked=true; s.ok=ok; stopVoice(); sfx(ok?"ok":"bad");
  var q=s.cur, gain=0;
  if(ok){s.right++; gain=(s.mode==="lesson")?(q.boss?20:10):5;}
  s.xpGain+=gain; s.gain=gain;
  if(gain)addXP(gain); else touchDay();
  var sk=q.t+"."+q.k, ss=state.stats[sk]||{r:0,w:0}; if(ok)ss.r++; else ss.w++; state.stats[sk]=ss;
  var r=state.review[q.id], today=dkey();
  if(!ok){state.review[q.id]={box:0,due:today}; s.missed.push(q.id);}
  else if(!r||r.due<=today){
    var nb=Math.min(5,(r?r.box:0)+1);
    state.review[q.id]={box:nb,due:addDays(today,INT[nb])};
  }
  if(s.mode==="placement"){
    s.ptr[q.t]=ok?Math.min(4,s.ptr[q.t]+1):Math.max(1,s.ptr[q.t]-1);
    if(s.all&&s.seq[s.i+1]!==q.t){if(!state.placed)state.placed={}; state.placed[q.t]=Math.min(3,s.ptr[q.t]);}
  }
  save(); s.held=false; render();
  var fbn=document.getElementById("fb");
  if(fbn){var lim=fbn.getBoundingClientRect().top-12, mb=0; [].forEach.call(document.querySelectorAll(".opt.ok,.opt.bad,.xi.ok:not(.bslot),.xi.bad:not(.bslot)"),function(o){mb=Math.max(mb,o.getBoundingClientRect().bottom);}); if(mb>lim)window.scrollBy({top:mb-lim,behavior:"smooth"});}
  if(ok){ s.timer=setTimeout(function(){ if(sess===s&&view==="quiz"&&s.locked&&!s.held)next(); },AUTO_MS); }
}
function ordTap(i,add){
  var s=sess; if(!s||s.locked)return;
  if(add){var p=s.pool.indexOf(i); if(p<0)return; s.pool.splice(p,1); s.ans.push(i); speakTerm(s.cur.items[i],s.cur.t);}
  else{var a=s.ans.indexOf(i); if(a<0)return; s.ans.splice(a,1); s.pool.push(i);}
  sfx("tap"); render();
}
function bSlot(i){
  var s=sess; if(!s||s.locked)return;
  if(s.place[i]>=0){s.place[i]=-1;}
  s.bsel=i; sfx("tap"); render();
}
function bChip(o){
  var s=sess; if(!s||s.locked||s.place.indexOf(o)>=0)return;
  var i=(s.bsel>=0&&s.place[s.bsel]<0)?s.bsel:s.place.indexOf(-1); if(i<0)return;
  s.place[i]=o;
  var nx=-1; for(var k=1;k<=s.place.length;k++){var j=(i+k)%s.place.length; if(s.place[j]<0){nx=j;break;}}
  s.bsel=nx; sfx("tap"); render();
}
function leftOf(r){var s=sess; for(var k in s.m){if(s.m[k]===r)return Number(k);} return -1;}
function mTap(side,i){
  var s=sess; if(!s||s.locked)return;
  if(side==="L"){
    speakTerm(s.cur.pairs[i][0],s.cur.t);
    if(s.m[i]!==undefined){delete s.m[i]; s.sel={side:"L",i:i};}
    else if(s.sel&&s.sel.side==="R"){s.m[i]=s.sel.i; s.sel=null;}
    else s.sel=(s.sel&&s.sel.side==="L"&&s.sel.i===i)?null:{side:"L",i:i};
  }else{
    var l=leftOf(i);
    if(l>=0){delete s.m[l]; s.sel={side:"R",i:i};}
    else if(s.sel&&s.sel.side==="L"){s.m[s.sel.i]=i; s.sel=null;}
    else s.sel=(s.sel&&s.sel.side==="R"&&s.sel.i===i)?null:{side:"R",i:i};
  }
  sfx("tap"); render();
}
function flagOpen(){
  var s=sess; if(!s)return;
  if(s.timer){clearTimeout(s.timer);s.timer=null;} s.held=true; s.flagUI=true; render();
  var ta=document.getElementById("flagnote"); if(ta&&ta.scrollIntoView)ta.scrollIntoView({block:"center"});
}
function flagConfirm(){
  var s=sess; if(!s)return;
  var ta=document.getElementById("flagnote"), q=s.cur;
  flagQ(q,ta?ta.value:""); s.flagUI=false; stopVoice();

function revIssueURL(ids){
  var lines=["Questões que tirei da trilha para revisão:",""];
  ids.forEach(function(id){var q=BYID[id], f=state.flagged[id];
    lines.push("- `"+id+"` ("+TRAILS[q.t].name+", "+LEVELS[q.l]+"): "+q.q+(f.note?"\n  - Comentário: "+f.note:""));});

function next(){
  var s=sess; if(s.timer){clearTimeout(s.timer);s.timer=null;} s.i++;
  if(s.i>=s.total)finish(); else loadQ();
}
function finish(){
  var s=sess, r={mode:s.mode,right:s.right,total:s.total,xp:s.xpGain,missed:s.missed.length,missedIds:s.missed.slice(),train:s.train||null,bonus:0};
  if(s.mode==="lesson"){
    var need=Math.ceil(s.total*PASS_BY[s.l]); r.need=need; r.pass=s.right>=need; r.t=s.t; r.l=s.l;
    var p=state.prog[s.t][s.l]||{best:0,done:false}, first=r.pass&&!p.done;
    p.best=Math.max(p.best,s.right); p.done=p.done||r.pass; state.prog[s.t][s.l]=p;
    if(first){addXP(20);r.bonus=20;}
  }
  if(s.mode==="placement"){
    if(!state.placed)state.placed={};
    if(s.all){r.all=true; r.levels=GEN_ORDER.map(function(t){var lv=Math.min(3,s.ptr[t]); state.placed[t]=lv; return [t,lv];});}
    else{state.placed[s.t]=s.ptr[s.t]; r.t=s.t; r.level=s.ptr[s.t];}
  }
  save(); res=r; view="result"; stopVoice(); sfx((r.mode==="lesson"&&!r.pass)?"lose":"win"); render(); window.scrollTo(0,0);
}

function temaList(){
  var out=[];
  TRAIL_ORDER.forEach(function(t){
    for(var k in TEMAS[t]){
      var st=state.stats[t+"."+k]; if(!st)continue; var n=st.r+st.w; if(!n)continue;
      out.push({t:t,k:k,n:n,r:st.r,w:st.w,acc:st.r/n,name:TEMAS[t][k].n,dica:TEMAS[t][k].d});
    }
  });
  return out;
}
function weakTemas(limit){
  var all=temaList(), total=all.reduce(function(a,x){return a+x.n;},0);
  if(total<6)return null;
  return all.filter(function(x){return x.n>=2&&x.acc<0.7;}).sort(function(a,b){return a.acc-b.acc||b.n-a.n;}).slice(0,limit);
}
function missedTemas(ids){
  var m={};
  ids.forEach(function(id){var q=BYID[id]; if(!q)return; var key=q.t+"."+q.k; m[key]=(m[key]||0)+1;});
  return Object.keys(m).map(function(key){var p=key.split("."); return {t:p[0],k:p[1],n:m[key],name:TEMAS[p[0]][p[1]].n,dica:TEMAS[p[0]][p[1]].d};}).sort(function(a,b){return b.n-a.n;}).slice(0,3);
}
function startTrain(t,k){
  var pool=QS.filter(function(q){return q.t===t&&q.k===k&&!isHidden(q.id);});
  var wrong=shuffle(pool.filter(function(q){var r=state.review[q.id];return r&&r.box===0;}));
  var fresh=shuffle(pool.filter(function(q){return !state.review[q.id];}));
  var rest=shuffle(pool.filter(function(q){var r=state.review[q.id];return r&&r.box>0;}));
  var qs=wrong.concat(fresh,rest).slice(0,8);
  sess=newSess("review",{qs:qs,total:qs.length,train:{t:t,k:k}});
  view="quiz"; loadQ();
}

function mergeStates(a,b){
  var r=normalize(JSON.parse(JSON.stringify(a)));
  r.xp=Math.max(a.xp||0,b.xp||0);
  var nw=((a.last||"")>=(b.last||""))?a:b; r.streak=nw.streak||0; r.last=nw.last||null; r.day=nw.day||null; r.dayXp=nw.dayXp||0;
  TRAIL_ORDER.forEach(function(t){
    var pa=(a.placed||{})[t]||0,pb=(b.placed||{})[t]||0; if(Math.max(pa,pb))r.placed[t]=Math.max(pa,pb);
    [1,2,3,4].forEach(function(l){
      var x=(a.prog[t]||{})[l],y=(b.prog[t]||{})[l]; if(!x&&!y)return;
      r.prog[t][l]={best:Math.max(x?x.best:0,y?y.best:0),done:!!((x&&x.done)||(y&&y.done))};
    });
  });
  var ids={};Object.keys(a.review||{}).concat(Object.keys(b.review||{})).forEach(function(i){ids[i]=1;});
  r.review={}; Object.keys(ids).forEach(function(i){var x=a.review[i],y=b.review[i]; r.review[i]=!x?y:(!y?x:(x.due>=y.due?x:y));});
  var ks={};Object.keys(a.stats||{}).concat(Object.keys(b.stats||{})).forEach(function(k){ks[k]=1;});
  r.stats={}; Object.keys(ks).forEach(function(k){var x=a.stats[k]||{r:0,w:0},y=b.stats[k]||{r:0,w:0}; r.stats[k]={r:Math.max(x.r||0,y.r||0),w:Math.max(x.w||0,y.w||0)};});
  var fa=a.flagged||{}, fb=b.flagged||{}, fk={}; Object.keys(fa).concat(Object.keys(fb)).forEach(function(i){fk[i]=1;});
  r.flagged={}; Object.keys(fk).forEach(function(i){var x=fa[i],y=fb[i]; r.flagged[i]=!x?y:(!y?x:((x.at||0)>=(y.at||0)?x:y));});
  var wa=a.wk||{k:"",xp:0},wb=b.wk||{k:"",xp:0}; r.wk=wa.k>wb.k?wa:(wb.k>wa.k?wb:{k:wa.k,xp:Math.max(wa.xp||0,wb.xp||0)});
  return r;
}

function cloudPush(){
  if(!C.user||!C.fdb)return Promise.resolve();
  var u=C.user, db=C.fdb, ts=firebase.firestore.FieldValue.serverTimestamp(), ops=[];
  ops.push(db.collection("users").doc(u.uid).set({state:JSON.stringify(state),profile:{nick:C.profile.nick,groups:C.profile.groups,global:C.profile.global},updated:ts}));
  if(C.profile.nick){
    var p=pubDoc();
    C.profile.groups.forEach(function(g){ops.push(db.collection("groups").doc(g.code).collection("members").doc(u.uid).set(p));});
    if(C.profile.global)ops.push(db.collection("global").doc(u.uid).set(p));
  }
  return Promise.all(ops);
}

    if(e&&(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment")){C.fauth.signInWithRedirect(pr);}

function newCode(){var a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",s="";for(var i=0;i<6;i++)s+=a.charAt(Math.floor(Math.random()*a.length));return s;}
function createGroup(name){
  name=cleanNick(name); if(name.length<2){toast("Dê um nome à turma (mínimo 2 letras).");return;}
  if(C.profile.groups.length>=5){toast("Limite de 5 turmas.");return;}
  var tries=0;
  (function go(){
    var code=newCode();
    C.fdb.collection("groups").doc(code).set({name:name,owner:C.user.uid,created:firebase.firestore.FieldValue.serverTimestamp()}).then(function(){
      C.profile.groups.push({code:code,name:name}); C.scope=code; return cloudPush();
    }).then(function(){toast("Turma criada. Código: "+code);loadRank();}).catch(function(){ if(++tries<3)go(); else toast("Não consegui criar a turma agora."); });
  })();
}
function joinGroup(code){
  code=String(code||"").toUpperCase().replace(/[^A-Z0-9]/g,""); if(code.length!==6){toast("O código tem 6 letras/números.");return;}
  if(C.profile.groups.some(function(g){return g.code===code;})){toast("Você já está nessa turma.");C.scope=code;loadRank();return;}
  if(C.profile.groups.length>=5){toast("Limite de 5 turmas.");return;}
  C.fdb.collection("groups").doc(code).get().then(function(d){
    if(!d.exists){toast("Turma não encontrada. Confira o código.");return;}
    C.profile.groups.push({code:code,name:cleanNick(d.data().name)||code}); C.scope=code;
    return cloudPush().then(function(){toast("Você entrou na turma.");loadRank();});
  }).catch(function(){toast("Não consegui entrar na turma agora.");});
}
function leaveGroup(code){

    C.profile.groups=C.profile.groups.filter(function(g){return g.code!==code;}); if(C.scope===code)C.scope="global"; return cloudPush();

  }
  var gs=C.profile.groups, chips='<button class="chipbtn'+(C.scope==="global"?' on':'')+'" data-act="rank-scope" data-s="global">Geral</button>'+gs.map(function(g){return '<button class="chipbtn'+(C.scope===g.code?' on':'')+'" data-act="rank-scope" data-s="'+g.code+'">'+esc(g.name)+'</button>';}).join('');
  h+='<section class="card"><div class="chiprow">'+chips+'</div><div class="chiprow"><button class="chipbtn'+(C.tab==="week"?' on':'')+'" data-act="rank-tab" data-s="week">Esta semana</button><button class="chipbtn'+(C.tab==="all"?' on':'')+'" data-act="rank-tab" data-s="all">Total</button></div>';
  if(C.scope==="global"&&!C.profile.global)h+='<p class="muted">O ranking geral só mostra quem escolheu aparecer. Ative abaixo em "Minha conta" para entrar nele.</p>';
  if(C.scope!=="global"){var g0=gs.filter(function(g){return g.code===C.scope;})[0]; if(g0)h+='<p class="fine">Código para convidar: <b class="code">'+esc(g0.code)+'</b></p>';}
  if(C.rankLoading)h+='<p class="muted">Carregando…</p>';
  else if(C.rank){
    var rows=rankRows(C.rank,C.tab);
    if(!rows.length)h+='<p class="muted">'+(C.rankErr?"Não consegui carregar o ranking agora.":"Ninguém pontuou ainda"+(C.tab==="week"?" nesta semana":"")+". Faça uma lição!")+'</p>';
    else h+='<ol class="rk">'+rows.map(function(m,i){return '<li class="'+(m.me?'me':'')+'"><span class="pos">'+(i+1)+'</span><span class="nm">'+esc(m.nick)+(m.me?' (você)':'')+'</span><b>'+m.xp+' XP</b></li>';}).join('')+'</ol>';
  }
  h+='<button class="secondary" data-act="rank-refresh">Atualizar</button></section>';
  h+='<section class="card"><h2>Turmas</h2><p class="muted">Crie uma turma e passe o código para os amigos, ou entre com um código que recebeu.</p><div class="row"><input id="gname" class="txt" maxlength="20" placeholder="Nome da nova turma"><button class="secondary" data-act="group-create">Criar</button></div><div class="row"><input id="gcode" class="txt" maxlength="6" placeholder="Código de 6 caracteres" autocapitalize="characters"><button class="secondary" data-act="group-join">Entrar</button></div>'+
     gs.map(function(g){return '<div class="prow"><span>'+esc(g.name)+' · <b class="code">'+esc(g.code)+'</b></span><button class="linkbtn" data-act="group-leave" data-s="'+g.code+'">Sair</button></div>';}).join('')+'</section>';
  h+='<section class="card"><h2>Minha conta</h2><div class="row"><input id="nick" class="txt" maxlength="20" value="'+esc(C.profile.nick)+'" aria-label="Apelido"><button class="secondary" data-act="nick-save">Salvar apelido</button></div>'+
     '<label class="chk"><input type="checkbox" id="gl"'+(C.profile.global?' checked':'')+' data-act="global-toggle"> Aparecer no ranking geral (só apelido e XP)</label>'+
     '<p class="fine">Seu e-mail nunca é mostrado. Apagar remove progresso, ranking e a conta da nuvem; o progresso deste aparelho permanece.</p>'+
     '<div class="row"><button class="secondary" data-act="cloud-logout">Sair da conta</button>'+(C.confirmWipe?'<button class="secondary" data-act="wipe-yes">Confirmar: apagar meus dados na nuvem</button><button class="secondary" data-act="wipe-no">Cancelar</button>':'<button class="linkbtn" data-act="wipe">Apagar meus dados na nuvem</button>')+'</div></section>';
  app.innerHTML=h;
}

/* expõe para teste local */
window.__game={QS:QS,state:function(){return state;},C:C,merge:mergeStates,go:function(v){view=v;render();}};
cloudInit();
render();
if(fixedOnLoad)setTimeout(function(){toast(fixedOnLoad===1?"1 questão corrigida voltou para a trilha.":fixedOnLoad+" questões corrigidas voltaram para as trilhas.");},600);
})();
</script>
